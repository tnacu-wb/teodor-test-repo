services:
  dynamodb-local:
    image: amazon/dynamodb-local
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ "$(curl -s -o /dev/null -I -w ''%{http_code}'' http://localhost:8000)" == "400" ]; then exit 0; else exit 1; fi',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  configure-table:
    image: amazon/aws-cli
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      - AWS_ENDPOINT_URL=http://dynamodb-local:8000
      - AWS_DEFAULT_REGION=fake-region
      - AWS_ACCESS_KEY_ID=fakeMyKeyId
      - AWS_SECRET_ACCESS_KEY=fakeSecretAccessKey
      - AWS_MAX_ATTEMPTS=100
    command: 'dynamodb create-table --table-name test --attribute-definitions AttributeName=threeLetterHotelId,AttributeType=S 
      AttributeName=sortKey,AttributeType=S --key-schema AttributeName=threeLetterHotelId,KeyType=HASH 
      AttributeName=sortKey,KeyType=RANGE --billing-mode PAY_PER_REQUEST 
      --stream-specification StreamEnabled=true,StreamViewType=NEW_IMAGE'
  basket_stream_to_dynatrace:
    environment:
      - DDB_TABLE=test
      - DT_API_KEY=${DT_API_KEY:-localtest}
      - AWS_ENDPOINT_URL=http://dynamodb-local:8000
      - AWS_DEFAULT_REGION=fake-region
      - AWS_ACCESS_KEY_ID=fakeMyKeyId
      - AWS_SECRET_ACCESS_KEY=fakeSecretAccessKey
      - DT_ENV=${DT_ENV:-whitbread-non-prod}

    depends_on:
      configure-table:
        condition: service_completed_successfully
    build:
      context: .
      args:
        BUILD_TIMESTAMP: "${BUILD_TIMESTAMP}"
  add-data-1:
    image: amazon/aws-cli
    depends_on:
      basket_stream_to_dynatrace:
        condition: service_healthy
    environment:
      - AWS_ENDPOINT_URL=http://dynamodb-local:8000
      - AWS_DEFAULT_REGION=fake-region
      - AWS_ACCESS_KEY_ID=fakeMyKeyId
      - AWS_SECRET_ACCESS_KEY=fakeSecretAccessKey
    volumes:
      - ./test-data:/test-data
    command: 'dynamodb batch-write-item --request-items file:///test-data/1.json'
  add-data-2:
    image: amazon/aws-cli
    depends_on:
      add-data-1:
        condition: service_completed_successfully
    environment:
      - AWS_ENDPOINT_URL=http://dynamodb-local:8000
      - AWS_DEFAULT_REGION=fake-region
      - AWS_ACCESS_KEY_ID=fakeMyKeyId
      - AWS_SECRET_ACCESS_KEY=fakeSecretAccessKey
    volumes:
      - ./test-data:/test-data
    command: 'dynamodb batch-write-item --request-items file:///test-data/2.json'