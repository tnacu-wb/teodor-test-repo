x-otel-env: &otel-env
  JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_PROPAGATORS: "xray,tracecontext,baggage"
  OTEL_TRACES_SAMPLER: "always_on"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=local,service.namespace=digital-monorepo"

services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.19.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - integration-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - integration-net

  hotel-entity-service:
    image: hotel-entity-service:local
    mem_limit: 896m
    build:
      context: ../../backend/discover-search/services/hotel-entity-service/target
      dockerfile: ../../../../integration-env/dockerfiles/hotel-entity-service.Dockerfile
    ports:
      - "9102:9102"
      - "5015:5015"
    env_file:
      - ./env/hotel-entity-service.env
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "hotel-entity-service"
    volumes:
      - ./otel:/otel:ro
    depends_on:
      otel-collector:
        condition: service_started
      ohip-adapter-service:
        condition: service_healthy
      content-entity-service:
        condition: service_healthy
      rules-agent-entity-service:
        condition: service_healthy
      cdh-adapter-service:
        condition: service_healthy
      company-entity-service:
        condition: service_healthy
      company-service-opera:
        condition: service_healthy
      unleash:
        condition: service_healthy
      wiremock-cdh-auth0:
