  # Serves the Auth0 JWKS and the CDH OAuth token. Both are stack-lifetime authentication
  # plumbing rather than test data: the callers that hit them (the services' JWT decoder and
  # OAuth client) do not propagate the integration suite's scenario baggage header, so a
  # scenario could never scope or reclaim them. Loading them from disk at startup means they
  # exist before any service boots and no test installs them. See ./wiremock/README.
  wiremock-cdh-auth0:
    image: wiremock/wiremock:3.12.1
    mem_limit: 750m
    command: ["--verbose"]
    ports:
      - "8445:8080"
    volumes:
      - ./wiremock/cdh-auth0/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/mappings"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - integration-net

  wiremock-aem:
    image: wiremock/wiremock:3.12.1
    mem_limit: 750m
    command: ["--verbose"]
    ports:
      - "18084:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/mappings"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - integration-net

  # Serves the Opera OAuth token; see the wiremock-cdh-auth0 comment for why it is baked in
  # rather than installed per scenario. Every other Opera mapping is installed by the test.
  wiremock-opera:
    image: wiremock/wiremock:3.12.1
    mem_limit: 750m
    command: ["--verbose"]
    ports:
      - "8443:8080"
    volumes:
      - ./wiremock/opera/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/mappings"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - integration-net

  # Shared Postgres instance: backs Unleash and both rules services. Rules Manager owns
  # migrations; Rules Agent reads the same dedicated 'rulesmanager' database.
  unleash-postgres:
    image: postgres:15-alpine
    mem_limit: 512m
    ports:
      - "5438:5432"   # host 5438 -> container 5432 (matches the service local-profile convention; no overlap with other published ports)
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Gate dependents on the real (post-init) TCP server being up AND the rulesmanager
      # database existing. During init the temp server listens on the unix socket only
      # (listen_addresses=''), so this loopback TCP probe stays red until the init scripts
      # that create rulesmanager have run. pg_isready alone would not verify the DB exists.
      # No password needed: pg_hba trusts loopback (127.0.0.1) connections.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U unleash -d rulesmanager -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - integration-net

  unleash:
    image: unleashorg/unleash-server:latest
    mem_limit: 750m
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: postgres://unleash:unleash@unleash-postgres:5432/unleash
      DATABASE_SSL: "false"
      AUTH_TYPE: none
      LOG_LEVEL: warn
      INIT_BACKEND_API_TOKENS: "default:development.mock-unleash-token"
      IMPORT_FILE: /unleash/import/client-features.import.json
      IMPORT_PROJECT: default
      IMPORT_ENVIRONMENT: development
    volumes:
      - ./unleash/import:/unleash/import:ro
    depends_on:
      unleash-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4242/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - integration-net

