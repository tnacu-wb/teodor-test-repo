  # Shared WireMock: mocks Worldline/PIBA GUID (for piba/spending) and, reusing the same
  # instance, the Datatrans payment gateway (for payment-orchestration-service). Stub
  # mappings for all of these are installed at runtime by the integration-testing framework.
  wiremock-worldline-datatrans:
    image: wiremock/wiremock:3.12.1
    mem_limit: 750m
    command: ["--verbose", "--disable-http2-plain"]
    ports:
      - "8446:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/mappings"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - integration-net

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    user: root
    working_dir: /home/dynamodblocal
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - integration-net

  dynamodb-init:
    image: amazon/aws-cli:latest
    entrypoint: ["/bin/sh", "/init/create-tables.sh"]
    environment:
      AWS_ACCESS_KEY_ID: key
      AWS_SECRET_ACCESS_KEY: secret
      AWS_DEFAULT_REGION: eu-west-1
    volumes:
      - ./dynamodb/init/create-tables.sh:/init/create-tables.sh:ro
    depends_on:
      dynamodb-local:
        condition: service_started
    networks:
      - integration-net

  kafka:
    image: quay.io/strimzi/kafka:latest-kafka-3.4.0
    command:
      - sh
      - -c
      - >-
        bin/kafka-storage.sh format --ignore-formatted -t $${KAFKA_CLUSTER_ID} -c config/kraft/server.properties &&
        exec bin/kafka-server-start.sh config/kraft/server.properties
        --override advertised.listeners=$${KAFKA_ADVERTISED_LISTENERS}
        --override listener.security.protocol.map=$${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
        --override listeners=$${KAFKA_LISTENERS}
    ports:
      - "9092:9092"
    environment:
      LOG_DIR: /tmp/logs
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
    healthcheck:
      test: ["CMD-SHELL", "bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - integration-net

  kafka-init:
    image: quay.io/strimzi/kafka:latest-kafka-3.4.0
    command:
      - sh
      - -c
      - |
        set -eu
        bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic orders --partitions 1 --replication-factor 1
        bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic refunds --partitions 1 --replication-factor 1
        bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic notifications --partitions 1 --replication-factor 1
        bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic payment-authorised --partitions 1 --replication-factor 1
        bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic booking-completed --partitions 1 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - integration-net

  # Temporal workflow engine for payment-orchestration-service. The auto-setup image
  # creates its own 'temporal' and 'temporal_visibility' databases on the shared
  # unleash-postgres (connecting as the superuser 'unleash'); these names do not clash
  # with 'unleash'/'rulesmanager'. Because unleash-postgres has no persistent volume,
  # auto-setup re-runs and recreates the Temporal schema on every startup.
  temporal:
    image: temporalio/auto-setup:1.29.7
    mem_limit: 750m
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: unleash
      POSTGRES_PWD: unleash
      POSTGRES_SEEDS: unleash-postgres
    depends_on:
      unleash-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks:
      - integration-net

  payment-orchestration-service:
    image: payment-orchestration-service:local
    mem_limit: 768m
    build:
      context: ../../backend/book-pay/services/payment-orchestration-service/target
      dockerfile: ../../../../integration-env/dockerfiles/payment-orchestration-service.Dockerfile
    ports:
      - "9200:9200"
      - "5016:5016"
    env_file:
      - ./env/payment-orchestration-service.env
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "payment-orchestration-service"
    volumes:
      - ./otel:/otel:ro
    depends_on:
      otel-collector:
        condition: service_started
      temporal:
        condition: service_healthy
      hotel-reservation-entity-service:
        condition: service_healthy
      payment-methods-entity-service:
        condition: service_healthy
      basket-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      wiremock-worldline-datatrans:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/payment-orchestrator/actuator/health"]
      interval: 10s
      timeout: 30s
      retries: 6
      start_period: 30s
    networks:
      - integration-net

networks:
  integration-net:
    driver: bridge

volumes:
  dynamodb-data:
