receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/drop-actuator:
    error_mode: ignore
    trace_conditions:
      - IsMatch(span.attributes["url.path"], ".*/actuator(/.*)?$")
      - IsMatch(span.attributes["http.route"], ".*/actuator(/.*)?$")
      - IsMatch(span.name, ".*actuator.*")
  batch:

exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318

service:
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - filter/drop-actuator
        - batch
      exporters:
        - otlphttp/jaeger
