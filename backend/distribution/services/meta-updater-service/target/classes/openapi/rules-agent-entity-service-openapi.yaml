info:
  description: "<p>The service reads all the rules' configuration from DB into memory,\
    \ handles the incoming requests from the other components and polls periodically\
    \ (e.g. 60 sec) the database for any updates made by the rule manager service.</p>"
  title: Rules Agent Entity Service API Documentation
  version: 1.0.0-SNAPSHOT
