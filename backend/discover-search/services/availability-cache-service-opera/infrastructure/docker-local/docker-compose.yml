name: wb-opera-avcache-service

services:
  # Database Group
  postgres:
    image: postgres:17-alpine3.22
    container_name: wb_postgres
    restart: always
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wb_postgres_volume:/var/lib/postgresql/data
      - ./init/create_rds_iam.sql:/docker-entrypoint-initdb.d/create_rds_iam.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: pg@whitbread.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

  # Unleash Feature Flag Group
  unleash:
    image: unleashorg/unleash-server:latest
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres/postgres"
      DATABASE_SSL: "false"
      LOG_LEVEL: "warn"
      INIT_CLIENT_API_TOKENS: "default:development.unleash-insecure-api-token,dummy-value"
      ENABLE_OAS: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:4242/health || exit 1
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s

  edge:
    image: unleashorg/unleash-edge:latest
    ports:
      - "3063:3063"
    command:
      - edge
    environment:
      TOKENS: "default:development.unleash-insecure-api-token,dummy-value"
      UPSTREAM_URL: "http://unleash:4242"
    depends_on:
      unleash:
        condition: service_healthy
    healthcheck:
      test: unleash-edge health
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s

  unleash-proxy:
    image: nginx:alpine3.22-slim
    ports:
      - "4243:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  # Redis Group
  redis-single-node-cluster:
    image: bitnami/redis-cluster:8.2.1
    restart: always
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'REDIS_CLUSTER_REPLICAS=0'
      - 'REDIS_NODES=127.0.0.1 127.0.0.1 127.0.0.1'
      - 'REDIS_CLUSTER_CREATOR=yes'
      - 'REDIS_CLUSTER_DYNAMIC_IPS=no'
      - 'REDIS_CLUSTER_ANNOUNCE_IP=127.0.0.1'
    ports:
      - "6379:6379"

  redisinsight:
    image: redis/redisinsight:latest
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_volume:/data
    depends_on:
      - redis-single-node-cluster

volumes:
  wb_postgres_volume:
  redisinsight_volume: