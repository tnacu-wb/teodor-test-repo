server:
  port: "9136"

swagger:
  api:
    version: "1.0.0"

info:
  build:
    groupId: "uk.co.whitbread"
    artifact: "opera-token-service"
    description: "Opera Token Microservice"
    version: "1.0.0"
    git:
      originUrl: "@git.remote.origin.url@"
      branch: "@git.branch@"
      commit:
        id: "@git.commit.id@"
        time: "@git.commit.time@"
        message: "@git.commit.message.short@"
springdoc:
  show-actuator: true
  writer-with-order-by-keys: true

management:
  tracing:
    propagation:
      type: w3c
    baggage:
      correlation:
        fields:
          - x-amzn-trace-id
          - flow-code
          - wb-session-id
        enabled: true
      enabled: true
      remote-fields:
        - x-amzn-trace-id
        - flow-code
        - wb-session-id
  metrics:
    distribution:
      percentiles:
        http.server.requests: [ 0.95, 0.99 ]
      percentiles-histogram:
        http.server.requests: true
      maximum-expected-value:
        http.server.requests: 2000ms
  endpoints:
    web:
      base-path: /tokens/actuator
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
logging:
  level:
    brave: WARN
  configuration:
    debug:
      enabled: true
      exclusions:
        - .*/actuator.*
    mask:
      enabled: true
      fields:
        - hotelCode
        - hotelName
  pattern:
    # Logging pattern containing traceId and spanId; no longer provided through Sleuth by default
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

opera:
  enterprise-id: ${ENTERPRISE_ID:}
  app-key: ${OPERA_APP_KEY:}

spring:
  security:
    oauth2:
      client:
        registration:
          opera:
            client-id: ${OPERA_CLIENT_ID:clientId}
            client-secret: ${OPERA_CLIENT_SECRET:clientSecret}
            authorization-grant-type: client_credentials
            scope: ${OPERA_SCOPE:}
            provider: opera
        provider:
          opera:
            token-uri: ${OPERA_HOST}/${OPERA_AUTH_ENDPOINT:oauth/v1/tokens}

app:
  token:
    refreshAheadMinutes: ${REFRESH_AHEAD_MINUTES:5m}

---
spring.config.activate.on-profile: local

auth:
  rulesEngineHost: http://localhost:9108

logging:
  configuration:
    logger: default
    debug:
      enabled: true
      exclusions:
        - .*/actuator.*
    mask:
      enabled: true
      fields:
        - phoneNumber
        - cardNumber
