server:
  port: 9020

swagger:
  api:
    version: 1.0.0

rules-engine:
  scheduler:
    enabled: false
    cron:
      regex: "*/60 * * * * *"

spring:
  datasource:
    username: sa
    password: sa
    url: jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;INIT=create schema IF NOT EXISTS RULES_ENGINE;
    driver-class-name: org.h2.Driver
  sql:
    init:
      platform: h2
      mode: always

  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: create

logging:
  configuration:
    logger: default