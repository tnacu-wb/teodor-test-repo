server:
  port: "@application.port@"
  shutdown: graceful

spring:
  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate
  datasource:
    username: ${Database_User_Name}
    password: ${Database_Password}
    url: jdbc:postgresql://${Cluster_Read_End_Point}/${Database_Name}
    driver-class-name: org.postgresql.Driver
  lifecycle:
    timeout-per-shutdown-phase: 1m

rules-engine:
  scheduler:
    enabled: true
    cron:
      regex: "*/60 * * * * *"

swagger:
  api:
    version: "@project.version@"

info:
  build:
    groupId: "@project.groupId@"
    artifact: "@project.artifactId@"
    description: "@project.description@"
    version: "@project.version@"
    git:
      originUrl: "@git.remote.origin.url@"
      branch: "@git.branch@"
      commit:
        id: "@git.commit.id@"
        time: "@git.commit.time@"
        message: "@git.commit.message.short@"

springdoc:
  show-actuator: true
  writer-with-order-by-keys: true
  api-docs:
    enabled: true
    path: /v3/api-docs
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html

management:
  tracing:
    propagation:
      type: w3c
    baggage:
      correlation:
        fields:
          - x-amzn-trace-id
          - flow-code
          - wb-session-id
        enabled: true
      enabled: true
      remote-fields:
        - x-amzn-trace-id
        - flow-code
        - wb-session-id
  endpoints:
    web:
      base-path: /v1/rules/actuator
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    distribution:
      percentiles:
        http.server.requests: [ 0.95, 0.99 ]
      percentiles-histogram:
        http.server.requests: true
      maximum-expected-value:
        http.server.requests: 2000ms

logging:
  level:
    uk.co.whitbread: WARN
    brave: WARN
  configuration:
    debug:
      enabled: true
      exclusions:
        - .*/actuator.*

---
spring.config.activate.on-profile: local

rules-engine:
  scheduler:
    enabled: true

logging:
  configuration:
    logger: default
  level:
    uk:
      co:
        whitbread:
          rules:
            agent: DEBUG
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql: TRACE
  pattern:
    # Logging pattern containing traceId and spanId; no longer provided through Sleuth by default
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

spring:
  jpa:
    database: POSTGRESQL
  datasource:
    url: jdbc:postgresql://localhost:5438/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

---
spring:
  config:
    activate:
      on-profile:
        - opera-perf
        - opera-dev
        - opera-qa

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus