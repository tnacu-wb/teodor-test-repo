services:
  postgres:
    image: postgres:14.2
    restart: always
    environment:
      - TZ=UTC
      - PGTZ=UTC
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - '5432:5432'
      #    volumes:
      #      Enable if you want the data persistence on your machine
      #      - ./sql/postgres-data:/var/lib/postgresql/data

  # Unleash Feature Flag Group
  unleash:
    image: unleashorg/unleash-server:latest
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres/postgres"
      DATABASE_SSL: "false"
      LOG_LEVEL: "warn"
      INIT_CLIENT_API_TOKENS: "default:development.unleash-insecure-api-token,dummy-value"
      ENABLE_OAS: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:4242/health || exit 1
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s

  edge:
    image: unleashorg/unleash-edge:latest
    ports:
      - "3063:3063"
    command:
      - edge
    environment:
      TOKENS: "default:development.unleash-insecure-api-token,dummy-value"
      UPSTREAM_URL: "http://unleash:4242"
    depends_on:
      unleash:
        condition: service_healthy
    healthcheck:
      test: unleash-edge health
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s

  unleash-proxy:
    image: nginx:alpine3.22-slim
    ports:
      - "4243:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro