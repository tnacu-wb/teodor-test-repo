events {}

http {

  server {
    listen 80;

    location / {
      # update this from `nonprod` to `prod` to connect to unleash prod from localhost
      proxy_pass https://unleash-nonprod.tooling.opera.whitbread.digital;
      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;

      # update this from `nonprod` to `prod` to connect to unleash prod from localhost
      proxy_set_header Host unleash-nonprod.tooling.opera.whitbread.digital;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
    }
  }
}
