openapi: 3.0.1
info:
  title: OPERA Cloud Cashiering API
  description: APIs to cater for Cashiering related functionality in OPERA Cloud.<br /><br />Cashiering provides access to a guest folio, posting journals, receipt histories, currency calculations, credit card settlements, and check a guest out.<br /><br />Compatible with OPERA Cloud release 21.5.0.0.<br /><br /><p>This document and all content within is available under the Universal Permissive License v 1.0 (https://oss.oracle.com/licenses/upl). Copyright(c) 2020,2022 Oracle and/or its affiliates.</p>
  termsOfService: https://www.oracle.com/legal/terms.html
  contact:
    email: hospitality_apis_ww_grp@oracle.com
  license:
    name: UPL
    url: https://opensource.org/licenses/upl
  version: 21.5.0.0
externalDocs:
  description: Find out more about Oracle Hospitality
  url: https://docs.oracle.com/en/industries/hospitality/integration_platforms.html
servers:
  - url: /csh/v0
paths:
  /hotels/{hotelId}/reservations/{reservationId}/depositFolios:
    post:
      tags:
        - Cashiering
      summary: Create Deposit Folio
      description: You can use this API to create Deposit Folio.
      operationId: postDepositFolio
      parameters:
        - name: reservationId
          in: path
          description: Unique OPERA reservation ID which is used to find reservation
            from OPERA. This ID is a primary identification of a reservation in OPERA.
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - name: hotelId
          in: path
          description: Unique ID of the hotel where reservation is searched based on
            reservation ID.
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - name: authorization
          in: header
          description: Bearer token that needs to be passed which is generated post
            user authentication
          required: true
          schema:
            type: string
        - name: x-app-key
          in: header
          description: Client or Partner’s Application Key
          required: true
          schema:
            pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}$'
            type: string
        - name: x-hotelid
          in: header
          description: Mandatory parameter to identify the hotel code where the end
            user is logged in
          required: true
          schema:
            type: string
        - name: x-externalsystem
          in: header
          description: External system code.
          schema:
            maxLength: 80
            type: string
        - name: Accept-Language
          in: header
          description: Language code
          schema:
            type: string
      requestBody:
        description: Request to create a Deposit Folio for a reservation.
        content:
          '*/*':
            schema:
              allOf:
                - $ref: '#/components/schemas/depositFolioCriteria'
                - type: object
                  example: {}
        required: true
      responses:
        201:
          description: Response to the request to create a Deposit Folio for a reservation.
          headers:
            Content-Language:
              description: Audience language
              schema:
                pattern: '[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*'
                type: string
            Location:
              description: Location of newly created resource
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postedDepositFolio'
            application/json:
              example: {}
      x-codegen-request-body-name: depositFolioCriteria
  /csh/v1/hotels/{{hotelId}/depositFolio:
    get:
      tags:
        - Cashiering
      summary: Get Deposit Folio
      description: You can use this API to get Deposit Folio.
      operationId: getDepositFolio
      parameters:
        - name: reservationId
          in: path
          description: Unique OPERA reservation ID which is used to find reservation
            from OPERA. This ID is a primary identification of a reservation in OPERA.
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - name: hotelId
          in: path
          description: Unique ID of the hotel where reservation is searched based on
            reservation ID.
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - name: authorization
          in: header
          description: Bearer token that needs to be passed which is generated post
            user authentication
          required: true
          schema:
            type: string
        - name: x-app-key
          in: header
          description: Client or Partner’s Application Key
          required: true
          schema:
            pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}$'
            type: string
        - name: x-hotelid
          in: header
          description: Mandatory parameter to identify the hotel code where the end
            user is logged in
          required: true
          schema:
            type: string
        - name: x-externalsystem
          in: header
          description: External system code.
          schema:
            maxLength: 80
            type: string
        - name: Accept-Language
          in: header
          description: Language code
          schema:
            type: string
      responses:
        200:
          description: Response to the request to get a Deposit Folio for a reservation.
          headers:
            Content-Language:
              description: Audience language
              schema:
                pattern: '[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*'
                type: string
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/retrievedDepositFolio'
            application/json:
              example: {}
components:
  schemas:
    depositFolioCriteria:
      type: object
      properties:
        criteria:
          $ref: '#/components/schemas/depositFolioCriteriaType'
        links:
          $ref: '#/components/schemas/links'
        warnings:
          $ref: '#/components/schemas/warningsType'
      description: Request to create a Deposit Folio for a reservation.
    warningsType:
      type: array
      description: Used in conjunction with the Success element to define a business error.
      maxItems: 4000
      items:
        $ref: '#/components/schemas/warningType'
    warningType:
      type: object
      description: Used when a message has been successfully processed to report any warnings or business errors that occurred.
      properties:
        value:
          type: string
          description: Property Value
        shortText:
          description: An abbreviated version of the error in textual format.
          type: string
          maxLength: 2000
        code:
          description: If present, this refers to a table of coded values exchanged between applications to identify errors or warnings.
          type: string
          minLength: 0
          maxLength: 20
        docURL:
          description: If present, this URL refers to an online description of the error that occurred.
          type: string
          maxLength: 2000
        status:
          description: If present, recommended values are those enumerated in the ErrorRS, (NotProcessed Incomplete Complete Unknown) however, the data type is designated as string data, recognizing that trading partners may identify additional status conditions not included in the enumeration.
          type: string
          maxLength: 2000
        tag:
          description: If present, this attribute may identify an unknown or misspelled tag that caused an error in processing. It is recommended that the Tag attribute use XPath notation to identify the location of a tag in the event that more than one tag of the same name is present in the document. Alternatively, the tag name alone can be used to identify missing data [Type=ReqFieldMissing].
          type: string
          maxLength: 2000
        recordId:
          description: If present, this attribute allows for batch processing and the identification of the record that failed amongst a group of records. This value may contain a concatenation of a unique failed transaction ID with specific record(s) associated with that transaction.
          type: string
          maxLength: 2000
        type:
          description: The Warning element MUST contain the Type attribute that uses a recommended set of values to indicate the warning type. The validating XSD can expect to accept values that it has NOT been explicitly coded for and process them by using Type =\Unknown\.
          type: string
          minLength: 0
          maxLength: 20
        language:
          description: Language identification.
          type: string
          pattern: '[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*'
        rph:
          description: Reference Place Holder used as an index for this warning.
          type: string
          minLength: 1
          maxLength: 8
    links:
      type: array
      items:
        $ref: '#/components/schemas/instanceLink'
    instanceLink:
      type: object
      description: Metadata describing link description objects that MAY appear in the JSON instance representation.
      properties:
        href:
          description: URI [RFC3986] or URI Template [RFC6570]. If the value is set to URI Template, then the \templated\ property must be set to true.
          type: string
        rel:
          description: Name of the link relation that, in addition to the type property, can be used to retrieve link details. For example, href or profile.
          type: string
        templated:
          description: Boolean flag that specifies that \href\ property is a URI or URI Template. If the property is a URI template, set this value to true. By default, this value is false.
          type: boolean
          default: false
        method:
          description: HTTP method for requesting the target of the link.
          type: string
          enum:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
            - HEAD
        targetSchema:
          description: Link to the metadata of the resource, such as JSON-schema, that describes the resource expected when dereferencing the target resource..
          type: string
        operationId:
          description: The operationId of the path you can call to follow this link.  This allows you to look up not only the path and method, but the description of that path and any parameters you need to supply.
          type: string
        title:
          description: Exact copy of the \summary\ field on the linked operation.
          type: string
      required:
        - href
        - rel
        - method
        - operationId
    depositFolioCriteriaType:
      type: object
      properties:
        hotelId:
          maxLength: 20
          minLength: 0
          type: string
          description: Holds Hotel Code.
        charges:
          $ref: '#/components/schemas/chargesCriteriaType'
        payments:
          maxItems: 4000
          type: array
          description: The payment information to be posted.
          items:
            $ref: '#/components/schemas/paymentCriteriaType'
        fiscalFolioInfo:
          $ref: '#/components/schemas/fiscalServiceType'
        incomeAuditDate:
          description: Date of the Audit. This is used when postings are being created using the Income Audit functionality.
          type: string
          format: date
          maxLength: 8
        fiscalTerminalId:
          type: string
          description: Applicable for Fiscal Terminal. The ID of the terminal where the fiscal device is connected.
        folioNameValue:
          description: Custom Folio Name Value Informatoin to be saved
          type: array
          maxItems: 4000
          items:
            $ref: '#/components/schemas/nameValueHeaderDetailType'
        trxServiceType:
          description: Transaction service type which the Folio is being associated.
          type: string
          minLength: 0
          maxLength: 20
        cashierId:
          $ref: '#/components/schemas/cashierId'
        reservationId:
          $ref: '#/components/schemas/reservationId'
        profileId:
          $ref: '#/components/schemas/profileId'
        guaranteeCode:
          description: New guarantee code associated with reservation.
          type: string
          minLength: 0
          maxLength: 20
        depositPolicyId:
          $ref: '#/components/schemas/uniqueID_Type'
        paymentMethod:
          $ref: '#/components/schemas/reservationPaymentMethodType'
        simpleFolio:
          description: This flag signifies that generated Folio is Normal or Simple Folio. Certain countries of the World mandate a simple folio when the invoice amount is less than defined threshold.
          type: boolean
        overrideInventoryCheck:
          description: Flag to indicate if the Inventory check has to be overridden when the guarantee code of the reservation is changed.
          type: boolean
        manualFolioNo:
          description: Manual Folio Number used for deposit folio.This applies to certain country requirements.
          type: integer
    reservationPaymentMethodType:
      type: object
      properties:
        paymentCard:
          $ref: '#/components/schemas/resPaymentCardType'
        balance:
          $ref: '#/components/schemas/currencyAmountType'
        authorizationRule:
          $ref: '#/components/schemas/authorizationRuleType'
        emailFolioInfo:
          description: Information on an email for the customer.
          type: object
          properties:
            email:
              $ref: '#/components/schemas/emailType'
            emailFolio:
              type: boolean
            id:
              description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
              type: string
              minLength: 0
              maxLength: 80
            type:
              description: A reference to the type of object defined by the UniqueID element.
              type: string
              minLength: 0
              maxLength: 40
        paymentMethod:
          type: string
          minLength: 0
          maxLength: 20
        description:
          type: string
          minLength: 0
          maxLength: 2000
        folioView:
          type: integer
    emailType:
      type: object
      description: Information on an email for the customer.
      properties:
        emailAddress:
          description: Defines the e-mail address.
          type: string
          minLength: 0
          maxLength: 2000
        type:
          description: Defines the purpose of the e-mail address (e.g. personal, business, listserve).
          type: string
          minLength: 0
          maxLength: 20
        typeDescription:
          description: Describes the Type code
          type: string
          minLength: 0
          maxLength: 2000
        emailFormat:
          description: Supported Email format.
          type: string
          enum:
            - Html
            - Text
        primaryInd:
          description: When true, indicates a primary information.
          type: boolean
        orderSequence:
          description: Display Order sequence.
          type: number
        createDateTime:
          description: Time stamp of the creation.
          type: string
          format: date-time
        creatorId:
          description: ID of creator. The creator could be a software system identifier or an identifier of an employee resposible for the creation.
          type: string
          minLength: 0
          maxLength: 200
        lastModifyDateTime:
          description: Time stamp of last modification.
          type: string
          format: date-time
        lastModifierId:
          description: Identifies the last software system or person to modify a record.
          type: string
          minLength: 0
          maxLength: 200
        purgeDate:
          description: Date an item will be purged from a database (e.g. from a live database to an archive).
          type: string
          format: date
          maxLength: 8
    authorizationRuleType:
      type: object
      description: Configured rule for computing the amount to authorize.
      properties:
        code:
          description: The authorization rule code.
          type: integer
          pattern: '[0-9]{1,9}'
        amount:
          $ref: '#/components/schemas/currencyAmountType'
        percent:
          description: A percentage value if the authorization rule is percentage based.
          type: number
    currencyAmountType:
      type: object
      description: A monetary value expressed with a currency code.
      properties:
        amount:
          description: A monetary amount.
          type: number
        currencyCode:
          description: Provides a currency code to reflect the currency in which an amount may be expressed.
          type: string
          minLength: 3
          maxLength: 3
    resPaymentCardType:
      type: object
      description: Information on a credit card for the customer.
      properties:
        cardId:
          $ref: '#/components/schemas/uniqueID_Type'
        currentAuthorizedAmount:
          $ref: '#/components/schemas/currencyAmountType'
        approvalAmountNeeded:
          $ref: '#/components/schemas/currencyAmountType'
        approvalCode:
          description: Approval code sent by the credit card company on a successful authorization.
          type: string
          minLength: 0
          maxLength: 20
        cardType:
          $ref: '#/components/schemas/cardTypeType'
        userDefinedCardType:
          description: Indicates the user defined credit card type if credit card type from a defined list is not provided
          type: string
          minLength: 0
          maxLength: 2
        cardNumber:
          type: string
          minLength: 0
          maxLength: 80
        cardNumberMasked:
          type: string
          minLength: 0
          maxLength: 80
        cardNumberLast4Digits:
          type: string
          minLength: 0
          maxLength: 80
        expirationDate:
          description: Expiration date of the credit card
          type: string
          format: date
          maxLength: 8
        expirationDateMasked:
          description: Masked Expiration date of the credit card
          type: string
          minLength: 0
          maxLength: 20
        expirationDateExpired:
          type: boolean
        cardHolderName:
          type: string
          minLength: 0
          maxLength: 200
        attachCreditCardToProfile:
          description: Attach the credit card to profile.
          type: boolean
        processing:
          $ref: '#/components/schemas/cardProcessingType'
        swiped:
          type: boolean
        cardPresent:
          description: Flag to determine if the credit card was swiped/manually entered , This element is only used when PAYMENT SERVICE DIRECTIVE(PSD) Opera Control is active.
          type: boolean
        cardOrToken:
          $ref: '#/components/schemas/cardNumberTypeType'
        citId:
          description: Customer Initiated Transaction(CIT) Id for Credit Cards. This is only used when PAYMENT SERVICES DIRECTIVE (PSD2) Opera Control is active.
          type: string
          minLength: 0
          maxLength: 30
    cardNumberTypeType:
      type: string
      description: Simple type for indicating if credit card number is tokenized.
      enum:
        - CardNumber
        - Token
    cardProcessingType:
      type: string
      enum:
        - Eft
        - Manual
    cardTypeType:
      type: string
      description: This is required for Credit Card Payment Methods. This indicates the type of Credit Card associated with this payment method.
      enum:
        - Ab
        - Am
        - Ax
        - Cb
        - Dc
        - Ds
        - Dt
        - Ec
        - Er
        - Jc
        - Jl
        - Mc
        - Nb
        - So
        - St
        - Sw
        - Va
        - Xy
        - Zz
        - Cp
        - Cu
    uniqueID_Type:
      type: object
      description: An identifier used to uniquely reference an object in a system (e.g. an airline reservation reference, customer profile reference, booking confirmation number, or a reference to a previous availability quote).
      properties:
        id:
          description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
          type: string
          minLength: 0
          maxLength: 80
        type:
          description: A reference to the type of object defined by the UniqueID element.
          type: string
          minLength: 0
          maxLength: 40
    profileId:
      type: object
      description: An identifier used to uniquely reference an object in a system (e.g. an airline reservation reference, customer profile reference, booking confirmation number, or a reference to a previous availability quote).
      properties:
        url:
          description: URL that identifies the location associated with the record identified by the UniqueID.
          type: string
        type:
          description: A reference to the type of object defined by the UniqueID element. Refer to OpenTravel Code List Unique ID Type (UIT).
          type: string
          minLength: 0
          maxLength: 20
        instance:
          description: The identification of a record as it exists at a point in time. An instance is used in update messages where the sender must assure the server that the update sent refers to the most recent modification level of the object being updated.
          type: string
          minLength: 0
          maxLength: 80
        idContext:
          description: Used to identify the source of the identifier (e.g. IATA, ABTA).
          type: string
          minLength: 0
          maxLength: 80
        id:
          description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
          type: string
          minLength: 0
          maxLength: 80
        idExtension:
          description: Additional identifying value assigned by the creating system.
          type: integer
    reservationId:
      type: object
      description: An identifier used to uniquely reference an object in a system (e.g. an airline reservation reference, customer profile reference, booking confirmation number, or a reference to a previous availability quote).
      properties:
        url:
          description: URL that identifies the location associated with the record identified by the UniqueID.
          type: string
        type:
          description: A reference to the type of object defined by the UniqueID element. Refer to OpenTravel Code List Unique ID Type (UIT).
          type: string
          minLength: 0
          maxLength: 20
        instance:
          description: The identification of a record as it exists at a point in time. An instance is used in update messages where the sender must assure the server that the update sent refers to the most recent modification level of the object being updated.
          type: string
          minLength: 0
          maxLength: 80
        idContext:
          description: Used to identify the source of the identifier (e.g. IATA, ABTA).
          type: string
          minLength: 0
          maxLength: 80
        id:
          description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
          type: string
          minLength: 0
          maxLength: 80
        idExtension:
          description: Additional identifying value assigned by the creating system.
          type: integer
    cashierId:
      type: number
      description: The Cashier ID of the Cashier who is currently processing the transaction(s).
    nameValueHeaderDetailType:
      type: object
      description: Name value details collected before Folio Settlement
      properties:
        nameValueHeader:
          $ref: '#/components/schemas/nameValueBaseSearchType'
        nameValueDetails:
          $ref: '#/components/schemas/nameValueDetailType'
    nameValueDetailType:
      type: object
      description: Detailed information returned during name value search.
      properties:
        nameValues:
          $ref: '#/components/schemas/nameValuesType'
    nameValuesType:
      type: array
      description: List of name value pairs.
      maxItems: 4000
      items:
        $ref: '#/components/schemas/nameValueType'
    nameValueType:
      type: object
      description: Contains name value pair.
      properties:
        name:
          description: Contains unique key which represents for record field.
          type: string
          minLength: 0
          maxLength: 100
        value:
          description: Contains value for the record/column.
          type: string
          minLength: 0
          maxLength: 4000
        formatString:
          description: Contains format string for values.
          type: string
          minLength: 0
          maxLength: 100
        dataType:
          $ref: '#/components/schemas/nameValueDataTypeType'
        origin:
          $ref: '#/components/schemas/nameValueOriginType'
        usageInstruction:
          $ref: '#/components/schemas/codeListType'
    codeListType:
      type: array
      maxItems: 4000
      items:
        type: string
        minLength: 0
        maxLength: 20
    nameValueOriginType:
      type: object
      description: Contains origin details.
      properties:
        originName:
          $ref: '#/components/schemas/nameValueModuleType'
        destination:
          description: Contains destination column for Origin.
          type: string
          minLength: 0
          maxLength: 200
        id:
          description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
          type: string
          minLength: 0
          maxLength: 80
        type:
          description: A reference to the type of object defined by the UniqueID element.
          type: string
          minLength: 0
          maxLength: 40
    nameValueModuleType:
      type: string
      enum:
        - Reservation
        - Folio
        - Profile
        - Fintrix
    nameValueDataTypeType:
      type: string
      enum:
        - String
        - Number
        - Date
        - Datetime
        - Time
        - Integer
    nameValueBaseSearchType:
      type: object
      description: Contains name value information search criteria.
      properties:
        hotelId:
          description: Specifies the hotel code.
          type: string
          minLength: 0
          maxLength: 20
        moduleName:
          $ref: '#/components/schemas/nameValueModuleType'
        nameValueType:
          $ref: '#/components/schemas/nameValueTypeType'
        sequence:
          $ref: '#/components/schemas/uniqueID_Type'
        configName:
          $ref: '#/components/schemas/customNameValueConfigType'
    customNameValueConfigType:
      type: string
      description: Italian Lottery Number.
      enum:
        - ItalianFattura
        - Folio
        - FinancialTransaction
        - TaiwanInvoice
        - SaudiCustomerType
        - ItalianLotteryNumber
    nameValueTypeType:
      type: string
      enum:
        - ReservationOptions
        - AfterSettlement
        - BeforeSettlement
        - AfterPayment
        - ProfileOptions
    fiscalServiceType:
      type: object
      description: Generate Fiscal Folio Criteria type to be used for fiscal folio generation,
      properties:
        fiscalTerminal:
          description: Applicable for Fiscal Terminal. The ID of the terminal where the fiscal device is connected.
          type: string
          minLength: 0
          maxLength: 40
        invoiceCurrencyCode:
          description: Fiscal Invoicing Currency code to be used by the Fiscal Service.
          type: string
          minLength: 0
          maxLength: 20
        instructions:
          $ref: '#/components/schemas/fiscalFolioInstruction'
        folioQueueName:
          $ref: '#/components/schemas/folioQueueType'
        folioSeqId:
          $ref: '#/components/schemas/uniqueID_Type'
    folioQueueType:
      type: object
      description: List of charges that will be posted against the transaction code based from the test criteria.
      properties:
        folioType:
          description: Folio Type to be assigned to generated folio. This is a country requirement.
          type: string
          minLength: 0
          maxLength: 100
        queueName:
          description: Folio Queue name.
          type: string
          minLength: 0
          maxLength: 2000
        generateFiscalFolio:
          description: Fiscal folio flag to call fiscal folio web service after folio generation.
          type: boolean
    fiscalFolioInstruction:
      type: string
      description: Action to generate Offline folio when no reponse is received from fiscal service.
      enum:
        - Retry
        - New
        - Void
        - Offline
    paymentCriteriaType:
      type: object
      properties:
        hotelId:
          description: Property code.
          type: string
          minLength: 0
          maxLength: 20
        paymentMethod:
          $ref: '#/components/schemas/cashieringPaymentMethodType'
        postingAmount:
          $ref: '#/components/schemas/currencyAmountType'
        postingReference:
          description: User-defined posting reference.
          type: string
          minLength: 0
          maxLength: 2000
        postingRemark:
          description: User-defined posting remark.
          type: string
          minLength: 0
          maxLength: 2000
        comments:
          description: User Defined Comments. Used for Deposit Payment postings.
          type: string
          minLength: 0
          maxLength: 2000
        applyCCSurcharge:
