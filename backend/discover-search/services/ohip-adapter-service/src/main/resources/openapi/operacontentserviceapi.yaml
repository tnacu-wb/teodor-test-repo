openapi: 3.0.1
info:
  title: OPERA Cloud Content Service
  description: "Opera Content Service offers capability to manage large content such\
    \ as images and files.<br /><br />Compatible with OPERA Cloud release 23.5.<br\
    \ /><br /><p>This document and all content within is available under the Universal\
    \ Permissive License v 1.0 (https://oss.oracle.com/licenses/upl). Copyright (c)\
    \ 2020,2023 Oracle and/or its affiliates.</p><br /><br /> Compatible with OPERA\
    \ Cloud release 23.5.<br /><br /><p> This document and all content within is available\
    \ under the Universal Permissive License v 1.0 (https://oss.oracle.com/licenses/upl).\
    \ Copyright (c) 2020, 2023 Oracle and/or its affiliates.</p>"
  termsOfService: https://www.oracle.com/legal/terms.html
  contact:
    email: hospitality-integrations_ww@oracle.com
  license:
    name: UPL
    url: https://opensource.org/licenses/upl
  version: "23.5"
externalDocs:
  description: Find out more about Oracle Hospitality
  url: https://docs.oracle.com/en/industries/hospitality/integration_platforms.html
servers:
  - url: /med/config/v1
tags:
  - name: OperaContent
    description: Opera Content Service offers capability to manage big content using
      MTOM
paths:
  /customizedLetter/{letterId}:
    get:
      tags:
        - OperaContent
      summary: Get customized letter
      description: "Use this API to return a customized letter based on search criteria\
        \ such as letterId, letterIdContext, letterIdtype. <p><strong>OperationId:</strong>getCustomizedLetter</p>"
      operationId: getCustomizedLetter
      parameters:
        - name: letterId
          in: path
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - name: letterIdContext
          in: query
          description: "Used to identify the source of the identifier (e.g., IATA, ABTA)."
          schema:
            type: string
        - name: letterIdtype
          in: query
          description: A reference to the type of object defined by the UniqueID element.
          schema:
            type: string
        - name: authorization
          in: header
          description: Bearer token that needs to be passed which is generated post
            user authentication
          required: true
          schema:
            type: string
        - name: x-app-key
          in: header
          description: Client or Partner's Application Key
          required: true
          schema:
            pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}$"
            type: string
        - name: x-hotelid
          in: header
          description: Mandatory parameter to identify the hotel code where the end
            user is logged in
          required: true
          schema:
            type: string
        - name: x-externalsystem
          in: header
          description: External system code.
          schema:
            maxLength: 80
            type: string
        - name: Accept-Language
          in: header
          description: Language code
          schema:
            type: string
      responses:
        "200":
          description: Response object for retrieving customized letter.
          headers:
            Content-Language:
              description: Audience language
              schema:
                pattern: "[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*"
                type: string
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/customizedLetter'
        "204":
          description: CustomizedLetter not found.
          content: {}
  /emailFile/{emailId}:
    get:
      tags:
        - OperaContent
      summary: Get Email Blob File
      description: Use this API to retrieve email Blob File Stored in File Storage
        Schema.Its used in  Profiles to fetch Email and Open in an end user's mail
        client. <p><strong>OperationId:</strong>getEmailFile</p>
      operationId: getEmailFile
      parameters:
        - name: emailId
          in: path
          description: Unique OPERA Email ID which is used to find an Email BLOB File
            from OPERA. This ID is a primary identification of an email file in OPERA.
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - name: authorization
          in: header
          description: Bearer token that needs to be passed which is generated post
            user authentication
          required: true
          schema:
            type: string
        - name: x-app-key
          in: header
          description: Client or Partner's Application Key
          required: true
          schema:
            pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}$"
            type: string
        - name: x-hotelid
          in: header
          description: Mandatory parameter to identify the hotel code where the end
            user is logged in
          required: true
          schema:
            type: string
        - name: x-externalsystem
          in: header
          description: External system code.
          schema:
            maxLength: 80
            type: string
        - name: Accept-Language
          in: header
          description: Language code
          schema:
            type: string
      responses:
        "200":
          description: Response to fetch an email file
          headers:
            Content-Language:
              description: Audience language
              schema:
                pattern: "[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*"
                type: string
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/emailFile'
        "204":
          description: EmailFile not found.
          content: {}
  /fileAttachments:
    get:
      tags:
        - OperaContent
      summary: Get file attachment
      description: "Use this API to return file attachments based on search criteria\
        \ such as id, idContext, idType. <p><strong>OperationId:</strong>getFileAttachment</p>"
      operationId: getFileAttachment
      parameters:
        - name: id
          in: query
          description: A unique identifying value assigned by the creating system. The
            ID attribute may be used to reference a primary-key value within a database
            or in a particular implementation.
          schema:
            type: string
        - name: idContext
          in: query
          description: "Used to identify the source of the identifier (e.g., IATA, ABTA)."
          schema:
            type: string
        - name: idType
          in: query
          description: A reference to the type of object defined by the UniqueID element.
          schema:
            type: string
        - name: authorization
          in: header
          description: Bearer token that needs to be passed which is generated post
            user authentication
          required: true
          schema:
            type: string
        - name: x-app-key
          in: header
          description: Client or Partner's Application Key
          required: true
          schema:
            pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}$"
            type: string
        - name: x-hotelid
          in: header
          description: Mandatory parameter to identify the hotel code where the end
            user is logged in
          required: true
          schema:
            type: string
        - name: x-externalsystem
          in: header
          description: External system code.
          schema:
            maxLength: 80
            type: string
        - name: Accept-Language
          in: header
          description: Language code
          schema:
            type: string
      responses:
        "200":
          description: Response to fetch file attachment
          headers:
            Content-Language:
              description: Audience language
              schema:
                pattern: "[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*"
                type: string
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/file'
        "204":
          description: FileAttachment not found.
          content: {}
    post:
      tags:
        - OperaContent
      summary: Upload a file attachment
      description: Use this API to create a file attachment. <p><strong>OperationId:</strong>uploadFileAttachment</p>
      operationId: uploadFileAttachment
      parameters:
        - name: authorization
          in: header
          description: Bearer token that needs to be passed which is generated post
            user authentication
          required: true
          schema:
            type: string
        - name: x-app-key
          in: header
          description: Client or Partner's Application Key
          required: true
          schema:
            pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}$"
            type: string
        - name: x-hotelid
          in: header
          description: Mandatory parameter to identify the hotel code where the end
            user is logged in
          required: true
          schema:
            type: string
        - name: x-externalsystem
          in: header
          description: External system code.
          schema:
            maxLength: 80
            type: string
        - name: Accept-Language
          in: header
          description: Language code
          schema:
            type: string
      requestBody:
        description: Request to upload a file attachment.
        content:
          application/json;charset=UTF-8:
            schema:
              allOf:
                - $ref: '#/components/schemas/fileToUpload'
        required: true
      responses:
        "201":
          description: HATEOAS links which help the consumer to navigate to resources
          headers:
            Content-Language:
              description: Audience language
              schema:
                pattern: "[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*"
                type: string
            Location:
              description: Location of newly created resource
              schema:
                type: string
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/status'
      x-codegen-request-body-name: fileToUpload
  /folioReports/email:
    post:
      tags:
        - OperaContent
      summary: Email folio report
      description: Use this APU to email folio report. <p><strong>OperationId:</strong>emailFolioReport</p>
      operationId: emailFolioReport
      parameters:
        - name: authorization
          in: header
          description: Bearer token that needs to be passed which is generated post
            user authentication
          required: true
          schema:
            type: string
        - name: x-app-key
          in: header
          description: Client or Partner's Application Key
          required: true
          schema:
            pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}$"
            type: string
        - name: x-hotelid
          in: header
          description: Mandatory parameter to identify the hotel code where the end
            user is logged in
          required: true
          schema:
            type: string
        - name: x-externalsystem
          in: header
          description: External system code.
          schema:
            maxLength: 80
            type: string
        - name: Accept-Language
          in: header
          description: Language code
          schema:
            type: string
      requestBody:
        description: Request to generate and email a folio report.
        content:
          application/json;charset=UTF-8:
            schema:
              allOf:
                - $ref: '#/components/schemas/folioReportToEmail'
        required: true
      responses:
        "201":
          description: HATEOAS links which help the consumer to navigate to resources
          headers:
            Content-Language:
              description: Audience language
              schema:
                pattern: "[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*"
                type: string
            Location:
              description: Location of newly created resource
              schema:
                type: string
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/status'
      x-codegen-request-body-name: folioReportToEmail
  /hotels/{hotelId}/reservations/{reservationId}/customizedLetter:
    put:
      tags:
        - OperaContent
      summary: Set customized letter
      description: "Use this API to set a customized letter for a specific reservation\
        \ based on the hotelId, reservationId, customizedLetter. <p><strong>OperationId:</strong>setCustomizedLetter</p>"
      operationId: setCustomizedLetter
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - name: hotelId
          in: path
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - name: authorization
          in: header
          description: Bearer token that needs to be passed which is generated post
            user authentication
          required: true
          schema:
            type: string
        - name: x-app-key
          in: header
          description: Client or Partner's Application Key
          required: true
          schema:
            pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}$"
            type: string
        - name: x-hotelid
          in: header
          description: Mandatory parameter to identify the hotel code where the end
            user is logged in
          required: true
          schema:
            type: string
        - name: x-externalsystem
          in: header
          description: External system code.
          schema:
            maxLength: 80
            type: string
        - name: Accept-Language
          in: header
          description: Language code
          schema:
            type: string
      requestBody:
        description: Request to save customized letter.
        content:
          application/json;charset=UTF-8:
            schema:
              allOf:
                - $ref: '#/components/schemas/customizedLetter'
        required: true
      responses:
        "200":
          description: Response Body.
          headers:
            Content-Language:
              description: Audience language
              schema:
                pattern: "[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*"
                type: string
            Location:
              description: Location of newly created resource
              schema:
                type: string
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/customizedLetterStatus'
      x-codegen-request-body-name: customizedLetter
  /hotels/{hotelId}/reservations/{reservationId}/folioReports:
    get:
      tags:
        - OperaContent
      summary: Get folio report
      description: This API will get a folio report for a reservation. <p><strong>OperationId:</strong>getFolioReport</p>
      operationId: getFolioReport
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - name: hotelId
          in: path
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - name: reservationIdContext
          in: query
          description: "Used to identify the source of the identifier (e.g., IATA, ABTA)."
          schema:
            type: string
        - name: reservationIdType
          in: query
          description: A reference to the type of object defined by the UniqueID element.
          schema:
            type: string
        - name: folioWindowNo
          in: query
          description: Folio window number to generate (defaults to view 1).
          schema:
            type: integer
        - name: billNumber
          in: query
          description: Optional bill number to generate.
          schema:
            type: number
        - name: folioType
          in: query
          description: Optional folio type.
          schema:
            type: string
        - name: folioDate
          in: query
          description: Optional folio generation date - defaults to hotel business date.
          schema:
            type: string
            format: date
        - name: referenceCurrency
          in: query
          description: Folio currency code.
          schema:
            type: string
        - name: authorization
          in: header
          description: Bearer token that needs to be passed which is generated post
            user authentication
          required: true
          schema:
            type: string
        - name: x-app-key
          in: header
          description: Client or Partner's Application Key
          required: true
          schema:
            pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}$"
            type: string
        - name: x-hotelid
          in: header
          description: Mandatory parameter to identify the hotel code where the end
            user is logged in
          required: true
          schema:
            type: string
        - name: x-externalsystem
          in: header
          description: External system code.
          schema:
            maxLength: 80
            type: string
        - name: Accept-Language
          in: header
          description: Language code
          schema:
            type: string
      responses:
        "200":
          description: Response object for folio report.
          headers:
            Content-Language:
              description: Audience language
              schema:
                pattern: "[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*"
                type: string
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/folioReport'
        "204":
          description: FolioReport not found.
          content: {}
  /hotels/{hotelId}/reservations/{reservationId}/registrationCard:
    get:
      tags:
        - OperaContent
      summary: Get registration card
      description: "Use this API to return a registration card for a reservation based\
        \ on search criteria such as reservationId, hotelId, reservationIdContext,\
        \ reservationIdType, regenerate, signedOnly, language, template.  <p><strong>OperationId:</strong>getRegistrationCard</p>"
      operationId: getRegistrationCard
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - name: hotelId
          in: path
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - name: reservationIdContext
          in: query
          description: "Used to identify the source of the identifier (e.g., IATA, ABTA)."
          schema:
            type: string
        - name: reservationIdType
          in: query
          description: A reference to the type of object defined by the UniqueID element.
          schema:
            type: string
        - name: regenerate
          in: query
          description: Flag indicating whether a new registration card should be generated
            even if a signed card already exists.
          schema:
            type: boolean
        - name: signedOnly
          in: query
          description: Flag indicating whether return only the signed registrationCard
            if present.
          schema:
            type: boolean
        - name: language
          in: query
          description: Optional language code to use for registration card generation.
            Default guest language will be applied if not specified.
          schema:
            type: string
        - name: template
          in: query
          description: Optional registration card template code to use for registration
            card generation. Default template will be applied if not specified.
          schema:
            type: string
        - name: authorization
          in: header
          description: Bearer token that needs to be passed which is generated post
            user authentication
          required: true
          schema:
            type: string
        - name: x-app-key
          in: header
          description: Client or Partner's Application Key
          required: true
          schema:
            pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}$"
            type: string
        - name: x-hotelid
          in: header
          description: Mandatory parameter to identify the hotel code where the end
            user is logged in
          required: true
          schema:
            type: string
        - name: x-externalsystem
          in: header
          description: External system code.
          schema:
            maxLength: 80
            type: string
        - name: Accept-Language
          in: header
          description: Language code
          schema:
            type: string
      responses:
        "200":
          description: Response object for registration card.
          headers:
            Content-Language:
              description: Audience language
              schema:
                pattern: "[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*"
                type: string
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/registrationCard'
        "204":
          description: RegistrationCard not found.
          content: {}
  /images:
    get:
      tags:
        - OperaContent
      summary: Get image
      description: "Use this API to return an image based on search criteria such\
        \ as linkId, linkIdContext, linkIdType, imageCode, imageParameterCode, imageParameterValue,\
        \ languageCode, imageStyle, imageId, imageIdContext, imageIdType, base64.\
        \  <p><strong>OperationId:</strong>getImage</p>"
      operationId: getImage
      parameters:
        - name: linkId
          in: query
          description: A unique identifying value assigned by the creating system. The
            ID attribute may be used to reference a primary-key value within a database
            or in a particular implementation.
          schema:
            type: string
        - name: linkIdContext
          in: query
          description: "Used to identify the source of the identifier (e.g., IATA, ABTA)."
          schema:
            type: string
        - name: linkIdType
          in: query
          description: A reference to the type of object defined by the UniqueID element.
          schema:
            type: string
        - name: imageCode
          in: query
          schema:
            type: string
            enum:
              - LogoChain
              - Logo
              - Profile
              - Nationality
              - User
              - ToolbarItemCode
              - Chain
              - MembershipType
              - MembershipLevel
              - Resort
              - RoomTypeChain
              - RoomType
              - RoomNumber
              - OooReasonChain
              - OooReason
              - RoomMaintChain
              - RoomMaintenance
              - RoomMaintIssue
              - FloorPlan
              - SiteLayout
              - Attraction
              - PropertyMap
              - InvItemChain
              - InvItem
              - PackageChain
              - Package
              - Pool
              - RoomConditionChain
              - RoomCondition
              - FunctionSpace
              - FunctionSetupStyle
              - TrackItTypeChain
              - TrackItType
              - Height
              - Width
        - name: imageParameterCode
          in: query
          style: form
          explode: true
          schema:
            uniqueItems: true
            type: array
            items:
              type: string
              enum:
                - LogoChain
                - Logo
                - Profile
                - Nationality
                - User
                - ToolbarItemCode
                - Chain
                - MembershipType
                - MembershipLevel
                - Resort
                - RoomTypeChain
                - RoomType
                - RoomNumber
                - OooReasonChain
                - OooReason
                - RoomMaintChain
                - RoomMaintenance
                - RoomMaintIssue
                - FloorPlan
                - SiteLayout
                - Attraction
                - PropertyMap
                - InvItemChain
                - InvItem
                - PackageChain
                - Package
                - Pool
                - RoomConditionChain
                - RoomCondition
                - FunctionSpace
                - FunctionSetupStyle
                - TrackItTypeChain
                - TrackItType
                - Height
                - Width
        - name: imageParameterValue
          in: query
          description: Image parameter value.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: languageCode
          in: query
          schema:
            type: string
        - name: imageStyle
          in: query
          description: An enumeration of image styles.
          schema:
            type: string
            enum:
              - Full
              - Thumbnail
              - Icon
              - Square
              - Banner
              - Button
              - Lowres
              - Highres
        - name: imageId
          in: query
          description: A unique identifying value assigned by the creating system. The
            ID attribute may be used to reference a primary-key value within a database
            or in a particular implementation.
          schema:
            type: string
        - name: imageIdContext
          in: query
          description: "Used to identify the source of the identifier (e.g., IATA, ABTA)."
          schema:
            type: string
        - name: imageIdType
          in: query
          description: A reference to the type of object defined by the UniqueID element.
          schema:
            type: string
        - name: base64
          in: query
          description: True if the image to be returned as a base64String else if the
            image to be returned as the binary in MTOM attachment then false .
          schema:
            type: boolean
        - name: authorization
          in: header
          description: Bearer token that needs to be passed which is generated post
            user authentication
          required: true
          schema:
            type: string
        - name: x-app-key
          in: header
          description: Client or Partner's Application Key
          required: true
          schema:
            pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}$"
            type: string
        - name: x-hotelid
          in: header
          description: Mandatory parameter to identify the hotel code where the end
            user is logged in
          required: true
          schema:
            type: string
        - name: x-externalsystem
          in: header
          description: External system code.
          schema:
            maxLength: 80
            type: string
        - name: Accept-Language
          in: header
          description: Language code
          schema:
            type: string
      responses:
        "200":
          description: Response to fetch image(s)
          headers:
            Content-Language:
              description: Audience language
              schema:
                pattern: "[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*"
                type: string
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/image'
        "204":
          description: Image not found.
          content: {}
    post:
      tags:
        - OperaContent
      summary: Use this API to Upload an image
      description: You can use this API to upload an image. <p><strong>OperationId:</strong>uploadImage</p>
      operationId: uploadImage
      parameters:
        - name: authorization
          in: header
          description: Bearer token that needs to be passed which is generated post
            user authentication
          required: true
          schema:
            type: string
        - name: x-app-key
          in: header
          description: Client or Partner's Application Key
          required: true
          schema:
            pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}$"
            type: string
        - name: x-hotelid
