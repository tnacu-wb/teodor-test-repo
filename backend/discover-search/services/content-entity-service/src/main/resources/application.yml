server:
  port: "@application.port@"
  shutdown: graceful

swagger:
  api:
    version: "@project.version@"

info:
  build:
    groupId: "@project.groupId@"
    artifact: "@project.artifactId@"
    description: "@project.description@"
    version: "@project.version@"
    git:
      originUrl: "@git.remote.origin.url@"
      branch: "@git.branch@"
      commit:
        id: "@git.commit.id@"
        time: "@git.commit.time@"
        message: "@git.commit.message.short@"
springdoc:
  show-actuator: true
  writer-with-order-by-keys: true
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_0
    swagger-ui:
      path: /swagger-ui.html

io:
  getunleash:
    app-name: "${spring.application.name}"
    instance-id: "@project.version@"
    environment: "${UNLEASH_ENVIRONMENT}"
    api-url: "${UNLEASH_URL}"
    api-token: "${UNLEASH_TOKEN}"
    send-metrics-connect-timeout: "${UNLEASH_SEND_METRICS_CONNECT_TIMEOUT:5s}"
    send-metrics-read-timeout: "${UNLEASH_SEND_METRICS_READ_TIMEOUT:5s}"
    send-metrics-interval: "${UNLEASH_SEND_METRICS_INTERVAL:60s}"

management:
  tracing:
    propagation:
      type: w3c
    baggage:
      correlation:
        fields:
          - x-amzn-trace-id
          - flow-code
          - wb-session-id
        enabled: true
      enabled: true
      remote-fields:
        - x-amzn-trace-id
        - flow-code
        - wb-session-id
  endpoints:
    web:
      base-path: /v1/content/actuator
      exposure:
        include: health, info, caches, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    distribution:
      percentiles:
        http.server.requests: [ 0.95, 0.99 ]
      percentiles-histogram:
        http.server.requests: true
      maximum-expected-value:
        http.server.requests: 2000ms

content-entity:
  hotels:
    information:
      processing:
        thread:
          count: 10
    filters:
      # every Monday at 6 am
      refresh: "0 0 6 * * MON"
      facilityCodes:
        - "CPF"
        - "CPP"
        - "COP"
        - "ACO"
        - "LFT"
        - "MEE"
        - "EAT"
        - "PRR"
        - "EVC"
        - "ICR"
        - "HLG"
        - "LUG"
        - "LWB"
        - "WET"
        - "COC"
        - "HAC"
        - "HUL"
        - "RES"
        - "DIN"
        - "HRS"
        - "HAR"
    opening-soon:
      # every day at 5 am
      refresh: "0 0 5 * * *"
  scheduler:
    enabled: true

logging:
  configuration:
    debug:
      enabled: true
      exclusions:
        - .*/actuator.*
  #    logger: default
  level:
    brave: warn
    io.micrometer.observation.contextpropagation.ObservationThreadLocalAccessor: ERROR
    org.springframework.cache: info
    io:
      getunleash: TRACE
  pattern:
    # Logging pattern containing traceId and spanId; no longer provided through Sleuth by default
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

spring:
  cache:
    type: ${CACHE_TYPE}
    redis:
      key-prefix: "Content-Entity-Service"
      use-key-prefix: true
  data:
    redis:
      ssl:
        enabled: true
      cluster:
        max-redirects: 5
        nodes: ${REDIS_ENDPOINT}
      client-type: lettuce
      lettuce:
        cluster:
          refresh:
            period: 5m
            adaptive: true
      timeout: 10000
      connect-timeout: 10000
  lifecycle:
    timeout-per-shutdown-phase: 1m

config:
   httpClient:
     connectionTimeout: ${HTTP_CONNECTION_TIMEOUT:10000}
     responseTimeout: ${HTTP_RESPONSE_TIMEOUT:30}
   service:
    aem:
      host: ${CONFIG_MAP_AEM_URL}
      username: ${AEM_CREDENTIALS_ENV_USER}
      password: ${AEM_CREDENTIALS_ENV_PASS}
      isProduction: ${CONFIG_MAP_IS_PROD:false}
      dlp:
        countryParam: ${DLP_COUNTRY_PARAM:countryParam}
        languageParam: ${DLP_LANGUAGE_PARAM:languageParam}
        dlpPathParam: ${DLP_PATH_PARAM:dlpPathParam}
      apps:
        homepage:
          countryParam: countryParam
          languageParam: languageParam
          pathParam: pathParam
          subchannelParam: subchannelParam
      labelsEndpoint: "etc/designs/global/dictionaries/labels/i18n.jsondict.{language}"
      indexHeaderDataEndpoint: "/{country}/{language}/index.header.data"
      amendLabelsEndpoint: "etc/designs/global/dictionaries/pi-bookings/i18n.jsondict.{language}"
      bookingLabelsEndpoint: "etc/designs/global/dictionaries/booking/i18n.jsondict.{language}"
      extrasLabelsEndpoint: "etc/designs/global/dictionaries/ancillaries/i18n.jsondict.{language}"
      promoLabelsEndpoint: "etc/designs/global/dictionaries/promotions/i18n.jsondict.{language}"
      businessNotesEndpoint: "etc/designs/global/dictionaries/allowances/i18n.jsondict.{language}"
      hotelInformationEndpoint: "{country}/{language}/hoteldirectory/{hotelDirectory}/{hotelId}.complete.data"
      bookingInformationEndpoint: "/{country}/{language}/content-service.booking-flow.detail/bookingId/{bookingFlowId}.json"
      allHotelDetailsEndpoint: "{country}/{language}/hoteldirectory/list.hotels.data"
      upsellItemsEndpoint: "/{country}/{language}/hoteldirectory/{initialCharacter}/{hotelId}.upsellitems.data"
      rateInformationEndpoint: "{country}/{language}/content-service.rates.detail/site/leisure/brand/{brand}.json"
      bbRateInformationEndpoint: "{country}/{language}/content-service.rates.detail/site/business-booker/brand/{brand}.json"
      rateInformationForHotelEndpoint: "{country}/{language}/content-service.rates.detail/site/leisure/brand/{brand}/hotelCode/{hotelId}.json"
      bbRateInformationForHotelEndpoint: "{country}/{language}/content-service.rates.detail/site/business-booker/brand/{brand}/hotelCode/{hotelId}.json"
      searchResultsDataEndpoint: "/{country}/{language}/search.searchresults.data"
      footerEndpoint: "{country}/{language}/index.footer.data/site/{site}.json"
      roomTypeEndpoint: "{country}/{language}/content-service.room-types.detail/brand/{brand}.json"
      countriesEndpoint: "/{country}/{language}/content-service.countries.detail/site/{site}.json"
      cookiePoliciesEndpoint: "/{country}/{language}/content-service.cookie-policies.detail/brand/{brand}.json"
      bbIndexHeaderDataEndpoint: "/{country}/{language}/business-booker/index.header.data"
      ratesOverrideEndpoint: "/{country}/{language}/content-service.rates-override.detail/site/leisure/brand/{brand}.json"
      bbRatesOverrideEndpoint: "/{country}/{language}/content-service.rates-override.detail/site/business-booker/brand/{brand}.json"
      piPreCheckInEndpoint: "etc/designs/global/dictionaries/guest-checkin/i18n.jsondict.{language}"
      piGroupBookingEndpoint: "etc/designs/global/dictionaries/pi-group-booking/i18n.jsondict.{language}"
      innbLayoutEndpoint: "etc/designs/global/dictionaries/innbusiness/{dictionary}/i18n.jsondict.{language}"
      innbContentEndpoint: "{country}/{language}/content-service.header.detail/site/business-booker.json"
      innbCardManagementEndpoint: "etc/designs/global/dictionaries/innbusiness/card-management/i18n.jsondict.{language}"
      innbCommonIconsEndpoint: "etc/designs/global/dictionaries/common-icons/i18n.jsondict.{language}"
      innbCommonLayoutEndpoint: "etc/designs/global/dictionaries/innbusiness/common-layout/i18n.jsondict.{language}"
      innbUserManagementEndpoint: "/etc/designs/global/dictionaries/innbusiness/user-management/i18n.jsondict.{language}"
      innbProfileManagementEndpoint: "/etc/designs/global/dictionaries/innbusiness/profile-management/i18n.jsondict.{language}"
      innbCompanyManagementEndpoint: "/etc/designs/global/dictionaries/innbusiness/company-management/i18n.jsondict.{language}"
      piGlobalConfigEndpoint: "/{country}/{language}/content-service.global-config.detail/site/leisure/brand/{brand}.json"
      bbGlobalConfigEndpoint: "/{country}/{language}/content-service.global-config.detail/site/business-booker/brand/{brand}.json"
      ccuiGlobalConfigEndpoint: "/{country}/{language}/content-service.global-config.detail/site/ccui/brand/{brand}.json"
      distrGlobalConfigEndpoint: "/{country}/{language}/content-service.global-config.detail/site/distribution/brand/{brand}.json"
      pageDlpEndpoint: "/${config.service.aem.dlp.countryParam}/${config.service.aem.dlp.languageParam}/content-service.page-dlp.detail/path/${config.service.aem.dlp.dlpPathParam}.json"
      homePageEndpoint: "/etc/designs/global/dictionaries/innbusiness/home/i18n.jsondict.{language}"
      spendingReportingEndpoint: "/etc/designs/global/dictionaries/innbusiness/spending-reporting/i18n.jsondict.{language}"
      appsHomepageEndPoint: "/${config.service.aem.apps.homepage.countryParam}/${config.service.aem.apps.homepage.languageParam}/${config.service.aem.apps.homepage.subchannelParam}/${config.service.aem.apps.homepage.pathParam}/home.model.json"
      payApplicationEndpoint: "/etc/designs/global/dictionaries/innbusiness/pay-application/i18n.jsondict.{language}"
      authEndpoint: "/etc/designs/global/dictionaries/innbusiness/auth/i18n.jsondict.{language}"
      notificationsEndpoint: "/etc/designs/global/dictionaries/innbusiness/notifications/i18n.jsondict.{language}"
      innbContactUsEndpoint: "/etc/designs/global/dictionaries/innbusiness/contact-us/i18n.jsondict.{language}"

    snowdrop:
      host: ${SNOWDROP_URL}
      hotelSearchEndpoint: "/v1/search/hotels"

    ohip:
      host: http://${OHIP_HOST:localhost:9100}/ohip
      hotelInfoEndpoint: "/hotels/{hotelId}/info"
      ratePlansEndpoint: "/ratePlans"
    hotelreviewservice:
      host: http://${HOTEL-REVIEW_HOST:localhost:9126}
      reviewsForSingleHotelEndpoint: "/v1/hotel-review/reviews/{hotelCode}"

feature-flags:
  fetch-tripadvisor-feedback:
    key: "release_pi_bb_ccui_white_trip_advisor_review"
    fallback: false

  free-fnb-extras:
    key: "release_pi_free_fnb_and_extras"
    fallback: false

---
spring:
  config:
    activate:
      on-profile:
        - opera-perf
        - opera-dev
        - opera-qa
        - local

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, caches, prometheus


---
spring:
  config:
    activate:
      on-profile:
        - opera-perf
        - opera-prod

logging:
  configuration:
    debug:
      response:
        body: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile:
        - local
        - integration

io:
  getunleash:
    app-name: "${spring.application.name}"
    instance-id: "@project.version@"
    environment: local
    api-url: 'http://localhost:3063/api'
    api-token: 'dummy-value'
