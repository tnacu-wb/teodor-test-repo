openapi: 3.0.1
info:
  description: <p>TBU</p>
  title: Content Entity Service API Documentation
  version: 1.0.0
servers:
- description: Generated server url
  url: http://localhost:9106
tags:
- description: Monitor and interact
  externalDocs:
    description: Spring Boot Actuator Web API Documentation
    url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
  name: Actuator
paths:
  /v1/content/actuator:
    get:
      operationId: links
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
          description: OK
      summary: Actuator root web endpoint
      tags:
      - Actuator
  /v1/content/actuator/caches:
    delete:
      operationId: clearCaches
      responses:
        "204":
          description: No Content
      summary: Actuator web endpoint 'caches'
      tags:
      - Actuator
    get:
      operationId: caches
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
      summary: Actuator web endpoint 'caches'
      tags:
      - Actuator
  /v1/content/actuator/caches/{cache}:
    delete:
      operationId: clearCache
      parameters:
      - in: path
        name: cache
        required: true
        schema:
          type: string
      - in: query
        name: cacheManager
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
      summary: Actuator web endpoint 'caches-cache'
      tags:
      - Actuator
    get:
      operationId: cache
      parameters:
      - in: path
        name: cache
        required: true
        schema:
          type: string
      - in: query
        name: cacheManager
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "404":
          description: Not Found
      summary: Actuator web endpoint 'caches-cache'
      tags:
      - Actuator
  /v1/content/actuator/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
      summary: Actuator web endpoint 'health'
      tags:
      - Actuator
  /v1/content/actuator/info:
    get:
      operationId: info
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
