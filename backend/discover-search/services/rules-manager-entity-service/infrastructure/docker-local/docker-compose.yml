version: '3.7'
services:
  postgres:
    image: postgres:14.2
    restart: always
    environment:
      - TZ=UTC
      - PGTZ=UTC
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
#      - PGDATA=/var/lib/postgresql/data/pgdata
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - '5438:5432'
#    volumes:
      #      Enable if you want the data persistence on your machine
      #      - ./sql/postgres-data:/var/lib/postgresql/data