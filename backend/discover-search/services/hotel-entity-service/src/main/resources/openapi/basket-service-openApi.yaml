openapi: 3.0.1
info:
  description: "<p>The basket feature will be modeled as a distinct micro-service\
    \ that will interact mainly with the Reservation Entity micro-service to manage\
    \ any interactions performed by the end-users against a stay definition. Based\
    \ on the user’s selection, the Reservation entity will be responsible for creating\
    \ the necessary number of cart items in the basket (i.e. one Opera reservation\
    \ for each room). The same Reservation micro-service must provide all the details\
    \ that are relevant for the items placed in the basket.</p>"
  title: Basket Service API Documentation
  version: 2.0.0
servers:
- description: Generated server url
  url: http://localhost:9104
tags:
- description: Monitor and interact
  externalDocs:
    description: Spring Boot Actuator Web API Documentation
    url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
  name: Actuator
