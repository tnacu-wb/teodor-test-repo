      operationId: getBasketByBookingReference
      parameters:
      - in: query
        name: bookingReference
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketDto'
          description: OK
      tags:
      - basket-controller
    post:
      operationId: createBasket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBasketRequestDto'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBasketResponseDto'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Error Occurred '
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: "Creates a new empty basket entity, assigns a new, unique, random reference\
        \ or a migrated reference, persists the Basket and returns an empty basket\
        \ model to the caller."
      tags:
      - basket-controller
