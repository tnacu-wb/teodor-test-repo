openapi: 3.0.1
info:
  description: <p>TBU</p>
  title: Promo API Documentation
  version: 1.0.0
servers:
  - description: Generated server url
    url: http://localhost:9137
tags:
  - description: Monitor and interact
    externalDocs:
      description: Spring Boot Actuator Web API Documentation
      url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
    name: Actuator
paths:
  /v1/promo/batches/promo-kind:
    get:
      operationId: validatePromoKind
      parameters:
        - in: query
          name: promocode
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PromoKindResponseDto'
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      tags:
        - promo-batch-controller
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        debugMessage:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
        errCode:
          type: integer
          format: int32
        globalErrTextTemplate:
          type: string
    ValidationError:
      type: object
      properties:
        elementId:
          type: string
        errTextTemplate:
          type: string
    PromoKindResponseDto:
      type: object
      properties:
        promoKind:
          $ref: "#/components/schemas/PromoKind"
        operaPromoCode:
          type: string
        uniquePromoCodeStatus:
          $ref: "#/components/schemas/PromoCodeStatus"
    PromoKind:
      type: string
      enum:
        - GENERIC
        - UNIQUE
    PromoCodeStatus:
      type: string
      enum:
        - ISSUED
        - REDEEMED
        - EXPIRED
        - VOID
