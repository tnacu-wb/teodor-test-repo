          name: language
          required: true
          schema:
            type: string
        - example: 1370
          in: query
          name: globalCompanyId
          required: false
          schema:
            type: string
        - example: BMD
          in: query
          name: negotiatedRateDisplaySets
          required: true
          schema:
            type: string
        - in: query
          name: pmsRoomTypes
          required: false
          schema:
            type: array
            example:
              - PPLDBL
              - FMTRPL
            items:
              type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityByIdsResponseDto"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OhipBadRequestException"
          description: Bad Request - Invalid Client Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OhipNotFoundException"
          description: Resource Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OhipInternalException"
          description: Internal Server Error
      summary: Retrieves Hotel Availability for a list of hotels
      tags:
        - hotel-availability-controller
