openapi: 3.1.0
info:
  description: "<p>The OHIP Adapter Micro-service embeds all the specific logic that\
    \ is required by the Oracle Opera property management system. It is responsible\
    \ for translating the Whitbread data models onto the Opera data model, and vice\
    \ versa, plus the handling of the interface integration with the Opera OHIP APIs.\
    \ When a  new PMS solution is going to be integrated into the Whitbread booking\
    \ platform, a similar, new Adapter micro-service will be created to take care\
    \ of the specifics of that integration.</p>"
  title: OHIP Adapter Service API Documentation
  version: 2.0.0
servers:
  - description: Generated server url
    url: http://localhost:9100/ohip
paths:
  /hotels/availabilities:
    get:
      operationId: getMultiHotelAvailability
      parameters:
        - in: query
          name: hotelIds
          required: true
          schema:
            type: array
            items:
              type: string
        - example: 2022-03-01
          in: query
          name: arrivalDate
          required: true
          schema:
            type: string
        - example: 2022-03-05
          in: query
          name: departureDate
          required: true
          schema:
            type: string
        - in: query
          name: numberOfRooms
          required: true
          schema:
            type: array
            example:
              - "1"
              - "2"
            items:
              type: integer
              format: int32
        - in: query
          name: roomTypes
          required: false
          schema:
            type: array
            example:
              - DB
              - TWIN
            items:
              type: string
        - in: query
          name: adults
          required: true
          schema:
            type: array
            example:
              - "2"
              - "0"
            items:
              type: integer
              format: int32
        - in: query
          name: children
          required: false
          schema:
            type: array
            example:
              - "2"
              - "0"
            items:
              type: integer
              format: int32
        - in: query
          name: cotsRequired
          required: false
          schema:
            type: array
            example:
              - "true"
              - "false"
            items:
              type: boolean
        - example: PI
          in: query
          name: channel
          required: true
          schema:
            type: string
        - example: 2569623
          in: query
          name: companyId
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiAvailabilityResponseDto"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OhipBadRequestException"
          description: Bad Request - Invalid Client Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OhipNotFoundException"
          description: Resource Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OhipInternalException"
          description: Internal Server Error
      summary: Retrieves Multiple Hotels Availability
      tags:
        - hotel-availability-controller
  /hotels/availabilities/distr:
    get:
      operationId: getHotelAvailabilityByIds
      parameters:
        - in: query
          name: hotelIds
          required: true
          schema:
            type: array
            example: "LONEUS,LONKIN"
            items:
              type: string
        - example: 2022-03-01
          in: query
