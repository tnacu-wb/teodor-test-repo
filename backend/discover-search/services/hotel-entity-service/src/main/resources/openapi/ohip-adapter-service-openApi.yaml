        - example: FLEXRATE
          in: query
          name: ratePlanCodes
          required: true
          schema:
            type: string
        - example: PI
          in: query
          name: channel
          required: true
          schema:
            type: string
        - example: WEB
          in: query
          name: subchannel
          required: true
          schema:
            type: string
        - example: en
