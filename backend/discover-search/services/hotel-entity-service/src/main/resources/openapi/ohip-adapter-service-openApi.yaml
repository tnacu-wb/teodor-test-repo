          required: true
          schema:
            type: string
        - example: 2022-03-05
          in: query
          name: departureDate
          required: true
          schema:
            type: string
        - in: query
          name: roomTypes
          required: true
          schema:
            type: array
            example:
              - DB
              - TWIN
            items:
