        name: arrivalDate
        required: true
        schema:
          type: string
      - example: Departure date in format yyyy-mm-dd
        in: query
        name: departureDate
        required: true
        schema:
          type: string
      - example: "DB,TWIN,FAM"
        in: query
        name: roomTypes
        required: true
        schema:
          type: array
      - example: "1,2,2"
        in: query
        name: adultsNumber
        required: true
        schema:
          type: array
      - example: "0,0,2"
        in: query
        name: childrenNumber
        required: false
        schema:
          type: array
      - example: true
        in: query
        name: cotsRequired
        required: false
        schema:
          type: array
      - example: FLEXRATE
        in: query
        name: ratePlanCodes
        required: false
        schema:
          type: string
      - example: PI
        in: query
        name: channel
        required: true
        schema:
          type: string
      - example: WEB
        in: query
        name: subchannel
        required: true
        schema:
          type: string
      - example: EN
        in: query
        name: language
        required: true
        schema:
          type: string
      - example: GB
        in: query
        name: country
        required: false
        schema:
          type: string
      - example: 1370
        in: query
        name: globalCompanyId
        required: false
        schema:
          type: string
      - example: BMD
        in: query
        name: negotiatedRateDisplaySets
        required: true
        schema:
          type: string
      - example: true
        in: query
        name: vatNotRequired
        required: false
        schema:
          type: boolean
      - example: true
        in: query
        name: isOTA
        required: false
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelAvailabilityByIdsDto"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelAvailabilityException"
          description: 'Error Occurred '
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelAvailabilityException"
          description: Resource Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelAvailabilityException"
          description: Internal Server Error
      summary: Retrieves Hotel Availabilities for the specified hotel IDs
      tags:
      - hotel-availability-controller
