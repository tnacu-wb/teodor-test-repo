openapi: 3.1.0
info:
  description: "<p>Provides the option to search for a specific hotel availability\
    \ information, given a search criteria.</p>"
  title: Hotel Entity Service API Documentation
  version: 1.0.0
servers:
- description: Generated server url
  url: http://localhost:9102
tags:
- description: Monitor and interact
  externalDocs:
    description: Spring Boot Actuator Web API Documentation
    url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
  name: Actuator
paths:
  /v1/hotels/actuator:
    get:
      operationId: links
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator root web endpoint
      tags:
      - Actuator
  /v1/hotels/actuator/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'health'
      tags:
      - Actuator
  /v1/hotels/actuator/info:
    get:
      operationId: info
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'info'
      tags:
      - Actuator
  /v1/hotels/actuator/metrics:
    get:
      operationId: listNames
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'metrics'
      tags:
      - Actuator
  /v1/hotels/actuator/metrics/{requiredMetricName}:
    get:
      operationId: metric
      parameters:
      - in: path
        name: requiredMetricName
        required: true
        schema:
          type: string
      - in: query
        name: tag
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "404":
          description: Not Found
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'metrics-requiredMetricName'
      tags:
      - Actuator
  /v1/hotels/actuator/prometheus:
    get:
      operationId: scrape
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - CONTENT_TYPE_004
          - CONTENT_TYPE_OPENMETRICS_100
          - CONTENT_TYPE_PROTOBUF
      - in: query
        name: includedNames
        schema:
          type: string
      responses:
        "200":
          content:
            application/openmetrics-text;version=1.0.0;charset=utf-8:
              schema:
                type: object
            application/vnd.google.protobuf;proto=io.prometheus.client.MetricFamily;encoding=delimited:
              schema:
                type: object
            text/plain;version=0.0.4;charset=utf-8:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'prometheus'
      tags:
      - Actuator
  /v1/hotels/availabilities:
    get:
      operationId: getSrpHotelAvailabilities
      parameters:
      - example: Arrival date in format yyyy-mm-dd
        in: query
        name: arrivalDate
        required: false
        schema:
          type: string
      - example: Departure date in format yyyy-mm-dd
        in: query
        name: departureDate
        required: false
        schema:
          type: string
      - example: en
        in: query
        name: language
        required: true
        schema:
          type: string
      - example: gb
        in: query
        name: country
        required: true
        schema:
          type: string
      - example: "1,2,2"
        in: query
        name: adultsNumber
        required: true
        schema:
          type: array
      - example: "0,0,2"
        in: query
        name: childrenNumber
        required: false
        schema:
          type: array
      - example: "DB,TWIN,FAM"
        in: query
        name: roomTypes
        required: false
        schema:
          type: array
      - example: "MOBILE,WEB,WEB_DE,CBT"
        in: query
        name: oldWorldChannel
        required: true
        schema:
          type: string
          enum:
          - MOBILE
          - WEB
          - WEB_DE
          - CBT
      - example: "PI,CCUI,BB"
        in: query
        name: channel
        required: true
        schema:
          type: string
      - example: WEB
        in: query
        name: subChannel
        required: true
        schema:
          type: string
      - example: 2569623
        in: query
        name: companyId
        required: false
        schema:
          type: string
      - example: 10
        in: query
        name: page
        required: true
        schema:
          type: integer
          minimum: 1
      - example: 10
        in: query
        name: initialPageSize
        required: true
        schema:
          type: integer
          minimum: 1
      - example: 10
        in: query
        name: lazyLoadPageSize
        required: true
        schema:
          type: integer
          minimum: 1
      - example: DISTANCE or PRICE
        in: query
        name: sort
        required: false
        schema:
          type: string
      - example: 0.3
        in: query
        name: rcPriceModifier
        required: false
        schema:
          type: number
          maximum: 1
          minimum: 0
      - example: 0.5
        in: query
        name: rcDistanceModifier
        required: false
        schema:
          type: number
          maximum: 1
          minimum: 0
      - example: "EAT,LFT"
        in: query
        name: filters
        required: false
        schema:
          type: array
      - example: 0.85
        in: query
        name: rcHubModifier
        required: false
        schema:
          type: number
          maximum: 1
          minimum: 0
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelAvailabilitiesResponseDto"
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      tags:
      - search-results-page-controller
  /v1/hotels/availabilities/distr:
    get:
      operationId: getHotelAvailabilitiesByIds
      parameters:
      - in: query
        name: hotelIds
        required: true
        schema:
