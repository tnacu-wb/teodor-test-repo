# Generated by flux-values from whitbread/microservices-gitops/opera-dev/apps/hotel-wallet-service-opera.yaml
# environment: opera-dev
# service:     hotel-wallet-service-opera
# chart:       opera-app-chart 1.2.10
# image tag:   1.0.0-24-develop-11938cbbb30536cb248b85caa9fae592377e78c4-1779787648
# namespace:   opera-be
# Values only — Flux substitutions above are applied by the cluster,
# so pass them yourself when rendering, e.g.
#   helm template hotel-wallet-service-opera <chart> --values values.yaml --set applicationName=hotel-wallet-service-opera --set namespace=opera-be
imageAutomation:
  create: true
  pattern: develop
deployment:
  create: true
  checksumValues: r2
  serviceAccount: hotel-wallet-service-account
  containerEnvs:
  - name: JAVA_OPTS
    value: -XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=80
  - name: spring_profiles_active
    value: opera-dev
  - name: CONTENT_SERVICE_HOST
    value: content-entity-service
  - name: RESERVATION_HOST
    value: hotel-reservation-entity-service
  - name: HOTEL_WALLET_CERT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: hotel-wallet-credentials
        key: hotel_wallet_cert_password
  - name: HOTEL_WALLET_BUCKET_NAME
    value: opera-dev-pi-mobile-wallet
  dns:
    ndots: 3
  lifecycle:
    preStop:
      exec:
        command:
        - sh
        - -c
        - sleep 20
  terminationGracePeriodSeconds: 90
  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /v1/hotel-wallet/actuator/health/liveness
      port: 9131
    initialDelaySeconds: 420
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    failureThreshold: 24
    httpGet:
      path: /v1/hotel-wallet/actuator/health/readiness
      port: 9131
    initialDelaySeconds: 60
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  resources:
    limits:
      memory: 800Mi
    requests:
      cpu: 0.2
      memory: 800Mi
service:
  create: true
  annotations: {}
  labels: {}
  name: hotel-wallet-service-opera
  ports:
  - name: port9131
    port: 80
    protocol: TCP
    targetPort: 9131
  type: ClusterIP
autoscaling:
  create: true
  maxReplicas: 4
  minReplicas: 2
  scaleDownStabilizationSeconds: 300
  scaleUpStabilizationSeconds: 180
  targetCPUUtilizationPercentage: 50
istio:
  create: true
  gateway: opera-api
  regex:
    enabled: true
    pattern: ^\/v\d+\/hotel-wallet.*
canary:
  create: true
  analysis:
    interval: 1m
    threshold: 10
    maxWeight: 100
    stepWeight: 30
  metrics:
  - name: request-success-rate
    interval: 3m
    thresholdRange:
      min: 90
  - name: request-duration
    interval: 3m
    thresholdRange:
      max: 10000
  - name: http-latency-99
    templateRef:
      name: http-latency-99
      namespace: flagger
    thresholdRange:
      max: 10.0
    interval: 3m
    templateVariables:
      uri: /v1/hotel-wallet
  - name: error-log-rate
    templateRef:
      name: error-log-rate
      namespace: flagger
    thresholdRange:
      max: 30
    interval: 3m
  - name: http-requests-success-uri
    templateRef:
      name: http-requests-success-uri
      namespace: flagger
    thresholdRange:
      min: 99
    interval: 3m
    templateVariables:
      uri: /v1/hotel-wallet
  loadtests:
  - name: load-test-get
    path: /v1/hotel-wallet?reservationNumber=AEW8595832&arrivalDate=2026-02-01&lastName=test&language=en&country=gb&channel=PI&excludeBarcode=false
  whscripts:
  - name: smoke-test
    script: smoke-test.sh
    parameters:
      smoke_workflow_branch: develop
      tests_branch: opera
      opera_env: dev
prometheusSpring:
  create: true
  path: /v1/hotel-wallet/actuator/prometheus
