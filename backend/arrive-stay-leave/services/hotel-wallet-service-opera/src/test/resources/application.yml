server:
  port: 9131
  shutdown: graceful

spring:
  application:
    name: wallet

swagger:
  api:
    version: "@project.version@"

springdoc:
  show-actuator: true
  writer-with-order-by-keys: true

management:
  tracing:
    propagation:
      type: w3c
    baggage:
      correlation:
        fields:
          - x-amzn-trace-id
          - flow-code
          - wb-session-id
        enabled: true
      enabled: true
      remote-fields:
        - x-amzn-trace-id
        - flow-code
        - wb-session-id
  endpoints:
    web:
      base-path: /v1/hotel-wallet/actuator
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
logging:
  level:
    brave: WARN
  configuration:
    debug:
      enabled: true
      exclusions:
        - .*/actuator.*
    mask:
      enabled: true
      fields:
        - hotelCode
        - hotelName
  pattern:
    # Logging pattern containing traceId and spanId; no longer provided through Sleuth by default
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

config:
  httpClient:
    connectionTimeout: ${HTTP_CONNECTION_TIMEOUT:10000}
    responseTimeout: ${HTTP_RESPONSE_TIMEOUT:30}
  service:
    reservation:
      host: http://${RESERVATION_HOST:localhost:9103}
      basketReferenceEndpoint: "/v1/reservations/find"
      reservationEndpoint: "/v1/reservations/basket/"
    content:
      host: http://${CONTENT_SERVICE_HOST:localhost:9106}
      hotelInformationEndpoint: "/v1/content/hotels/{hotelId}/information"

pactbroker:
  url: http://pact-broker.pact-broker/

pact:
  verifier:
    publishResults: true
---
auth:
  rulesEngineHost: http://localhost:9108

logging:
  configuration:
    logger: default
    debug:
      enabled: true
      exclusions:
        - .*/actuator.*
    mask:
      enabled: true
      fields:
        - phoneNumber
        - cardNumber
wallet:
  cert:
    p12S3Path: certs/PassTypeCertificate.p12
    wwdrcaS3Path: certs/AppleWWDRCA.cer
    p12LocalPath: /tmp/certs/PassTypeCertificate.p12
    wwdrcaLocalPath: /tmp/certs/AppleWWDRCA.cer
    password: pippobaudo
  passJson: pass.json
  templateDir: template
  contactCentre:
    flex: 0333 003 8101
    nonFlex: 0333 003 0025
  premierInnLink: https://www.premierinn.com/gb/en/hotels
  earlyCheckInTime: "11:00"

irsa:
  enabled: false
aws:
  endpoint: http://localhost:4566
  s3:
    bucket:
      name: my-bucket