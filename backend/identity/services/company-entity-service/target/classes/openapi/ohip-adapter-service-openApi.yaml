openapi: 3.0.1
info:
  description: "<p>The OHIP Adapter Micro-service embeds all the specific logic that\
    \ is required by the Oracle Opera property management system. It is responsible\
    \ for translating the Whitbread data models onto the Opera data model, and vice\
    \ versa, plus the handling of the interface integration with the Opera OHIP APIs.\
    \ When a  new PMS solution is going to be integrated into the Whitbread booking\
    \ platform, a similar, new Adapter micro-service will be created to take care\
    \ of the specifics of that integration.</p>"
  title: OHIP Adapter Service API Documentation
  version: 2.0.0
servers:
  - description: Generated server url
    url: http://localhost:9100/ohip
tags:
  - description: Monitor and interact
    externalDocs:
      description: Spring Boot Actuator Web API Documentation
      url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
    name: Actuator
paths:
  /actuator:
    get:
      operationId: links
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/Link'
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/Link'
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/Link'
          description: OK
      summary: Actuator root web endpoint
      tags:
        - Actuator
  /actuator/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
