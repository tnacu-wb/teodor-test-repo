components:
  schemas:
    AdditionalGuestInfoDto:
      type: object
      properties:
        purposeOfStay:
          type: string
    AddressDto:
      type: object
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
        addressLine3:
          type: string
        addressLine4:
          type: string
        city:
          type: string
        country:
          type: string
        postalCode:
          type: string
    AddressInfoDto:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/AddressDto'
    AddressResponseDto:
      type: object
      properties:
        companyName:
          type: string
        countryCode:
          type: string
        line1:
          type: string
        line2:
          type: string
        line3:
          type: string
        line4:
          type: string
        postalCode:
          type: string
    AddressesDto:
      type: object
      properties:
        addressInfo:
          type: array
          items:
            $ref: '#/components/schemas/AddressInfoDto'
    AmendSummaryResponseDto:
      type: object
      properties:
        deposit:
          type: object
          additionalProperties:
            type: number
        guestPay:
          type: object
          additionalProperties:
            type: number
        net:
          type: number
        outStandingCostOfStay:
          type: number
        totalCostOfStay:
          type: number
    AmountTypeDto:
      type: object
      properties:
        base:
          $ref: '#/components/schemas/TotalTypeDto'
        end:
          type: string
          example: 2025-03-31
        start:
          type: string
          example: 2025-03-31
      required:
        - base
        - end
        - start
    AttachReservationProfileRequestDto:
      type: object
      properties:
        hotelId:
          type: string
        profileId:
          type: string
        reservationIds:
          type: array
          items:
            type: string
          uniqueItems: true
      required:
        - hotelId
        - profileId
        - reservationIds
    AvailabilityByIdsRequestV2Dto:
      type: object
      properties:
        arrivalDate:
          type: string
          format: date
        bookingChannel:
          $ref: '#/components/schemas/BookingChannelDto'
        departureDate:
          type: string
          format: date
        hotelIds:
          type: array
          items:
            type: string
        rates:
          $ref: '#/components/schemas/RateV2Dto'
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomV2Dto'
      required:
        - arrivalDate
        - departureDate
        - hotelIds
        - rates
        - rooms
    AvailabilityByIdsResponseDto:
      type: object
      properties:
        hotelAvailability:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityResponseDto'
    AvailabilityByIdsResponseV2Dto:
      type: object
      properties:
        hotelAvailability:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityResultV2Dto'
    AvailabilityResponseDto:
      type: object
      properties:
        available:
          type: boolean
        endDate:
          type: string
        hotelId:
          type: string
        limitedAvailability:
          type: boolean
        roomRates:
          type: array
          items:
            $ref: '#/components/schemas/RoomRateAvailabilityDto'
        startDate:
