  /hotels/availabilities:
    get:
      operationId: getMultiHotelAvailability
      parameters:
        - in: query
          name: hotelIds
          required: true
          schema:
            type: array
            items:
              type: string
        - example: 2022-03-01
          in: query
          name: arrivalDate
          required: true
          schema:
            type: string
        - example: 2022-03-05
          in: query
          name: departureDate
          required: true
          schema:
            type: string
        - in: query
          name: numberOfRooms
          required: true
          schema:
            type: array
            example:
              - "1"
              - "2"
            items:
              type: integer
              format: int32
        - in: query
          name: roomTypes
          required: false
          schema:
            type: array
            example:
              - DB
              - TWIN
            items:
              type: string
        - in: query
          name: adults
          required: true
          schema:
            type: array
            example:
              - "2"
              - "0"
            items:
              type: integer
              format: int32
        - in: query
          name: children
          required: false
          schema:
            type: array
            example:
              - "2"
              - "0"
            items:
              type: integer
              format: int32
        - in: query
          name: cotsRequired
          required: false
          schema:
            type: array
            example:
              - "true"
              - "false"
            items:
              type: boolean
        - example: PI
          in: query
          name: channel
          required: true
          schema:
            type: string
        - example: 2569623
          in: query
          name: companyId
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiAvailabilityResponseDto'
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OhipBadRequestException'
          description: Bad Request - Invalid Client Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OhipNotFoundException'
          description: Resource Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OhipInternalException'
          description: Internal Server Error
      summary: Retrieves Multiple Hotels Availability
      tags:
        - hotel-availability-controller
  /hotels/availabilities/distr:
    get:
      operationId: getHotelAvailabilityByIds
      parameters:
        - in: query
          name: hotelIds
          required: true
          schema:
            type: array
            example: "LONEUS,LONKIN"
            items:
              type: string
        - example: 2022-03-01
          in: query
          name: arrivalDate
          required: true
          schema:
            type: string
        - example: 2022-03-05
          in: query
          name: departureDate
          required: true
          schema:
            type: string
        - in: query
          name: roomTypes
          required: true
          schema:
            type: array
            example:
              - DB
              - TWIN
            items:
              type: string
        - in: query
          name: adults
          required: true
          schema:
            type: array
