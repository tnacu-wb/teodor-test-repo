            type: array
            example:
              - "2"
              - "0"
            items:
              type: integer
              format: int32
        - in: query
          name: cotsRequired
          required: false
          schema:
            type: array
            example:
              - "true"
              - "false"
            items:
              type: boolean
        - example: FLEXRATE
          in: query
          name: ratePlanCodes
          required: true
          schema:
            type: string
        - example: PI
          in: query
          name: channel
          required: true
          schema:
            type: string
        - example: WEB
          in: query
          name: subchannel
          required: true
          schema:
            type: string
        - example: en
          in: query
          name: language
          required: true
          schema:
            type: string
        - example: 1370
          in: query
          name: globalCompanyId
          required: false
          schema:
            type: string
        - example: BMD
          in: query
          name: negotiatedRateDisplaySets
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityByIdsResponseDto'
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OhipBadRequestException'
          description: Bad Request - Invalid Client Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OhipNotFoundException'
          description: Resource Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OhipInternalException'
          description: Internal Server Error
      summary: Retrieves Hotel Availability for a list of hotels
      tags:
        - hotel-availability-controller
