description: Should fail with an expired token exception
request:
  method: GET
  url: /customers/hotels/customer@test.com?business=false
  headers:
    Content-Type: application/json
    Authorization: Bearer dummy_expired_value
response:
  status: 401
  headers:
    Content-Type: application/json
  body:
    {
      "code": "035",
      "details": [
          "Provided token was invalid or expired"
        ]
    }