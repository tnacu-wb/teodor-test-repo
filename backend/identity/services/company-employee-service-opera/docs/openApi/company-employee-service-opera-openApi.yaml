components:
  schemas:
    Address:
      type: object
      properties:
        addressLine1:
          type: string
          example: 120 Holborn
          minLength: 1
        addressLine2:
          type: string
        addressLine3:
          type: string
        addressLine4:
          type: string
        addressLine5:
          type: string
        country:
          type: string
          example: GB
          minLength: 1
          pattern: "^[A-Z]{1,3}$"
        postCode:
          type: string
          example: EC1N 2TD
          minLength: 1
      required:
      - addressLine1
      - country
      - postCode
    ApproveRejectRequest:
      type: object
      description: The approve reject request
      properties:
        accessLevel:
          type: string
          enum:
          - STAYER
          - SELF
          - BOOKER
          - SUPER
          - BUSINESS_PAY_MANAGER
          - BUSINESS_PAY_USER
        approved:
          type: boolean
        email:
          type: string
          format: email
          minLength: 1
        language:
          type: string
          minLength: 1
      required:
      - accessLevel
      - approved
      - email
      - language
    BookingPreference:
      type: object
      properties:
        adults:
          type: integer
          format: int32
        children:
          type: integer
          format: int32
        continentalBreakfast:
          type: boolean
        cotRequired:
          type: boolean
        electronicInvoice:
          type: boolean
        mealDeal:
          type: boolean
        premierBreakfast:
          type: boolean
        preselectWifi:
          type: boolean
        roomType:
          type: string
          enum:
          - FAM
          - DB
          - TWIN
          - DIS
          - SB
      required:
      - adults
      - children
      - cotRequired
    Employee:
      type: object
      description: The employee JSON payload
      properties:
        accessLevel:
          type: string
          enum:
          - STAYER
          - SELF
          - BOOKER
          - SUPER
          - BUSINESS_PAY_MANAGER
          - BUSINESS_PAY_USER
        address:
          $ref: "#/components/schemas/Address"
        centralCardId:
          type: string
        dialingCode:
          type: string
        emailAddress:
          type: string
          format: email
          minLength: 1
        employeeAnswers:
          $ref: "#/components/schemas/EmployeeAnswers"
        employeeId:
          type: string
        employeeStatus:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - SUSPENDED
          - DEACTIVATED
          - PURGED
        firstName:
          type: string
          minLength: 1
          pattern: ^\D+$
        ghNumber:
          type: string
        guestHistoryNumber:
          type: string
        id:
          type: string
        innBusiness:
          type: boolean
        lastName:
          type: string
          minLength: 1
          pattern: ^\D+$
        lockedForEditing:
          type: boolean
        mobileNumber:
          type: string
        password:
          type: string
        phoneNumber:
          type: string
        position:
          type: string
        textConfirmation:
          type: boolean
        title:
          type: string
          minLength: 1
        updatePreferencesRequest:
          $ref: "#/components/schemas/UpdatePreferencesRequest"
      required:
      - address
      - emailAddress
      - firstName
      - lastName
      - title
    EmployeeActivationResponse:
      type: object
      properties:
        accessLevel:
          type: string
          enum:
          - STAYER
          - SELF
          - BOOKER
          - SUPER
          - BUSINESS_PAY_MANAGER
          - BUSINESS_PAY_USER
        address:
          $ref: "#/components/schemas/Address"
        centralCardId:
          type: string
        companyId:
          type: string
        companyName:
          type: string
        dialingCode:
          type: string
        emailAddress:
          type: string
          format: email
          minLength: 1
        employeeAnswers:
          $ref: "#/components/schemas/EmployeeAnswers"
        employeeId:
          type: string
        employeeStatus:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - SUSPENDED
          - DEACTIVATED
          - PURGED
        firstName:
          type: string
          minLength: 1
          pattern: ^\D+$
        ghNumber:
          type: string
        guestHistoryNumber:
          type: string
        id:
          type: string
        innBusiness:
          type: boolean
        lastName:
          type: string
          minLength: 1
          pattern: ^\D+$
        lockedForEditing:
          type: boolean
        mobileNumber:
          type: string
        password:
          type: string
        phoneNumber:
          type: string
        position:
          type: string
        textConfirmation:
          type: boolean
        title:
          type: string
          minLength: 1
        updatePreferencesRequest:
          $ref: "#/components/schemas/UpdatePreferencesRequest"
      required:
      - address
      - emailAddress
      - firstName
      - lastName
      - title
    EmployeeAnswers:
      type: object
      properties:
        customerReferenceAnswer:
          type: string
        purchaseOrderAnswer:
          type: string
        userDefinedAnswers:
          type: array
          items:
            $ref: "#/components/schemas/UserDefinedAnswer"
    EmployeeSummary:
      type: object
      properties:
        accessLevel:
          type: string
          enum:
          - STAYER
          - SELF
          - BOOKER
          - SUPER
          - BUSINESS_PAY_MANAGER
          - BUSINESS_PAY_USER
        emailAddress:
          type: string
          format: email
          minLength: 1
        employeeId:
          type: string
        employeeStatus:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - SUSPENDED
          - DEACTIVATED
          - PURGED
        firstName:
          type: string
          minLength: 1
          pattern: ^\D+$
        guestHistoryNumber:
          type: string
        id:
          type: string
        lastName:
          type: string
          minLength: 1
          pattern: ^\D+$
        lockedForEditing:
          type: boolean
        textConfirmation:
          type: boolean
        title:
          type: string
          minLength: 1
      required:
      - emailAddress
      - firstName
      - lastName
      - title
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "001"
          minLength: 1
        details:
          type: array
          example:
          - Error message
          items:
            type: string
      required:
      - code
      - details
    GetEmployeesResponse:
      type: object
      properties:
        employees:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeSummary"
        pageToken:
          type: string
        success:
          type: boolean
    InviteRequest:
      type: object
      description: The Invite JSON payload
      properties:
        centralCardId:
          type: string
        emailAddress:
          type: string
        innBusiness:
          type: boolean
      required:
      - emailAddress
    Link:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
    MarketingCustomer:
      type: object
      properties:
        countryOfResidence:
          type: string
        customerId:
          type: string
        firstName:
          type: string
        language:
          type: string
        lastName:
          type: string
        nationality:
          type: string
        title:
          type: string
        userId:
          type: string
    SendActivationRequest:
      type: object
      description: The activation request
      properties:
        companyName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        language:
          type: string
          pattern: en|de
      required:
      - companyName
      - email
      - language
    SourceDetails:
      type: object
      properties:
        channel:
          type: string
        journey:
          type: string
        locale:
          type: string
    UpdateAccessLevelRequest:
      type: object
      description: The Booking Preference JSON payload
      properties:
        accessLevel:
          type: string
          enum:
          - STAYER
          - SELF
          - BOOKER
          - SUPER
          - BUSINESS_PAY_MANAGER
          - BUSINESS_PAY_USER
      required:
      - accessLevel
    UpdatePreferencesRequest:
      type: object
      properties:
        brandCodes:
          type: array
          items:
            type: string
        contactSubType:
          type: string
          enum:
          - mobile
          - landline
        contactType:
          type: string
        contactValue:
          type: string
        customer:
          $ref: "#/components/schemas/MarketingCustomer"
        doubleOptIn:
          type: boolean
        optIn:
          type: boolean
        secondPartyOptIn:
          type: boolean
        sourceDetails:
          $ref: "#/components/schemas/SourceDetails"
        thirdPartyVendorsOptIn:
          type: boolean
    UpdateRegistrationRequest:
      type: object
      description: The Invite JSON payload
      properties:
        accessLevel:
          type: string
          enum:
          - STAYER
          - SELF
          - BOOKER
          - SUPER
          - BUSINESS_PAY_MANAGER
          - BUSINESS_PAY_USER
        approved:
          type: boolean
        emailAddress:
          type: string
    UserDefinedAnswer:
      type: object
      properties:
        miAnswer:
          type: string
        miID:
          type: string
