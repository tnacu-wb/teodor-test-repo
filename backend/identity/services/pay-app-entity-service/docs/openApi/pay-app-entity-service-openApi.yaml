components:
  schemas:
    AddApplicationCardDetailsDto:
      type: object
      properties:
        cardLimit:
          type: integer
          format: int32
        cardName:
          type: string
        emailAddress:
          type: string
        endDate:
          type: string
          format: date-time
        foreName:
          type: string
        lastName:
          type: string
        myCard:
          type: boolean
        restrictCardUsage:
          type: boolean
        startDate:
          type: string
          format: date-time
        title:
          type: string
    AddApplicationCardRequestDto:
      type: object
      properties:
        applicationGuid:
          type: string
          minLength: 1
        applicationId:
          type: string
          minLength: 1
        cardDetails:
          $ref: "#/components/schemas/AddApplicationCardDetailsDto"
        employeeId:
          type: integer
          format: int32
        scheme:
          type: string
          enum:
          - DE
          - GB
      required:
      - applicationGuid
      - applicationId
    AddApplicationCardResponseDto:
      type: object
      properties:
        cardGuid:
          type: string
    Address:
      type: object
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
        addressLine3:
          type: string
        addressLine4:
          type: string
        countryCode:
          type: string
        postcode:
          type: string
    AddressDto:
      type: object
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
        addressLine3:
          type: string
        addressLine4:
          type: string
        countryCode:
          type: string
        postcode:
          type: string
    AppCompanyDetailsDto:
      type: object
      properties:
        charityNumber:
          type: string
        companyName:
          type: string
          minLength: 1
        companyNameOnCard:
          type: string
        companyRegNum:
          type: string
        companyType:
          type: string
          minLength: 1
        correspondenceAddress:
          $ref: "#/components/schemas/AddressDto"
        correspondenceContactInfo:
          $ref: "#/components/schemas/ContactInfoDto"
        estMonthlySpend:
          type: string
          minLength: 1
        hotelBrandPolicy:
          type: string
        industrySector:
          type: string
        numberOfEmployees:
          type: string
        parentCompanyName:
