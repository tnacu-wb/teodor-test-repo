        required: true
      responses:
        "204":
          description: Success. No content.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "Bad Request: please check your input"
        "405":
          content:
            '*/*':
