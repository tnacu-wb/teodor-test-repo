openapi: 3.1.0
info:
  description: API Documentation
  title: Piba registration Api Documentation
  version: "1.1"
servers:
- description: Generated server url
  url: http://localhost:9065
tags:
- description: Monitor and interact
  externalDocs:
    description: Spring Boot Actuator Web API Documentation
    url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
  name: Actuator
paths:
  /piba-registration-service/actuator:
    get:
      operationId: links
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator root web endpoint
      tags:
      - Actuator
  /piba-registration-service/actuator/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'health'
      tags:
      - Actuator
  /piba-registration-service/actuator/info:
    get:
      operationId: info
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'info'
      tags:
      - Actuator
  /piba-registration-service/actuator/metrics:
    get:
      operationId: listNames
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'metrics'
      tags:
      - Actuator
  /piba-registration-service/actuator/metrics/{requiredMetricName}:
    get:
      operationId: metric
      parameters:
      - in: path
        name: requiredMetricName
        required: true
        schema:
          type: string
      - in: query
        name: tag
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "404":
          description: Not Found
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'metrics-requiredMetricName'
      tags:
      - Actuator
  /piba/registration/authenticate:
    post:
      operationId: registrationAuthenticate
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationAuthenticationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationAuthenticationResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error Occurred: Please check your input"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Server Error: Our bad something went wrong on our side"
      tags:
      - Piba Registration operations
  /piba/registration/info/{registration-code}:
    get:
      operationId: registrationGetInfo
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
      - in: path
        name: registration-code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationInfoResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error Occurred: Please check your input"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Server Error: Our bad something went wrong on our side"
      tags:
      - Piba Registration operations
  /piba/registration/submit:
    post:
      operationId: registrationSubmit
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationSubmitRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationSubmitResp"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Error Occurred: Please check your input"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Server Error: Our bad something went wrong on our side"
      tags:
      - Piba Registration operations
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "001"
          minLength: 1
        details:
          type: array
          example:
          - Error message
          items:
            type: string
      required:
      - code
      - details
    Link:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
    RegistrationAuthenticationAnswer:
      type: object
      properties:
        answer:
          type: string
          minLength: 1
        questionId:
          type: integer
          format: int32
      required:
      - answer
    RegistrationAuthenticationQuestion:
      type: object
      properties:
        question:
          type: string
        questionId:
          type: integer
          format: int32
    RegistrationAuthenticationRequest:
      type: object
      description: The registration authenticate JSON payload
      properties:
        authenticationAnswers:
          type: array
          items:
            $ref: "#/components/schemas/RegistrationAuthenticationAnswer"
        registrationCode:
          type: string
          example: A6ZN-2AZZ-Z2T6-A3YG
          minLength: 1
      required:
      - registrationCode
    RegistrationAuthenticationResponse:
      type: object
      properties:
        registrationCodeInfo:
          $ref: "#/components/schemas/RegistrationCodeInfo"
        registrationPrePopulatedItems:
          $ref: "#/components/schemas/RegistrationPrePopulatedItems"
    RegistrationCodeInfo:
      type: object
      properties:
        authenticationQuestions:
          type: array
          items:
            $ref: "#/components/schemas/RegistrationAuthenticationQuestion"
        primarySchemeCustomerId:
          type: integer
          format: int32
        registrationCode:
          type: string
        registrationRole:
          type: string
        schemeCustomerId:
          type: integer
          format: int32
    RegistrationDetails:
      type: object
      properties:
        emailAddress:
          type: string
          minLength: 1
        forename:
          type: string
          minLength: 1
        landlineNumber:
          type: string
        memorableWord:
          type: string
          example: word
          minLength: 1
        mobileNumber:
          type: string
        surname:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
      required:
      - emailAddress
      - forename
      - memorableWord
      - surname
      - title
    RegistrationInfoResponse:
      type: object
      properties:
        registrationCodeInfo:
          $ref: "#/components/schemas/RegistrationCodeInfo"
    RegistrationPrePopulatedItems:
      type: object
      properties:
        emailAddress:
          type: string
        forename:
          type: string
        landlineNumber:
          type: string
        mobileNumber:
          type: string
        surname:
          type: string
        title:
          type: string
    RegistrationSubmitRequest:
      type: object
      description: The registration submit JSON payload
      properties:
        authenticationAnswers:
          type: array
          items:
            $ref: "#/components/schemas/RegistrationAuthenticationAnswer"
        innBusiness:
          type: boolean
        registrationCode:
          type: string
          example: A6ZN-2AZZ-Z2T6-A3YG
          minLength: 1
        registrationDetails:
          $ref: "#/components/schemas/RegistrationDetails"
      required:
      - registrationCode
      - registrationDetails
    RegistrationSubmitResp:
      type: object
      properties:
        registrationCodeInfo:
          $ref: "#/components/schemas/RegistrationCodeInfo"
        tetherDetails:
          $ref: "#/components/schemas/TetherDetails"
    TetherDetails:
      type: object
      properties:
        accountNumber:
          type: string
        tetheredUserGuid:
          type: string
