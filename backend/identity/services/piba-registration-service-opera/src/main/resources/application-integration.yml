server:
  port: 9065

swagger:
  api:
    version: 1.1

feign:
  pibaguid:
    name: pibaguid
    url: http://localhost:${wiremock.server.port:1}
  client:
    config:
      pibaguid:
        connectTimeout: 1000
        readTimeout: 1000

worldline:
  clientMessageId: '{a6173aca-ea66-48e6-8ce2-4e04f1d4b628}'
  cultureCode: en-GB
  host: http://localhost:${wiremock.server.port:0}
  piba:
    username: gbtest
    password: gbtest
    service:
      url: ${worldline.host}/b2b.pi.v1.1/b2bpiapi.svc

  gb:
    clientMessageId: '{gb-client-message-id}}'
    cultureCode: en-GB
    username: gbtest
    password: gbtest
    url: ${worldline.host}/b2b.pi.v1.1/b2bpiapi.svc

  de:
    clientMessageId: '{de-client-message-id}'
    cultureCode: de-DE
    username: detest
    password: detest
    url: ${worldline.host}/b2b.pi.v1.1/b2bpiapi.svc

  tetheringPlus:
    enabled: true

auth:
  tenants:
    - name: default
      issuer: http://localhost/
      jwkUri: http://localhost:${wiremock.server.port:1}/.well-known/jwks.json
      namespace: http://localhost/
      audience: http://localhost/api/v2/

cdh:
  enableBbDataFetch: false
  oauth-client:
    host: http://localhost:${wiremock.server.port:0}
    token-url: /oauth2/v2.0/token
    client-id: clientId
    client-secret: clientSecret
    scope: https://localhost.azurewebsites.net/.default
    grant-type: client_credentials
    enabled: true
  api:
    host: http://localhost:${wiremock.server.port:1}
    is-oauth: true
    oauth:
      subscription-key-header-name: Ocp-Apim-Subscription-Key
      subscription-key: dummy-key

default:
  remote:
    ipAddress: 127.0.0.1

logging:
  level:
    org.springframework.ws.client.MessageTracing: trace
    uk.co.whitbread: debug

spring:
  cloud:
    config:
      enabled: false
  cache:
    type: ${CACHE_TYPE:none}
  data:
    redis:
      ssl:
        enabled: true
      cluster:
        max-redirects: 5
        nodes: ${REDIS_ENDPOINT}
      client-type: lettuce
      lettuce:
        cluster:
          refresh:
            period: 5m
            adaptive: true
      timeout: 10000
      connect-timeout: 10000
  lifecycle:
    timeout-per-shutdown-phase: 1m

threadpool:
  reg:
    coreSize: ${REG_EXECUTOR_CORE_SIZE:8}
    maxSize: ${REG_EXECUTOR_MAX_SIZE:16}
    queueSize: ${REG_EXECUTOR_QUEUE_SIZE:50}