discovery:
  image: 228079755329.dkr.ecr.eu-west-1.amazonaws.com/whitbread/discovery-service:latest
  environment:
    spring.profiles.active: uat
  ports:
    - "8761:8761"
pibaregistration:
  image: 228079755329.dkr.ecr.eu-west-1.amazonaws.com/whitbread/piba-registration-service:latest
  environment:
    _JAVA_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5066"
    spring.profiles.active: uat
  ports:
    - "9051:9051"
gateway:
  image: 228079755329.dkr.ecr.eu-west-1.amazonaws.com/whitbread/gateway-service:latest
  environment:
    spring.profiles.active: uat
  ports:
    - "10000:10000"