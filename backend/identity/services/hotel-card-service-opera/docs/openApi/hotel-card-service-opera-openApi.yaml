          description: Initiated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Bad Request: please check your input"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Server Error: unrecoverable error server-side"
      summary: Initiate card storage session
      tags:
      - Customer Cards operations
components:
  schemas:
    Address:
      type: object
      properties:
        companyName:
          type: string
          example: Whitbread
        countryCode:
          type: string
          example: GB
        line1:
          type: string
          example: 120 Holborn
        line2:
          type: string
        line3:
          type: string
        line4:
          type: string
        line5:
          type: string
        postCode:
          type: string
          example: EC1N 2TD
        type:
          type: string
          enum:
          - "HOME, BUSINESS"
          example: BUSINESS
      required:
      - companyName
      - countryCode
      - line1
      - postCode
      - type
    AddressDTO:
      type: object
      properties:
        companyName:
          type: string
          example: Whitbread
        country:
          type: string
        countryCode:
          type: string
          example: GB
        line1:
          type: string
          example: 120 Holborn
        line2:
          type: string
        line3:
          type: string
        line4:
          type: string
        line5:
          type: string
        postCode:
          type: string
          example: EC1N 2TD
        type:
          type: string
          enum:
          - "HOME, BUSINESS"
          example: BUSINESS
      required:
      - countryCode
      - line1
      - postCode
    AuthorizeScaRequest:
      type: object
      description: The JSON payload to initiate SCA session
      properties:
        bookingReference:
          type: string
        country:
          type: string
        environment:
          type: string
          pattern: "^(https?://)([\\w.-]+)(:\\d+)?$"
        language:
          type: string
          pattern: "^[a-zA-Z]{2,3}$"
        requestId:
          type: string
      required:
      - environment
      - language
      - requestId
    CostCentreData:
      type: object
      properties:
        accountUniqueCustomerId:
          type: integer
          format: int32
        costCentreCode:
          type: string
        costCentreName:
          type: string
        costCentreUniqueCustomerId:
          type: integer
          format: int32
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        details:
          type: array
          items:
            type: string
      required:
      - code
      - details
    InnBusinessCorrespondenceAddress:
      type: object
      properties:
        associateAddressWithFutureCardholder:
          type: boolean
        countryCodeISO:
          type: string
        forename:
          type: string
        line1:
          type: string
        line2:
          type: string
        line3:
          type: string
        line4:
          type: string
        postCode:
          type: string
        surname:
          type: string
        title:
          type: string
    InnBusinessPayCard:
      type: object
      properties:
        cardHolderName:
          type: string
        cardId:
          type: string
        cardNumber:
          type: string
        cardRegistration:
          type: string
        cardRegistrationCount:
          type: integer
          format: int32
        cardStatus:
          type: string
          enum:
          - PENDING
          - NOT_ACTIVATED
          - CANCELLED
          - CURRENT
          - HOT
        isActivated:
          type: boolean
        myCard:
          type: boolean
    Link:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
    PaymentCard:
      type: object
      description: The PaymentCard JSON payload
      properties:
        billingAddress:
          $ref: "#/components/schemas/Address"
        cardHolderName:
          type: string
        cardId:
          type: string
        cardLabel:
          type: string
        cardNumber:
          type: string
        cardToken:
          type: string
        cardType:
          type: string
        cnpBusinessAccountPassword:
          type: string
        cnpBusinessAccountUsername:
          type: string
        cnpRequired:
          type: boolean
        expiryDate:
          type: string
        issueNumber:
          type: string
        startDate:
          type: string
    PaymentCardDTO:
      type: object
      description: The PaymentCard JSON payload
      properties:
        billingAddress:
          $ref: "#/components/schemas/AddressDTO"
        business:
          type: boolean
        cardHolderName:
          type: string
        cardId:
          type: string
        cardLabel:
          type: string
        cardNumberLast4Digits:
          type: string
        cardToken:
          type: string
        cardType:
          type: string
        cnpBusinessAccountPassword:
          type: string
        cnpBusinessAccountUsername:
          type: string
        cnpRequired:
          type: boolean
        companyAccountId:
          type: string
        customerAccountId:
          type: string
        employeeAccountId:
          type: string
        expiryDate:
          type: string
        personalCard:
          type: boolean
        userEmail:
          type: string
      required:
      - business
      - cardHolderName
      - cardNumberLast4Digits
      - cardToken
      - cardType
      - expiryDate
      - personalCard
      - userEmail
    PaymentRequiredDetails:
      type: object
      properties:
        paymentRedirect:
          type: string
        providerUrl:
          type: string
        sessionId:
          type: string
        template:
          type: string
    SaveCardDetails:
      type: object
      properties:
        business:
          type: boolean
        cardId:
          type: string
        cardLabel:
          type: string
        cardType:
          type: string
          enum:
          - PIBA
          - CARD
          - NONE
        cnpRequired:
          type: boolean
        memorableWord:
          type: string
        personalCard:
          type: boolean
      required:
      - cardType
    SaveCardRequest:
      type: object
      description: The Initiate PaymentCard JSON payload
      properties:
        billingAddress:
          $ref: "#/components/schemas/Address"
        cardDetails:
          $ref: "#/components/schemas/SaveCardDetails"
        country:
          type: string
        environment:
          type: string
          pattern: "^(https?://)([\\w.-]+)(:\\d+)?$"
        language:
          type: string
          pattern: "^[a-zA-Z]{2,3}$"
        requestId:
          type: string
      required:
      - billingAddress
      - cardDetails
      - environment
      - language
      - requestId
    WorldlineAccountCardAddRequest:
      type: object
      properties:
        apiUserGuid:
          type: string
        cardCorrespondenceAddress:
          $ref: "#/components/schemas/InnBusinessCorrespondenceAddress"
        cardDeliveryAddressType:
          type: string
          enum:
          - COMPANY_REGISTERED_ADDRESS
          - COMPANY_CORRESPONDENCE_ADDRESS
          - CARDHOLDER_ALTERNATIVE_ADDRESS
        cardLimit:
          type: integer
          format: int32
        companyAccountId:
          type: string
        displayName:
          type: string
        employeeAccountId:
          type: string
        primarySchemeCustomerId:
          type: integer
          format: int32
        restrictCardUsage:
          type: boolean
        restrictionEnd:
          type: string
        restrictionStart:
          type: string
        schemeCustomerId:
          type: integer
          format: int32
    WorldlineAccountCardCancelAndReplaceRequest:
      type: object
      properties:
        apiUserGuid:
          type: string
        cardCorrespondenceAddress:
          $ref: "#/components/schemas/InnBusinessCorrespondenceAddress"
        cardDeliveryAddressType:
          type: string
          enum:
          - COMPANY_REGISTERED_ADDRESS
          - COMPANY_CORRESPONDENCE_ADDRESS
          - CARDHOLDER_ALTERNATIVE_ADDRESS
        issueReplacement:
