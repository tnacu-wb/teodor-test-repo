          format: int32
        pageNumber:
          type: integer
          format: int32
        showMyCards:
          type: boolean
        userId:
          type: string
    WorldlineAccountCardUpdateRequest:
      type: object
      properties:
        apiUserGuid:
          type: string
        cardLimit:
          type: integer
          format: int32
        displayName:
          type: string
        restrictCardUsage:
          type: boolean
        restrictionEnd:
          type: string
        restrictionStart:
          type: string
    WorldlineAccountCardsResponse:
      type: object
      properties:
        from:
          type: integer
          format: int32
        innBusinessPayCardList:
          type: array
          items:
            $ref: "#/components/schemas/InnBusinessPayCard"
        lastPage:
          type: integer
          format: int32
        to:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
    WorldlineAddress:
      type: object
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
        addressLine3:
          type: string
        addressLine4:
          type: string
        countryCode:
          type: string
        postcode:
          type: string
    WorldlineCancelAndReplaceCardDetails:
      type: object
      properties:
        activated:
          type: boolean
        cardHolderName:
          type: string
        cardId:
          type: string
        cardRestriction:
          $ref: "#/components/schemas/WorldlineCardRestriction"
        email:
          type: string
        expiryDate:
          type: string
          format: date-time
        firstName:
          type: string
        lastName:
          type: string
        myCard:
          type: boolean
        pan:
          type: string
        primarySchemeCustomerId:
          type: string
        registeredUsers:
          type: array
          items:
            $ref: "#/components/schemas/WorldlineRegisteredUser"
        status:
          type: string
        title:
          type: string
    WorldlineCardAmountSpend:
      type: object
      properties:
        amount:
          type: number
        currencyCode:
          type: string
    WorldlineCardDetails:
      type: object
      properties:
        activated:
          type: boolean
        amountSpend:
          $ref: "#/components/schemas/WorldlineCardAmountSpend"
        cardAction:
          type: string
        cardHolderName:
          type: string
        cardId:
          type: integer
          format: int32
        cardLimit:
          type: integer
          format: int32
        cardNumber:
          type: string
        cardRestriction:
          $ref: "#/components/schemas/WorldlineCardRestriction"
        email:
          type: string
        expiryDate:
          type: string
          format: date-time
        firstName:
          type: string
        lastName:
          type: string
        myCard:
          type: boolean
        primaryUserId:
          type: integer
          format: int32
        registeredUsers:
          type: array
          items:
            $ref: "#/components/schemas/WorldlineRegisteredUser"
        status:
          type: string
        title:
          type: string
        userId:
          type: integer
          format: int32
    WorldlineCardRestriction:
      type: object
      properties:
        endDate:
          type: string
          format: date-time
        restrictCardUsage:
          type: boolean
        startDate:
          type: string
          format: date-time
    WorldlineContactDetails:
      type: object
      properties:
        email:
          type: string
        foreName:
          type: string
        lastName:
          type: string
        mobile:
          type: string
        position:
          type: string
        telephone:
          type: string
        title:
          type: string
    WorldlineRegisteredUser:
      type: object
      properties:
        apiUserGuid:
          type: string
        displayName:
          type: object
        emailAddress:
          type: string
        hasAddress:
          type: boolean
    WorldlineReplaceCardRequest:
      type: object
      properties:
        address:
          $ref: "#/components/schemas/WorldlineAddress"
        cancelCard:
