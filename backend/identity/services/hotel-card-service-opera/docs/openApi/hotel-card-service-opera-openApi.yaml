      tags:
      - Customer Cards operations
  /v2/customers/cards/sca:
    post:
      description: This endpoint starts a new session with Strong Customer Authentication
        (SCA) for card storage.
      operationId: initiateAuthorizeScaIframeSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeScaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequiredDetails"
          description: SCA Session Initiated Successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Bad Request: Please check your input"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Forbidden: Access Denied"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Server Error: Unrecoverable error on the server-side"
      summary: Initiate SCA session
      tags:
      - Customer Cards operations
  /v2/customers/cards/session:
    post:
      description: This endpoint starts a new card storage session for the customer.
      operationId: initiateIframeSession
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
