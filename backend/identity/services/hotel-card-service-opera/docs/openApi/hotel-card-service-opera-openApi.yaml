  /v2/customers/cards:
    put:
      description: This endpoint creates a new payment card or updates an existing
        payment card
      operationId: createOrUpdatePaymentCard
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCardDTO"
        required: true
      responses:
        "204":
          description: Success. No content.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Bad Request: please check your input"
        "404":
          content:
