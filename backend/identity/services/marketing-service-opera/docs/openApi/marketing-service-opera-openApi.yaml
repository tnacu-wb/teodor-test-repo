components:
  schemas:
    BrandPermission:
      type: object
      properties:
        "2ndOptIn":
          type: boolean
        "2ndOptInReq":
          type: boolean
        brand:
          type: string
        brandCode:
          type: string
        contentPermission:
          $ref: "#/components/schemas/ContentPermissionData"
        countriesOfResidence:
          type: array
          items:
            type: string
        lastModifiedBy:
          type: string
        lastOptInDate:
          type: string
        lastOptOutDate:
          type: string
        lastSourceBusinessKey:
          type: string
        lastSourceCustomerId:
          type: string
        optIn:
          type: boolean
        sharedBy:
          type: array
          items:
            type: string
    ConfirmDoubleOptInRequest:
      type: object
      properties:
        brandCodes:
          type: array
          items:
            type: string
        contactSubType:
          type: string
          enum:
          - mobile
          - landline
        contactType:
          type: string
          enum:
          - email
          - phone
          - email_contact_channel_id
        customerId:
          type: string
      required:
      - brandCodes
      - contactType
    ContactChannel:
      type: object
      properties:
        contactChannelId:
          type: string
        contactChannelType:
          type: string
          enum:
          - Email
          - Telephone
          minLength: 1
        contactChannelValue:
          type: string
      required:
      - contactChannelType
    ContentPermission:
      type: object
      properties:
        secondParty:
          type: boolean
        thirdParty:
          type: boolean
    ContentPermissionData:
      type: object
      properties:
        "2ndParty":
          type: boolean
        "3rdParty":
          type: boolean
    Customer:
      type: object
      properties:
        countryOfResidence:
          type: string
        customerId:
          type: string
        firstName:
          type: string
        language:
          type: string
          description: ISO code for language which the customer would like to receive
            marketing.
          example: en
        lastName:
          type: string
        nationality:
          type: string
        title:
          type: string
        userId:
          type: string
      required:
      - countryOfResidence
      - language
    EditSubscription:
      type: object
      properties:
        brandCodes:
          type: array
          items:
            type: string
        contactChannelId:
          type: string
        contactChannelPermission:
          type: boolean
        contactChannelSubType:
          type: string
        contactChannelType:
          type: string
          enum:
          - Email
          - Telephone
          minLength: 1
        contactChannelValue:
          type: string
        contentPermission:
          $ref: "#/components/schemas/ContentPermission"
      required:
      - brandCodes
      - contactChannelPermission
      - contactChannelType
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "001"
          minLength: 1
        details:
          type: array
          example:
          - Error message
          items:
            type: string
      required:
      - code
      - details
    Link:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
    LoyaltyAccount:
      type: object
      properties:
        loyaltyBrand:
          type: string
        loyaltySystemId:
          type: string
    MarketingSubscriptionInfoResponse:
      type: object
      properties:
        businessClient:
          type: boolean
        countryCode:
          type: string
        emailAddress:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        regionSubscriptions:
          type: array
          items:
            $ref: "#/components/schemas/RegionSubscription"
        regions:
          type: array
          items:
            type: string
        restaurantNewsletter:
          type: boolean
        sessionId:
          type: string
        subscribedStatus:
          type: boolean
    MarketingSubscriptionRequest:
      type: object
      properties:
        businessClient:
          type: boolean
        countryCode:
          type: string
        customerId:
          type: string
        emailAddress:
          type: string
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        regionSubscriptions:
          type: array
          items:
            $ref: "#/components/schemas/RegionSubscription"
        regions:
          type: array
          items:
            type: string
        restaurantNewsletter:
          type: boolean
        sessionId:
          type: string
      required:
      - firstName
      - lastName
    MarketingSubscriptionResponse:
      type: object
      properties:
        customerId:
          type: string
        emailAddress:
          type: string
        success:
          type: boolean
    NewsletterPreferencesEditRequest:
      type: object
      properties:
        customerId:
          type: string
        subscriptionData:
          type: array
          items:
            $ref: "#/components/schemas/EditSubscription"
          minItems: 1
        userId:
          type: string
      required:
