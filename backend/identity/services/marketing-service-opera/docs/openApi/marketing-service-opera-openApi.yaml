        is mandatory.
      operationId: updatePermissions
      parameters:
      - content:
          '*/*':
            schema:
              type: string
              default: test@validemail.com
        description: Value of contactType
        example: test@validemail.com|07777777777
        in: path
        name: contactValue
        required: true
      - content:
          '*/*':
            schema:
              type: string
              default: email
              enum:
              - email
              - phone
        in: path
        name: contactType
        required: true
      requestBody:
        content:
          application/json:
            schema:
