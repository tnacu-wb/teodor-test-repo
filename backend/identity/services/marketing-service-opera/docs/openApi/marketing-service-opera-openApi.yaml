  /marketing/newsletter/{contactType}/{contactValue}:
    get:
      description: Get Newsletter Preferences Authenticated
      operationId: getPermissions
      parameters:
      - in: header
        name: hotel-brand
        required: false
        schema:
          type: string
          default: PI
          enum:
          - HUB
          - PI
          - PID
          - CBT
          - ZIP
      - in: header
        name: bookingChannel
        required: false
        schema:
          type: string
          default: WEB
          enum:
          - MOBILE
          - WEB
          - WEB_DE
          - CBT
      - content:
          '*/*':
            schema:
              type: string
              default: Bearer sdfghjdfgh
        in: header
        name: Authentication
        required: true
      - in: header
        name: Origin
        required: false
        schema:
          type: string
      - in: query
        name: request
        required: true
        schema:
          $ref: "#/components/schemas/PreferencesGetRequest"
      - content:
          '*/*':
            schema:
              type: string
              default: email
              enum:
              - email
              - phone
        in: path
        name: contactType
        required: true
      - content:
          '*/*':
            schema:
              type: string
              default: test@validemail.com
        in: path
        name: contactValue
        required: true
      - content:
          '*/*':
            schema:
              type: string
              enum:
              - BARB
              - BEEF
              - BREW
              - COOK
              - PGER
              - PHUB
              - PINN
              - PZIP
              - TABL
              - TAYB
              - WINN
        description: Array of brand codes.
        in: query
        name: brandCodes
      - content:
          '*/*':
            schema:
              type: string
              default: gb
        description: The country of residence of the guest
        in: query
        name: countryOfResidence
      - content:
          '*/*':
            schema:
              type: string
              default: en
        description: Language
        in: query
        name: language
      responses:
        "200":
          content:
            application/json:
              schema:
