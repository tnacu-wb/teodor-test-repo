          description: "Error Occurred: You did something wrong check your input"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Server Error: Our bad something went wrong on our side"
      summary: Newsletter Subscription - Used to retrieve newsletter preferences using
        the contact channel value.This endpoint is authenticated to prevent access
        of another customers newsletter persmissions using their email or phone.
      tags:
      - Permission Management API Controller
    put:
      description: Newsletter Subscription - updates newsletter preferences or creates
