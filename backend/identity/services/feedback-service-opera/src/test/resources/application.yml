server:
  port: 9033

swagger:
  api:
    version: "1.4"

security:
  oauth2:
    host: oauth2.com
    baseUrl: https://${security.oauth2.host}
    authorityUrl:
      url: ${security.oauth2.baseUrl}/${security.oauth2.tenant}
    tenant: 111-111-111
    clientId: 9999-9999-99999
    clientSecret: 123
    credentials:
      username: test
      password: test
crm:
  api:
    version: 4.0
  host: localhost:${wiremock.server.port:0}
  baseUrl: http://${crm.host}
  incidents:
    path: api/data/v8.2/incidents
    feedback:
      url: ${crm.baseUrl}/${crm.incidents.path}
    caseid:
      url: ${crm.incidents.feedback.url}({guid})?$select=ticketnumber
    contactType: dev
  defaultFeedbackSource: https://www.premierinn.com

logging:
  level:
    org.springframework.ws.client.MessageTracing.sent: TRACE
    org.springframework.ws.client.MessageTracing.received: TRACE
    uk.co.whitbread: debug
    feign: debug

logging.request.time: true