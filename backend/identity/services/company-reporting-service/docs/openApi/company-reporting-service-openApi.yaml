openapi: 3.1.0
info:
  description: <p>TBU</p>
  title: Reporting API Documentation
  version: 1.0.0
servers:
- description: Generated server url
  url: http://localhost:9125
tags:
- description: Monitor and interact
  externalDocs:
    description: Spring Boot Actuator Web API Documentation
    url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
  name: Actuator
paths:
  /v1/company-reports/actuator:
    get:
      operationId: links
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator root web endpoint
      tags:
      - Actuator
  /v1/company-reports/actuator/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'health'
      tags:
      - Actuator
  /v1/company-reports/actuator/info:
    get:
      operationId: info
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'info'
      tags:
      - Actuator
  /v1/company-reports/actuator/metrics:
    get:
      operationId: listNames
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'metrics'
      tags:
      - Actuator
  /v1/company-reports/actuator/metrics/{requiredMetricName}:
    get:
      operationId: metric
      parameters:
      - in: path
        name: requiredMetricName
        required: true
        schema:
          type: string
      - in: query
        name: tag
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "404":
          description: Not Found
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'metrics-requiredMetricName'
      tags:
      - Actuator
  /v1/company-reports/admin/emergency-report:
    get:
      operationId: getEmergencyReport
      parameters:
      - in: header
        name: WB-Authorization
        required: true
        schema:
          type: string
      - in: query
        name: language
        required: true
        schema:
          type: string
          pattern: EN|DE
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiReportResponseDto"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request - Invalid Client Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Resource Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Creates emergency report
      tags:
      - reporting-controller
  /v1/company-reports/admin/management-information-report:
    get:
      operationId: getManagementInformationS3Report
      parameters:
      - in: header
        name: WB-Authorization
        required: true
        schema:
          type: string
      - in: query
        name: fromDate
        required: true
        schema:
          type: string
          minLength: 1
      - in: query
        name: toDate
        required: true
        schema:
          type: string
          minLength: 1
      - in: query
        name: showQnAcolumns
        required: true
        schema:
          type: boolean
      - in: query
        name: language
        required: true
        schema:
          type: string
          pattern: EN|DE
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiReportResponseDto"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request - Invalid Client Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Resource Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Creates management information report
      tags:
      - reporting-controller
  /v1/company-reports/admin/{companyId}/management-information-report:
    get:
      operationId: getManagementInformationReport
      parameters:
      - in: header
        name: WB-Authorization
        required: true
        schema:
          type: string
      - in: path
        name: companyId
        required: true
        schema:
          type: string
      - in: query
        name: fromDate
        required: true
        schema:
          type: string
          minLength: 1
      - in: query
        name: toDate
        required: true
        schema:
          type: string
          minLength: 1
      - in: query
        name: showQnAcolumns
        required: true
        schema:
          type: boolean
      - in: query
        name: language
        required: true
        schema:
          type: string
          pattern: EN|DE
      responses:
        "200":
          content:
            multipart/form-data: {}
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request - Invalid Client Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Resource Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Creates management information report
      tags:
      - reporting-controller
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        debugMessage:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
        errCode:
          type: integer
          format: int32
        globalErrTextTemplate:
          type: string
    Link:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
    MiReportResponseDto:
      type: object
      properties:
        downloadUrl:
          type: string
        fileName:
          type: string
        reportName:
          type: string
    ValidationError:
      type: object
      properties:
        elementId:
          type: string
        errTextTemplate:
          type: string
