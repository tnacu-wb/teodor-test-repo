openapi: 3.1.0
info:
  description: <p>TBU</p>
  title: Promo API Documentation
  version: 1.0.0
servers:
- description: Generated server url
  url: http://localhost:9137
tags:
- description: Monitor and interact
  externalDocs:
    description: Spring Boot Actuator Web API Documentation
    url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
  name: Actuator
paths:
  /v1/promo/actuator:
    get:
      operationId: links
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator root web endpoint
      tags:
      - Actuator
  /v1/promo/actuator/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'health'
      tags:
      - Actuator
  /v1/promo/actuator/info:
    get:
      operationId: info
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'info'
      tags:
      - Actuator
  /v1/promo/actuator/prometheus:
    get:
      operationId: scrape
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - CONTENT_TYPE_004
          - CONTENT_TYPE_OPENMETRICS_100
          - CONTENT_TYPE_PROTOBUF
      - in: query
        name: includedNames
        schema:
          type: string
      responses:
        "200":
          content:
            application/openmetrics-text;version=1.0.0;charset=utf-8:
              schema:
                type: object
            application/vnd.google.protobuf;proto=io.prometheus.client.MetricFamily;encoding=delimited:
              schema:
                type: object
            text/plain;version=0.0.4;charset=utf-8:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'prometheus'
      tags:
      - Actuator
  /v1/promo/batches:
    get:
      description: "Returns paginated promo batch summaries, sorted by creation time."
      operationId: getPromoBatchSummary
      parameters:
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResponse"
          description: Page of promo batches returned successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid paging or sorting parameters
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: List promo batches (paged)
      tags:
      - promo-batch-controller
    post:
      description: Creates a new promo batch and starts async promo code generation.
      operationId: createPromoBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoBatchRequestDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoBatchResponseDto"
          description: Promo batch created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation error in request payload
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Create promo batch
      tags:
      - promo-batch-controller
  /v1/promo/batches/promo-kind:
    get:
      description: Validates the given promo code and returns its promo kind along
        with Opera promo code and unique promo code status.
      operationId: validatePromoKind
      parameters:
      - description: Promo code to validate
        example: 27CR7HCV49
        in: query
        name: promoCode
        required: true
        schema:
          type: string
          description: Promo code to validate
          example: 27CR7HCV49
          minLength: 1
      - description: country (Region)
        example: GB
        in: query
        name: country
        required: false
        schema:
          type: string
          description: country (Region)
          example: GB
      - description: Channel
        example: PI
        in: query
        name: channel
        required: false
        schema:
          type: string
          description: Channel
          example: PI
      - description: Sub channel (platform)
        example: WEB
        in: query
        name: subChannel
        required: false
        schema:
          type: string
          description: Sub channel (platform)
          example: WEB
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoKindResponseDto"
          description: Promo code validated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid or malformed promo code
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Promo code not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Validate promo kind by promo code
      tags:
      - promo-batch-controller
  /v1/promo/batches/redeem:
    post:
      description: Redeems a unique promo code against a booking reference and returns
        the redemption status.
      operationId: redeemPromoCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemPromoCodeRequestDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemPromoCodeResponseDto"
          description: Promo code redeemed or already processed
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation error in request payload
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Redeem promo code
      tags:
      - promo-batch-controller
  /v1/promo/batches/{batchId}:
    get:
      description: Retrieves a single promo batch summary by its identifier.
      operationId: getPromoBatchById
      parameters:
      - description: Promo batch identifier
        in: path
        name: batchId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoBatchSummaryDto"
          description: Promo batch found
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Promo batch not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Get promo batch by id
      tags:
      - promo-batch-controller
  /v1/promo/batches/{batchId}/mark-downloaded:
    patch:
      description: Marks the given promo batch as downloaded so that passwords are
        no longer returned.
      operationId: markPromoBatchAsDownloaded
      parameters:
      - description: Promo batch identifier to mark as downloaded
        in: path
        name: batchId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Download flag updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid batch id or request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Promo batch not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error or DB update failure
      summary: Mark promo batch as downloaded
      tags:
      - promo-batch-controller
components:
  schemas:
    BatchEligibilityRequestDto:
      type: object
      properties:
        channel:
          type: string
          enum:
          - PI
          - CCUI
          - BB
        platforms:
          type: array
          items:
            type: string
            enum:
            - WEB
            - MOBILE
          minItems: 1
        region:
          type: string
          enum:
          - GB
          - DE
      required:
      - channel
      - platforms
      - region
    BatchEligibilitySummaryDto:
      type: object
      properties:
        channel:
          type: string
          enum:
          - PI
          - CCUI
          - BB
        platforms:
          type: array
          items:
            type: string
            enum:
            - WEB
            - MOBILE
        region:
          type: string
          enum:
          - GB
          - DE
    ContentDisposition:
      type: object
      properties:
        attachment:
          type: boolean
        charset:
          type: string
        filename:
          type: string
        formData:
          type: boolean
        inline:
          type: boolean
        name:
          type: string
        type:
          type: string
    DefaultHttpStatusCode:
      allOf:
      - $ref: "#/components/schemas/HttpStatusCode"
    ErrorResponse:
      type: object
      properties:
        body:
          $ref: "#/components/schemas/ProblemDetail"
        detailMessageArguments:
          type: array
          items: {}
        detailMessageCode:
          type: string
        headers:
          $ref: "#/components/schemas/HttpHeaders"
        statusCode:
          oneOf:
          - $ref: "#/components/schemas/DefaultHttpStatusCode"
          - $ref: "#/components/schemas/HttpStatus"
        titleMessageCode:
          type: string
        typeMessageCode:
          type: string
    HttpHeaders:
      type: object
      properties:
        accept:
          type: array
          items:
            $ref: "#/components/schemas/MediaType"
        acceptCharset:
          type: array
          items:
            type: string
        acceptLanguage:
          type: array
          items:
            type: object
            properties:
              range:
                type: string
              weight:
                type: number
                format: double
        acceptLanguageAsLocales:
          type: array
          items:
            type: string
        acceptPatch:
          type: array
          items:
            $ref: "#/components/schemas/MediaType"
        accessControlAllowCredentials:
          type: boolean
        accessControlAllowHeaders:
          type: array
          items:
            type: string
        accessControlAllowMethods:
          type: array
          items:
            $ref: "#/components/schemas/HttpMethod"
        accessControlAllowOrigin:
          type: string
        accessControlExposeHeaders:
          type: array
          items:
            type: string
        accessControlMaxAge:
          type: integer
          format: int64
        accessControlRequestHeaders:
          type: array
          items:
            type: string
        accessControlRequestMethod:
          $ref: "#/components/schemas/HttpMethod"
        all:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
        allow:
          type: array
          items:
            $ref: "#/components/schemas/HttpMethod"
          uniqueItems: true
        basicAuth:
          type: string
          writeOnly: true
        bearerAuth:
          type: string
          writeOnly: true
        cacheControl:
          type: string
        connection:
          type: array
          items:
            type: string
        contentDisposition:
          $ref: "#/components/schemas/ContentDisposition"
        contentLanguage:
          type: string
        contentLength:
          type: integer
          format: int64
        contentType:
          $ref: "#/components/schemas/MediaType"
        date:
          type: integer
          format: int64
        empty:
          type: boolean
        etag:
          type: string
        expires:
          type: integer
          format: int64
        host:
          type: object
          properties:
            address:
              type: object
              properties:
                address:
                  type: string
                  format: byte
                anyLocalAddress:
                  type: boolean
                canonicalHostName:
                  type: string
                hostAddress:
                  type: string
                hostName:
                  type: string
                linkLocalAddress:
                  type: boolean
                loopbackAddress:
                  type: boolean
                mcglobal:
                  type: boolean
                mclinkLocal:
                  type: boolean
                mcnodeLocal:
                  type: boolean
                mcorgLocal:
                  type: boolean
                mcsiteLocal:
                  type: boolean
                multicastAddress:
                  type: boolean
                siteLocalAddress:
                  type: boolean
            hostName:
              type: string
            hostString:
              type: string
            port:
              type: integer
              format: int32
            unresolved:
              type: boolean
        ifMatch:
          type: array
          items:
            type: string
        ifModifiedSince:
          type: integer
          format: int64
        ifNoneMatch:
          type: array
          items:
            type: string
        ifUnmodifiedSince:
          type: integer
          format: int64
        lastModified:
          type: integer
          format: int64
        location:
          type: string
          format: uri
        origin:
          type: string
        pragma:
          type: string
        range:
          type: array
          items:
            $ref: "#/components/schemas/HttpRange"
        upgrade:
          type: string
        vary:
          type: array
          items:
            type: string
    HttpMethod: {}
    HttpRange: {}
    HttpStatus:
      allOf:
      - $ref: "#/components/schemas/HttpStatusCode"
      enum:
      - 100 CONTINUE
      - 101 SWITCHING_PROTOCOLS
      - 102 PROCESSING
      - 103 EARLY_HINTS
      - 200 OK
      - 201 CREATED
      - 202 ACCEPTED
      - 203 NON_AUTHORITATIVE_INFORMATION
      - 204 NO_CONTENT
      - 205 RESET_CONTENT
      - 206 PARTIAL_CONTENT
      - 207 MULTI_STATUS
      - 208 ALREADY_REPORTED
      - 226 IM_USED
      - 300 MULTIPLE_CHOICES
      - 301 MOVED_PERMANENTLY
      - 302 FOUND
      - 303 SEE_OTHER
      - 304 NOT_MODIFIED
      - 307 TEMPORARY_REDIRECT
      - 308 PERMANENT_REDIRECT
      - 400 BAD_REQUEST
      - 401 UNAUTHORIZED
      - 402 PAYMENT_REQUIRED
      - 403 FORBIDDEN
      - 404 NOT_FOUND
      - 405 METHOD_NOT_ALLOWED
      - 406 NOT_ACCEPTABLE
      - 407 PROXY_AUTHENTICATION_REQUIRED
      - 408 REQUEST_TIMEOUT
      - 409 CONFLICT
      - 410 GONE
      - 411 LENGTH_REQUIRED
      - 412 PRECONDITION_FAILED
      - 413 CONTENT_TOO_LARGE
      - 413 PAYLOAD_TOO_LARGE
      - 414 URI_TOO_LONG
      - 415 UNSUPPORTED_MEDIA_TYPE
      - 416 REQUESTED_RANGE_NOT_SATISFIABLE
      - 417 EXPECTATION_FAILED
      - 418 I_AM_A_TEAPOT
      - 421 MISDIRECTED_REQUEST
      - 422 UNPROCESSABLE_CONTENT
      - 422 UNPROCESSABLE_ENTITY
      - 423 LOCKED
      - 424 FAILED_DEPENDENCY
      - 425 TOO_EARLY
      - 426 UPGRADE_REQUIRED
      - 428 PRECONDITION_REQUIRED
      - 429 TOO_MANY_REQUESTS
      - 431 REQUEST_HEADER_FIELDS_TOO_LARGE
      - 451 UNAVAILABLE_FOR_LEGAL_REASONS
      - 500 INTERNAL_SERVER_ERROR
      - 501 NOT_IMPLEMENTED
      - 502 BAD_GATEWAY
      - 503 SERVICE_UNAVAILABLE
      - 504 GATEWAY_TIMEOUT
      - 505 HTTP_VERSION_NOT_SUPPORTED
      - 506 VARIANT_ALSO_NEGOTIATES
      - 507 INSUFFICIENT_STORAGE
      - 508 LOOP_DETECTED
      - 509 BANDWIDTH_LIMIT_EXCEEDED
      - 510 NOT_EXTENDED
      - 511 NETWORK_AUTHENTICATION_REQUIRED
    HttpStatusCode:
      type: object
      properties:
        error:
          type: boolean
        is1xxInformational:
          type: boolean
        is2xxSuccessful:
          type: boolean
        is3xxRedirection:
          type: boolean
        is4xxClientError:
          type: boolean
        is5xxServerError:
          type: boolean
    Link:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
    MediaType:
      type: object
      properties:
        charset:
          type: string
        concrete:
          type: boolean
        parameters:
          type: object
          additionalProperties:
            type: string
        qualityValue:
          type: number
          format: double
        subtype:
          type: string
        subtypeSuffix:
          type: string
        type:
          type: string
        wildcardSubtype:
          type: boolean
        wildcardType:
          type: boolean
    PagedResponse:
      type: object
      properties:
        endIndex:
          type: integer
          format: int64
        hasNext:
          type: boolean
        items:
          type: array
          items: {}
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        startIndex:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    PromoBatchRequestDto:
      type: object
      properties:
        batchCount:
          type: integer
          format: int32
          description: Number of promo codes to generate in this batch
          example: 500
          maximum: 1000000
          minimum: 1
        batchEligibilities:
          type: array
          description: Batch eligibility configuration
          items:
            $ref: "#/components/schemas/BatchEligibilityRequestDto"
        campaignName:
          type: string
          description: Campaign name
        codeLength:
          type: integer
          format: int32
          description: 'Length of each generated promo code '
          example: 10
          minimum: 8
        expiryDate:
          type: string
          format: date
          description: Expiry date for the generated promo codes
          example: 2026-12-25
        hotelId:
          type: string
          description: Hotel identifier requesting the promo batch
          example: HOTELID
          minLength: 1
        isMultiple:
          type: boolean
          description: Indicates whether the promo code is multi-use
        maxRedemptionLimit:
          type: integer
          format: int32
          description: Maximum allowed redemptions
        notes:
          type: string
          description: Add notes for reference
        operaPromoCode:
          type: string
          description: Opera promo code to which the generated codes will be linked
          example: PROMO
          minLength: 1
        prefix:
          type: string
          description: prefix (1–20 characters).
          example: ABC
          maxLength: 20
          minLength: 0
          pattern: "^[a-zA-Z0-9]+$"
        requestedBy:
          type: string
          description: Requested by user
      required:
      - codeLength
      - hotelId
      - operaPromoCode
      - prefix
    PromoBatchResponseDto:
      type: object
      properties:
        batchCount:
          type: integer
          format: int32
        batchId:
          type: string
          format: uuid
        campaignName:
          type: string
        codeLength:
          type: integer
          format: int32
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        downloaded:
          type: boolean
        expiryDate:
          type: string
          format: date
        isMultiple:
          type: boolean
        maxRedemptionLimit:
          type: integer
          format: int32
        notes:
          type: string
        operaPromoCode:
          type: string
        password:
          type: string
        prefix:
          type: string
        requestedBy:
          type: string
        s3Key:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - COMPLETED
          - FAILED
          - EXPIRED
        updatedAt:
          type: string
          format: date-time
    PromoBatchSummaryDto:
      type: object
      properties:
        batchCount:
          type: integer
          format: int32
        batchEligibilities:
          type: array
          items:
            $ref: "#/components/schemas/BatchEligibilitySummaryDto"
        batchId:
          type: string
          format: uuid
        campaignName:
          type: string
        createdAt:
          type: string
          format: date-time
        downloaded:
          type: boolean
        isMultiple:
          type: boolean
        maxRedemptionLimit:
          type: integer
          format: int32
        notes:
          type: string
        operaPromoCode:
          type: string
        password:
          type: string
        prefix:
          type: string
        requestedBy:
          type: string
        s3Key:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - COMPLETED
          - FAILED
          - EXPIRED
    PromoKindResponseDto:
      type: object
      properties:
        operaPromoCode:
          type: string
        promoKind:
          type: string
          enum:
          - GENERIC
          - UNIQUE
        uniquePromoCodeStatus:
          type: string
          enum:
          - ISSUED
          - REDEEMED
          - EXPIRED
          - VOID
    RedeemPromoCodeRequestDto:
      type: object
      properties:
        bookingReference:
          type: string
          description: Booking reference
          example: AQN3269618
          minLength: 1
        promoCode:
          type: string
          description: Unique promo code
          example: 27CR7HCV49
          minLength: 1
      required:
      - bookingReference
      - promoCode
    RedeemPromoCodeResponseDto:
      type: object
      properties:
        message:
          type: string
        promoCode:
          type: string
        status:
          type: string
          enum:
          - REDEEMED
          - ALREADY_REDEEMED
          - INVALID_PROMO_CODE
          - EXPIRED
        success:
          type: boolean
