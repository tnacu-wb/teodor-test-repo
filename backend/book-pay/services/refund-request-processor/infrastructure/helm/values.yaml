# Values for refund-request-processor.
#
# Shaped for the shared `opera-app-chart` (whitbread-eos/helm-central-charts), which is
# what .github/workflows/ci-matrix-deploy.yaml installs. The chart reads the pod spec
# from `deployment.*` and gates optional resources on a `create` flag — keys outside
# those names are silently ignored, so an unset `deployment.containerEnvs` renders
# `env: null` and the pod starts with no environment at all.
#
# Derived from microservices-gitops/opera-dev/apps/refund-request-processor.yaml. Not
# carried over: `imageAutomation` (the pipeline --sets it false and pins the tag it just
# built) and `canary` (a Flagger Canary takes ownership of the Service's .spec.selector
# / .spec.ports[].name and the VirtualService's .spec.http, which then collides with
# Helm's server-side apply on the next upgrade of the same release).
#
# Overridden per-deploy by ci-matrix-deploy.yaml, via --set:
#   applicationName, service.name, namespace, image.repository, image.tag,
#   imageAutomation.create

applicationName: refund-request-processor
namespace: opera-be

image:
  repository: 327347623470.dkr.ecr.eu-west-1.amazonaws.com/whitbreaddigital/refund-request-processor
  pullPolicy: Always
  tag: "develop"

imagePullSecrets:
  - name: regcred

deployment:
  create: true
  replicaCount: 1

  containerPorts:
    - containerPort: 9113
      protocol: TCP
      name: http

  containerEnvFrom:
    - configMapRef:
        name: refund-request-processor-configmap
    # Cluster-provisioned, not owned by this release: supplies KAFKA_BOOTSTRAP_SERVERS,
    # which application.yml otherwise defaults to localhost:9092.
    - configMapRef:
        name: kafka-bootstrap-config

  containerEnvs:
    - name: SPRING_PROFILES_ACTIVE
      value: opera-dev
    - name: JAVA_OPTS
      value: -XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=80 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

    # ── Kafka ────────────────────────────────────────────────────────────────
    - name: TOPICS_ACK
      value: ack-dev
    - name: TOPICS_REFUNDS
      value: refunds-dev
    - name: KAFKA_REFUNDS_CONCURRENCY
      value: '3'
    - name: KAFKA_GROUP_ID
      valueFrom:
        configMapKeyRef:
          name: refund-request-processor-configmap
          key: groupId
    - name: KAFKA_REQUEST_TIMEOUT
      valueFrom:
        configMapKeyRef:
          name: refund-request-processor-configmap
          key: requestTimeout
    - name: KAFKA_HEARTBEAT_INTERVAL
      valueFrom:
        configMapKeyRef:
          name: refund-request-processor-configmap
          key: heartBeatInterval
    - name: KAFKA_MAX_POLL_INTERVAL
      valueFrom:
        configMapKeyRef:
          name: refund-request-processor-configmap
          key: maxPollInterval
    - name: KAFKA_MAX_POLL_RECORDS
      valueFrom:
        configMapKeyRef:
          name: refund-request-processor-configmap
          key: maxPollRecords
    - name: KAFKA_SESSION_TIMEOUT
      valueFrom:
        configMapKeyRef:
          name: refund-request-processor-configmap
          key: sessionTimeout

    # ── 3C (the payment provider refunds are issued through) ─────────────────
    # apiConfigs.yml sends THREEC_PAYMENT_SERVICE_API_VALUE as the X-WHIT-API-KEY header
    # and has no default for it, so a missing key fails startup.
    - name: THREEC_HOST
      value: threec-payment-service-opera
    - name: THREEC_PAYMENT_SERVICE_API_VALUE
      valueFrom:
        secretKeyRef:
          name: threec-secrets
          key: threec-header

  dns:
    ndots: 3

  lifecycle:
    preStop:
      exec:
        command:
          - sh
          - -c
          - sleep 20
  terminationGracePeriodSeconds: 90

  livenessProbe:
    httpGet:
      path: /v1/rrp/actuator/health/liveness
      port: 9113
    initialDelaySeconds: 90
    periodSeconds: 30
    timeoutSeconds: 30
    successThreshold: 1
    failureThreshold: 6

  readinessProbe:
    httpGet:
      path: /v1/rrp/actuator/health/readiness
      port: 9113
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 30
    successThreshold: 1
    failureThreshold: 6

  # requests.memory tracks limits.memory because the heap is sized off the memory LIMIT
  # (-XX:MaxRAMPercentage above).
  resources:
    requests:
      cpu: 400m
      memory: 1100Mi
    limits:
      memory: 1100Mi

service:
  create: true
  name: refund-request-processor
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 9113
      protocol: TCP
      name: port9113

# Pinned at one replica: this is a Kafka consumer, and adding pods only reshuffles
# partition assignments rather than adding throughput at the current partition count.
autoscaling:
  create: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  scaleDownStabilizationSeconds: 300
  scaleUpStabilizationSeconds: 120

configMap:
  create: true
  data:
    groupId: basket-refund-dev
    requestTimeout: '30000'
    heartBeatInterval: '1000'
    maxPollInterval: '900000'
    maxPollRecords: '30'
    sessionTimeout: '45000'

istio:
  create: true
  auth: false
  gateway: opera-api
  regex:
    enabled: true
    pattern: ^\/v\d+\/rrp.*
