# Ephemeral (per-PR) values for payment-methods-entity-service.
#
# ci-matrix-deploy-eph.yaml layers this file OVER the backend stack defaults at
# backend/infrastructure/helm/ephemeral-values.yaml:
#
#   opera-app-chart/values.yaml  <  stack ephemeral defaults  <  THIS FILE  <  --set
#
# Everything generic to a PR release — canary/autoscaling/pdb/istio/prometheus off,
# replicaCount 1, the trimmed lifecycle and grace period, ndots, probe TIMINGS,
# imagePullSecrets, namespace — is inherited and is not repeated here.
#
# Overridden per-deploy by ci-matrix-deploy-eph.yaml, via --set:
#   applicationName, service.name, namespace, image.repository, image.tag,
#   imageAutomation.create, ephemeral
#
# Environment is inlined rather than read from
# `payment-methods-entity-service-configmap`: the chart names its ConfigMap
# `{{ applicationName }}-configmap` and applicationName is the PR release name here, so
# a hard-coded configMapKeyRef could never resolve. Inlining also makes the release
# self-contained against a GitOps change landing mid-PR.
#
# NOTE: this service shares the dev Redis cluster — its cache is not per-PR. A change to
# a cached value's shape has to stay readable by the dev deployment, or dev breaks for
# as long as the PR release is up.

applicationName: payment-methods-entity-service

image:
  repository: 327347623470.dkr.ecr.eu-west-1.amazonaws.com/whitbreaddigital/payment-methods-entity-service

deployment:
  containerPorts:
    - containerPort: 9107
      protocol: TCP
      name: http
    # Not published through the Service — reach it with
    # `kubectl port-forward -n opera-be deploy/<release> 5005:5005`.
    - containerPort: 5005
      protocol: TCP
      name: debug

  containerEnvs:
    - name: SPRING_PROFILES_ACTIVE
      value: opera-dev
    - name: JAVA_OPTS
      value: -XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=70 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

    # ── Downstream services ──────────────────────────────────────────────────
    # Shared dev instances, not per-PR copies. Bare hostnames because every one of these
    # publishes port 80 on its Service. To wire this release to a PR release of one of
    # them instead, change the value on the branch to <service>-pr-<n>.
    - name: RESERVATION_HOST
      value: hotel-reservation-entity-service
    - name: CONTENT_HOST
      value: content-entity-service
    - name: HOTEL_ACCOUNT_HOST
      value: hotel-account-service-opera
    - name: COMPANY_SERVICE_HOST
      value: company-service-opera
    - name: HOTEL_CARD_HOST
      value: hotel-card-service-opera
    - name: RULES_AGENT_HOST
      value: rules-agent-entity-service
    - name: BASKET_SERVICE_HOST
      value: basket-service
    - name: HOTEL_ENTITY_HOST
      value: hotel-entity-service
    - name: CONFIG_MAP_THREEC_URL
      value: threec-payment-service-opera

    # ── Auth tenants ─────────────────────────────────────────────────────────
    # No defaults in application.yml, so leaving these out would fail startup outright.
    - name: CCUI_TENANT_AUDIENCE
      value: https://api.dev.whitbread.digital
    - name: CCUI_TENANT_ISSUER
      value: https://dev-whitbread-digital.eu.auth0.com/
    - name: CCUI_TENANT_JWK_URI
      value: https://dev-whitbread-digital.eu.auth0.com/.well-known/jwks.json
    - name: CCUI_TENANT_NAMESPACE
      value: https://ccui.opera.whitbread.digital
    - name: PI_BB_TENANT_AUDIENCE
      value: https://wbodetest.eu.auth0.com/api/v2/
    - name: PI_BB_TENANT_ISSUER
      value: https://auth0.premierinn.digital/
    - name: PI_BB_TENANT_JWK_URI
      value: https://auth0.premierinn.digital/.well-known/jwks.json
    - name: PI_BB_TENANT_NAMESPACE
      value: https://premierinn.com

    # ── Behaviour flags and cache ────────────────────────────────────────────
    - name: PIBA_EURO_FLAG
      value: 'true'
    - name: DATATRANS_NOT_SUPPORTED_CARD_OPTIONS
      value: SAVED_CARD,NEW_PIBA,AP,GP,RESERVE_WITHOUT_CARD,ACCOUNT_COMPANY,PAYPAL
    - name: UNLEASH_ENVIRONMENT
      value: dev
    - name: UNLEASH_URL
      value: https://whitbread.edge.getunleash.io/api
    # `optional: true` keeps a missing secret a degraded environment rather than a
    # broken one: nothing in .github/workflows creates this secret, and a hard
    # secretKeyRef to one absent from opera-be leaves the pod in
    # CreateContainerConfigError forever while `helm --wait` times out.
    - name: UNLEASH_TOKEN
      valueFrom:
        secretKeyRef:
          name: unleash-enterprise-secrets
          key: token
          optional: true
    - name: CACHE_TYPE
      value: redis
    - name: REDIS_ENDPOINT
      value: clustercfg.opera-dev.jynzd4.memorydb.eu-west-1.amazonaws.com:6379

  readinessProbe:
    httpGet:
      path: /v1/payment-methods/actuator/health/readiness
      port: 9107

  livenessProbe:
    httpGet:
      path: /v1/payment-methods/actuator/health/liveness
      port: 9107

  # Only memory is stated; requests.cpu (50m) merges through from the stack defaults.
  # requests.memory is pinned to limits.memory because the heap is sized off the limit.
  resources:
    requests:
      memory: 1024Mi
    limits:
      memory: 1024Mi

service:
  name: payment-methods-entity-service
  ports:
    - port: 80
      targetPort: 9107
      protocol: TCP
      name: port9107
