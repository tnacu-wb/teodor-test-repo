server:
  port: 9109
  servlet:
    contextPath: "/bcp/"
  shutdown: graceful

swagger:
  api:
    version: "@project.version@"

info:
  build:
    groupId: "@project.groupId@"
    artifact: "@project.artifactId@"
    description: "@project.description@"
    version: "@project.version@"
    git:
      originUrl: "@git.remote.origin.url@"
      branch: "@git.branch@"
      commit:
        id: "@git.commit.id@"
        time: "@git.commit.time@"
        message: "@git.commit.message.short@"
springdoc:
  show-actuator: true
  writer-with-order-by-keys: true

management:
  tracing:
    propagation:
      type: w3c
    baggage:
      correlation:
        fields:
          - x-amzn-trace-id
          - flow-code
          - wb-session-id
        enabled: true
      enabled: true
      remote-fields:
        - x-amzn-trace-id
        - flow-code
        - wb-session-id
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    brave: WARN
  configuration:
    debug:
      enabled: true
      exclusions:
        - .*/actuator.*
  pattern:
    # Logging pattern containing traceId and spanId; no longer provided through Sleuth by default
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

spring:
  lifecycle:
    timeout-per-shutdown-phase: 1m

config:
  service:
    basket:
      host: http://${BASKET_HOST:localhost:9104}
      confirmItemProcessingEndpoint: "/v1/baskets/{basket-reference}/items/{itemId}/acks"

basket:
  kafka:
    bootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    groupId: ${KAFKA_GROUP_ID:basketOrder}
    requestTimeout: ${KAFKA_REQUEST_TIMEOUT:480000}
    heartBeatInterval: ${KAFKA_HEARTBEAT_INTERVAL:1000}
    maxPollInterval: ${KAFKA_MAX_POLL_INTERVAL:900000}
    maxPollRecords: ${KAFKA_MAX_POLL_RECORDS:100}
    sessionTimeout: ${KAFKA_SESSION_TIMEOUT:600000}

  confirmation:
    topics:
      ack:
        name: ${TOPICS_ACK:ack}
        concurrency: ${KAFKA_ACK_CONCURRENCY:1}

---
spring:
  config:
    activate:
      on-profile:
        - opera-perf
        - opera-dev
        - opera-qa
        - local

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
