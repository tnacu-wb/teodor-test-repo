spring:
  application:
    name: payment-orchestration-service

server:
  port: 0

# Temporal configuration (matches TemporalConfig @Value bindings)
temporal:
  server:
    host: localhost
    port: 7233
  task-queue: payment-workflows-test

# External service endpoints (test stubs)
integrations:
  payment:
    workflow:
      timeout: 30m
  datatrans:
    base-url: http://localhost:${wiremock.server.port:8080}
    merchant-password: test-merchant-password
    connect-timeout: 5s
    read-timeout: 5s
    merchant-id:
      prefix: "deWB-"
      default-merchant-id: "deWB-default"
      provisioned-hotels:
        - HARHOR
        - GRESOU
    webhook:
      callback-base-url: http://localhost:${wiremock.server.port:8080}
      hmac-key: test-hmac-key
      validation-enabled: false
    reconciliation:
      initial-delay: 2s
      poll-interval: 1s
      max-duration: 10s
      enabled: false
  basket:
    base-url: http://localhost:${wiremock.server.port:8080}
  opera:
    base-url: http://localhost:${wiremock.server.port:8080}

payment:
  security:
    allowed-return-url-hosts:
      - "premierinn.com"
      - "www.premierinn.com"
      - "premierinn.digital"
      - "localhost"
  events:
    topics:
      payment-authorised: payment-authorised-test
      booking-completed: booking-completed-test

# Monitoring (minimal for tests)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
