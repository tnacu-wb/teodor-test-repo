components:
  schemas:
    AemCookieContentResponseDto:
      type: object
      properties:
        cookiePolicies:
          $ref: "#/components/schemas/CookiePoliciesDto"
    AemFooterResponseDto:
      type: object
      properties:
        copyrightInfo:
          type: string
        legalCopyRightLabel:
          type: string
        socialMediaIcons:
          type: array
          items:
            $ref: "#/components/schemas/SocialMediaIconDto"
        tabs:
          type: array
          items:
            $ref: "#/components/schemas/TabDto"
    AemHeaderResponseDto:
      type: object
      properties:
        homeAltSrc:
          type: string
        locationSrc:
          type: array
          items:
            type: string
        logoAlt:
          type: string
        logoSrc:
          type: string
        moreLocationName:
          type: string
        navbar:
          type: array
          items:
            $ref: "#/components/schemas/NavbarItemDto"
    BookPageDto:
      type: object
      properties:
        heroBackgroundImageSrc:
          type: string
        heroImageSrc:
          type: string
        name:
          type: string
        subtitleName:
          type: string
    ColumnDto:
      type: object
      properties:
        linkItems:
          type: array
          items:
            $ref: "#/components/schemas/LinkItemDto"
        name:
          type: string
    Consent:
      type: object
      properties:
        consentStatement:
          type: boolean
        email:
          type: boolean
        phone:
          type: boolean
        postal:
          type: boolean
        privacyStatement:
          type: boolean
        profiling:
          type: boolean
        pushNotification:
          type: boolean
        sms:
          type: boolean
        termsAndConditions:
          type: boolean
    CookieGroupDto:
      type: object
      properties:
        alwaysActive:
          type: boolean
        cookieName:
          type: string
        description:
          type: string
        title:
          type: string
        toggleLabel:
          type: string
    CookiePoliciesDto:
      type: object
      properties:
        brand:
          type: string
        introView:
          $ref: "#/components/schemas/IntroViewDto"
        manageView:
          $ref: "#/components/schemas/ManageViewDto"
        version:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "001"
          minLength: 1
        details:
          type: array
          example:
          - Error message
          items:
            type: string
      required:
      - code
      - details
    EventOrEquiryRequest:
      type: object
      properties:
        adults:
          type: integer
          format: int32
        children:
          type: integer
          format: int32
        consent:
          $ref: "#/components/schemas/Consent"
        date:
          type: string
        emailAddress:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        menuIds:
          type: array
          items:
            type: string
        occasionId:
          type: string
        siteId:
          type: string
        specialRequest:
          type: string
        telephoneNumber:
          type: string
        time:
          type: string
    IntroViewDto:
      type: object
      properties:
        acceptAllButtonText:
          type: string
        description:
          type: string
        manageButtonText:
          type: string
        necessaryOnlyButtonText:
          type: string
        title:
          type: string
    LabelDataDto:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    Link:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
    LinkItemDto:
      type: object
      properties:
        linkSrc:
          type: string
        name:
          type: string
        openInNewTab:
          type: boolean
    ManageViewDto:
      type: object
      properties:
        alwaysActiveText:
          type: string
        cookieGroup:
          type: array
          items:
            $ref: "#/components/schemas/CookieGroupDto"
        description:
          type: string
        saveSettingsButtonText:
          type: string
        title:
          type: string
    NavbarItemDto:
      type: object
      properties:
        linkItems:
          type: array
          items:
            $ref: "#/components/schemas/LinkItemDto"
        name:
          type: string
    SocialMediaIconDto:
      type: object
      properties:
        label:
          type: string
        linkSrc:
          type: string
        visible:
          type: boolean
    TabDto:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnDto"
        name:
          type: string
    ZonalUuidResponseDto:
      type: object
      properties:
        address1:
          type: string
        address2:
          type: string
        address3:
          type: string
        address4:
          type: string
        bookingHeroBackgroundImage:
          type: string
        bookingHeroImage:
          type: string
        contactInfo:
          type: string
        externalSourceSystem:
          type: string
        externalSystemIdentifier:
          type: string
        googleMapURL:
          type: string
        id:
          type: string
        latitude:
          type: string
        longitude:
          type: string
        path:
          type: string
        title:
          type: string
