paypal:
paypal-transformations:
  paypalForwardAPIRequest:
    - path: "/body/Request/Type"
      value: "$Type"
    - path: "/body/Request/Version"
      value: "$Version"
    - path: "/body/Request/Credentials/ValidationID"
      value: "$ValidationID"
    - path: "/body/Request/Credentials/ValidationCode"
      value: "$ValidationCode"
    - path: "/body/Request/Credentials/ValidationCodeHash"
      value: "$ValidationCodeHash"
    - path: "/body/Request/Params/CardNumber"
      value: "$number"
    - path: "/body/Request/Params/CardExpiryDateMMYY"
      value:
        - ["format_expiration", "%m%y"]
        - ["array", "$expiration_month", "$expiration_year"]
    - path: "/body/Request/Params/CVV2"
      value: "$cvv"
    - path: "/body/Request/Params/CardholderStreetAddress1"
      value: "$CardholderStreetAddress1"
    - path: "/body/Request/Params/CardholderStreetAddress2"
      value: "$CardholderStreetAddress2"
    - path: "/body/Request/Params/CardholderStreetAddress3"
      value: "$CardholderStreetAddress3"
    - path: "/body/Request/Params/CardholderStreetAddress4"
      value: "$CardholderStreetAddress4"
    - path: "/body/Request/Params/CardholderCity"
      value: "$CardholderCity"
    - path: "/body/Request/Params/CardholderState"
      value: "$CardholderState"
    - path: "/body/Request/Params/CardholderCountry"
      value: "$CardholderCountry"
    - path: "/body/Request/Params/CardholderZipCode"
      value: "$CardholderZipCode"
    - path: "/body/Request/Params/CardholderNameFirst"
      value: "$CardholderNameFirst"
    - path: "/body/Request/Params/CardholderNameLast"
      value: "$CardholderNameLast"
    - path: "/body/Request/Params/CardholderEmail"
      value: "$CardholderEmail"
    - path: "/body/Request/Params/CardholderTelephone"
      value: "$CardholderTelephone"
    - path: "/body/Request/Params/Amount"
      value: "$Amount"
    - path: "/body/Request/Params/Currency"
      value: "$Currency"
    - path: "/body/Request/Params/RequesterTransRefNum"
      value: "$RequesterTransRefNum"
    - path: "/body/Request/Params/OptionFlags"
      value: "$OptionFlags"
    - path: "/body/Request/Params/COFIndicator"
