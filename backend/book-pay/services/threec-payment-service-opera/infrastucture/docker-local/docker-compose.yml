version: '3.6'
services:
  dynamodb-local:
    command: "-jar DynamoDBLocal.jar -sharedDb -optimizeDbBeforeStartup -dbPath ./data"
    image: "amazon/dynamodb-local:1.16.0"
    container_name: dynamodb-local
    ports:
      - "8042:8000"
    volumes:
      - "./docker/dynamodb:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
  unleash:
    image: unleashorg/unleash-server:latest
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres/postgres"
      # Disable SSL for database connections.
      DATABASE_SSL: "false"
      # Changing log levels:
      LOG_LEVEL: "warn"
      INIT_CLIENT_API_TOKENS: "default:development.unleash-insecure-api-token,default:production.unleash-insecure-api-token"
      ENABLE_OAS: true
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "node", "index.js" ]
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:4242/health || exit 1
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s
  edge:
    image: unleashorg/unleash-edge:latest
    ports:
      - "3063:3063"
    command:
      - edge
    environment:
      TOKENS: "default:development.unleash-insecure-api-token,default:production.unleash-insecure-api-token"
      UPSTREAM_URL: "http://unleash:4242"
    depends_on:
      unleash:
        condition: service_healthy
    healthcheck:
      test: unleash-edge health
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s