# Ephemeral (per-PR) values for hotel-payment-service-opera.
#
# ci-matrix-deploy-eph.yaml layers this file OVER the backend stack defaults at
# backend/infrastructure/helm/ephemeral-values.yaml:
#
#   opera-app-chart/values.yaml  <  stack ephemeral defaults  <  THIS FILE  <  --set
#
# Everything generic to a PR release — canary/autoscaling/pdb/istio/prometheus off,
# replicaCount 1, the trimmed lifecycle and grace period, ndots, imagePullSecrets,
# namespace — is inherited and is not repeated here. The probe TIMINGS are the
# exception: see below.
#
# Overridden per-deploy by ci-matrix-deploy-eph.yaml, via --set:
#   applicationName, service.name, namespace, image.repository, image.tag,
#   imageAutomation.create, ephemeral
#
# Environment is inlined rather than read from `hotel-payment-service-opera-configmap`
# because the chart names its ConfigMap `{{ applicationName }}-configmap` and
# applicationName is the PR release name here, so a hard-coded configMapKeyRef could
# never resolve.

applicationName: hotel-payment-service-opera

image:
  repository: 327347623470.dkr.ecr.eu-west-1.amazonaws.com/whitbreaddigital/hotel-payment-service-opera

deployment:
  containerPorts:
    - containerPort: 9019
      protocol: TCP
      name: http
    # Not published through the Service — reach it with
    # `kubectl port-forward -n opera-be deploy/<release> 5005:5005`.
    - containerPort: 5005
      protocol: TCP
      name: debug

  containerEnvs:
    - name: SPRING_PROFILES_ACTIVE
      value: opera-dev
    - name: JAVA_OPTS
      value: -XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=70 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

    # Shared dev downstream, addressed by bare hostname (its Service publishes port 80).
    - name: HOTEL_CARD_URL
      value: hotel-card-service-opera

    # BART (the booking back end) and the domain defaults. DOMAIN_DEFAULT_URL and
    # DOMAIN_DEFAULT_IP have no defaults in application.yml — omitting them would fail
    # startup, so they are inlined with the same values dev uses.
    - name: BART_HOST
      value: https://alpha2.digitalbookings.premierinn.com/
    - name: DOMAIN_DEFAULT_URL
      value: https://secure2.beta.premierinn.digital/
    - name: DOMAIN_DEFAULT_IP
      value: 127.0.0.1
    - name: CDH_ENABLE_DATA_FETCH
      value: 'true'

    # `optional: true` keeps a missing secret a degraded environment rather than a
    # broken one: nothing in .github/workflows creates bart-credentials, and a hard
    # secretKeyRef to a secret absent from opera-be leaves the pod in
    # CreateContainerConfigError forever while `helm --wait` times out. Without the
    # credentials every BART call is rejected and the rest of the service is testable.
    - name: BART_USERNAME
      valueFrom:
        secretKeyRef:
          name: bart-credentials
          key: bart_username
          optional: true
    - name: BART_PASSWORD
      valueFrom:
        secretKeyRef:
          name: bart-credentials
          key: bart_password
          optional: true

  # This service is a slow starter — dev holds liveness off for 7 minutes. The stack
  # default readiness budget (20s + 24x5s = 140s) is too tight for it, so the whole
  # budget is restated: readiness gets 30s + 30x10s = 330s, and liveness is pushed out
  # past that so a JVM still booting is never restarted mid-start. 330s still fits
  # inside the workflow's `helm --wait --timeout 10m`.
  readinessProbe:
    httpGet:
      path: /hotel-payment-service/actuator/health/readiness
      port: 9019
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 30

  livenessProbe:
    httpGet:
      path: /hotel-payment-service/actuator/health/liveness
      port: 9019
    initialDelaySeconds: 420
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  # Only memory is stated; requests.cpu (50m) merges through from the stack defaults.
  # requests.memory is pinned to limits.memory because the heap is sized off the limit.
  resources:
    requests:
      memory: 1024Mi
    limits:
      memory: 1024Mi

service:
  name: hotel-payment-service-opera
  ports:
    - port: 80
      targetPort: 9019
      protocol: TCP
      name: port9019
