# Values for basket-service.
#
# Shaped for the shared `opera-app-chart` (whitbread-eos/helm-central-charts), which is
# what .github/workflows/ci-matrix-deploy.yaml installs. The chart reads the pod spec
# from `deployment.*` and gates optional resources on a `create` flag — keys outside
# those names are silently ignored, so an unset `deployment.containerEnvs` renders
# `env: null` and the pod starts with no environment at all.
#
# Derived from microservices-gitops/opera-dev/apps/basket-service.yaml. Not carried
# over: `imageAutomation` (the pipeline --sets it false and pins the tag it just built)
# and `canary` (a Flagger Canary takes ownership of the Service's .spec.selector /
# .spec.ports[].name and the VirtualService's .spec.http, which then collides with
# Helm's server-side apply on the next upgrade of the same release).
#
# Overridden per-deploy by ci-matrix-deploy.yaml, via --set:
#   applicationName, service.name, namespace, image.repository, image.tag,
#   imageAutomation.create

applicationName: basket-service
namespace: opera-be

image:
  repository: 327347623470.dkr.ecr.eu-west-1.amazonaws.com/whitbreaddigital/basket-service
  pullPolicy: Always
  tag: "develop"

imagePullSecrets:
  - name: regcred

deployment:
  create: true
  replicaCount: 1

  # IRSA: the DynamoDB tables below are reached with the role annotated on this
  # ServiceAccount, not with static credentials.
  serviceAccount: basket-service

  containerPorts:
    - containerPort: 9104
      protocol: TCP
      name: http

  containerEnvFrom:
    # Cluster-provisioned, not owned by this release: supplies KAFKA_BOOTSTRAP_SERVERS,
    # which application.yml otherwise defaults to localhost:9092.
    - configMapRef:
        name: kafka-bootstrap-config

  containerEnvs:
    - name: SPRING_PROFILES_ACTIVE
      value: opera-dev
    - name: JAVA_OPTS
      value: -XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=80 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

    # ── Kafka ────────────────────────────────────────────────────────────────
    - name: TOPICS_ORDERS
      value: orders-dev
    - name: TOPICS_REFUNDS
      value: refunds-dev

    # ── DynamoDB ─────────────────────────────────────────────────────────────
    # Table names and region come from secrets rather than a ConfigMap because that is
    # how they are provisioned alongside the tables themselves.
    - name: DYNAMODB_TABLE_BASKET_NAME
      valueFrom:
        secretKeyRef:
          name: new-basket-service
          key: basket_dynamodb_table_name
    - name: DYNAMODB_TABLE_BASKET_REGION
      valueFrom:
        secretKeyRef:
          name: new-basket-service
          key: basket_dynamodb_table_region
    - name: DYNAMODB_TABLE_PREPAID_BOOKING_CHARGES_NAME
      valueFrom:
        secretKeyRef:
          name: prepaid-booking-charges
          key: prepaid_booking_charges_dynamodb_table_name

    # ── Downstream services ──────────────────────────────────────────────────
    # Bare hostnames: every one of these publishes port 80 on its Service.
    - name: RESERVATION_HOST
      value: hotel-reservation-entity-service
    - name: CONTENT_HOST
      value: content-entity-service
    - name: THREEC_HOST
      value: threec-payment-service-opera
    - name: HOTEL_ENTITY_HOST
      value: hotel-entity-service
    - name: REFUND_REQUEST_PROCESSOR
      value: refund-request-processor
    - name: CDH_ADAPTER_HOST
      value: cdh-adapter-service
    - name: RULES_AGENT_HOST
      value: rules-agent-entity-service
    - name: OHIP_HOST
      value: ohip-adapter-service
    - name: PROMO_SERVICE_HOST
      value: promo-service
    - name: MARKETING_HOST
      valueFrom:
        configMapKeyRef:
          name: basket-service-configmap
          key: marketing_url

    # ── Auth tenants ─────────────────────────────────────────────────────────
    # Two issuers: the internal CCUI tenant and the customer-facing Premier Inn /
    # Business Booker tenant. None of these have defaults in application.yml, so a
    # missing key is a startup failure — which is correct for authentication config.
    - name: CCUI_TENANT_AUDIENCE
      valueFrom:
        configMapKeyRef:
          name: basket-service-configmap
          key: ccui_tenant_audience
    - name: CCUI_TENANT_NAMESPACE
      valueFrom:
        configMapKeyRef:
          name: basket-service-configmap
          key: ccui_tenant_namespace
    - name: CCUI_TENANT_ISSUER
      valueFrom:
        configMapKeyRef:
          name: basket-service-configmap
          key: ccui_tenant_issuer
    - name: CCUI_TENANT_JWK_URI
      valueFrom:
        configMapKeyRef:
          name: basket-service-configmap
          key: ccui_tenant_jwk_uri
    - name: PI_BB_TENANT_AUDIENCE
      valueFrom:
        configMapKeyRef:
          name: basket-service-configmap
          key: pi_bb_tenant_audience
    - name: PI_BB_TENANT_NAMESPACE
      valueFrom:
        configMapKeyRef:
          name: basket-service-configmap
          key: pi_bb_tenant_namespace
    - name: PI_BB_TENANT_ISSUER
      valueFrom:
        configMapKeyRef:
          name: basket-service-configmap
          key: pi_bb_tenant_issuer
    - name: PI_BB_TENANT_JWK_URI
      valueFrom:
        configMapKeyRef:
          name: basket-service-configmap
          key: pi_bb_tenant_jwk_uri

    # ── Feature flags and cache ──────────────────────────────────────────────
    - name: UNLEASH_ENVIRONMENT
      valueFrom:
        configMapKeyRef:
          name: basket-service-configmap
          key: unleashEnvironment
    - name: UNLEASH_URL
      valueFrom:
        configMapKeyRef:
          name: basket-service-configmap
          key: unleashUrl
    - name: UNLEASH_TOKEN
      valueFrom:
        secretKeyRef:
          name: unleash-enterprise-secrets
          key: token
    - name: CACHE_TYPE
      valueFrom:
        configMapKeyRef:
          name: basket-service-configmap
          key: cacheType
    - name: REDIS_ENDPOINT
      valueFrom:
        configMapKeyRef:
          name: basket-service-configmap
          key: redisEndpoint
    - name: CITY_TAX
      valueFrom:
        configMapKeyRef:
          name: basket-service-configmap
          key: cityTaxList

  dns:
    ndots: 3

  lifecycle:
    preStop:
      exec:
        command:
          - sh
          - -c
          - sleep 20
  terminationGracePeriodSeconds: 90

  livenessProbe:
    httpGet:
      path: /v1/baskets/actuator/health/liveness
      port: 9104
    initialDelaySeconds: 90
    periodSeconds: 30
    timeoutSeconds: 30
    successThreshold: 1
    failureThreshold: 6

  readinessProbe:
    httpGet:
      path: /v1/baskets/actuator/health/readiness
      port: 9104
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 30
    successThreshold: 1
    failureThreshold: 6

  # requests.memory tracks limits.memory because the heap is sized off the memory LIMIT
  # (-XX:MaxRAMPercentage above).
  resources:
    requests:
      cpu: 400m
      memory: 1700Mi
    limits:
      memory: 1700Mi

service:
  create: true
  name: basket-service
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 9104
      protocol: TCP
      name: port9104

autoscaling:
  create: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  scaleDownStabilizationSeconds: 300
  scaleUpStabilizationSeconds: 120

configMap:
  create: true
  data:
    ccui_tenant_audience: https://api.dev.whitbread.digital
    ccui_tenant_issuer: https://dev-whitbread-digital.eu.auth0.com/
    ccui_tenant_jwk_uri: https://dev-whitbread-digital.eu.auth0.com/.well-known/jwks.json
    ccui_tenant_namespace: https://ccui.opera.whitbread.digital
    pi_bb_tenant_audience: https://wbodetest.eu.auth0.com/api/v2/
    pi_bb_tenant_issuer: https://auth0.premierinn.digital/
    pi_bb_tenant_jwk_uri: https://auth0.premierinn.digital/.well-known/jwks.json
    pi_bb_tenant_namespace: https://premierinn.com
    marketing_url: http://marketing-service-opera
    unleashEnvironment: dev
    unleashUrl: https://whitbread.edge.getunleash.io/api
    cacheType: redis
    redisEndpoint: clustercfg.opera-dev.jynzd4.memorydb.eu-west-1.amazonaws.com:6379
    cityTaxList: CITYTAX, CITYEXP

# Two alternations: the collection lives under /v1/baskets and a handful of singular
# /v1/basket routes are still published.
istio:
  create: true
  auth: false
  gateway: opera-api
  regex:
    enabled: true
    pattern: ^\/v\d+\/baskets.*|^\/v\d+\/basket.*
