ephemeral: false

canary:
  create: false
# An HPA competing with a redeploy on every push is churn and cost, no benefit.
autoscaling:
  create: false
# Nothing should auto-bump the image; the pipeline sets the tag on every deploy.
imageAutomation:
  create: false
pdb:
  create: false

applicationName: hotel-reservation-entity-service
namespace: opera-be

image:
  repository: 327347623470.dkr.ecr.eu-west-1.amazonaws.com/whitbreaddigital/hotel-reservation-entity-service
  pullPolicy: Always

imagePullSecrets:
  - name: regcred

deployment:
  create: true
  replicaCount: 1
  lifecycle: null
  terminationGracePeriodSeconds: 15

  containerPorts:
    - containerPort: 9103
      protocol: TCP
      name: http

  containerEnvs:
    - name: spring_profiles_active
      value: opera-dev
    - name: JAVA_OPTS
      value: -XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=80 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    - name: PMS_ADAPTER_HOST
      value: pms-adapter-service
    - name: BASKET_SERVICE_HOST
      value: basket-service
    - name: OHIP_HOST
      value: ohip-adapter-service
    - name: RULES_AGENT_HOST
      value: rules-agent-entity-service
    - name: CONTENT_SERVICE_HOST
      value: content-entity-service
    - name: RESERVATION_LOCKING_SERVICE_HOST
      value: reservation-locking-service
    - name: CDH_ADAPTER_HOST
      value: cdh-adapter-service
    - name: MIGRATION_SERVICE_HOST
      value: hotel-migration-status-service
    - name: HOTEL_ENTITY_HOST
      value: hotel-entity-service
    - name: HOTEL_ACCOUNT_HOST
      value: hotel-account-service-opera
    - name: PROMO_SERVICE_HOST
      value: promo-service
    - name: BART_RESERVATION_HOST
      valueFrom:
        configMapKeyRef:
          key: bart_reservation_url
          name: hotel-reservation-entity-service-configmap
    - name: CCUI_TENANT_AUDIENCE
      valueFrom:
        configMapKeyRef:
          key: ccui_tenant_audience
          name: hotel-reservation-entity-service-configmap
    - name: CCUI_TENANT_NAMESPACE
      valueFrom:
        configMapKeyRef:
          key: ccui_tenant_namespace
          name: hotel-reservation-entity-service-configmap
    - name: CCUI_TENANT_ISSUER
      valueFrom:
        configMapKeyRef:
          key: ccui_tenant_issuer
          name: hotel-reservation-entity-service-configmap
    - name: CCUI_TENANT_JWK_URI
      valueFrom:
        configMapKeyRef:
          key: ccui_tenant_jwk_uri
          name: hotel-reservation-entity-service-configmap
    - name: PI_BB_TENANT_AUDIENCE
      valueFrom:
        configMapKeyRef:
          key: pi_bb_tenant_audience
          name: hotel-reservation-entity-service-configmap
    - name: PI_BB_TENANT_NAMESPACE
      valueFrom:
        configMapKeyRef:
          key: pi_bb_tenant_namespace
          name: hotel-reservation-entity-service-configmap
    - name: PI_BB_TENANT_ISSUER
      valueFrom:
        configMapKeyRef:
          key: pi_bb_tenant_issuer
          name: hotel-reservation-entity-service-configmap
    - name: PI_BB_TENANT_JWK_URI
      valueFrom:
        configMapKeyRef:
          key: pi_bb_tenant_jwk_uri
          name: hotel-reservation-entity-service-configmap
    - name: DISTR_TENANT_AUDIENCE
      valueFrom:
        configMapKeyRef:
          key: distr_tenant_audience
          name: hotel-reservation-entity-service-configmap
    - name: DISTR_TENANT_NAMESPACE
      valueFrom:
        configMapKeyRef:
          key: distr_tenant_namespace
          name: hotel-reservation-entity-service-configmap
    - name: DISTR_TENANT_ISSUER
      valueFrom:
        configMapKeyRef:
          key: distr_tenant_issuer
          name: hotel-reservation-entity-service-configmap
    - name: DISTR_TENANT_JWK_URI
      valueFrom:
        configMapKeyRef:
          key: distr_tenant_jwk_uri
          name: hotel-reservation-entity-service-configmap
    - name: COMPANY_ID
      valueFrom:
        configMapKeyRef:
          key: companyId
          name: hotel-reservation-entity-service-configmap
    - name: UNLEASH_ENVIRONMENT
      valueFrom:
        configMapKeyRef:
          key: unleashEnvironment
          name: hotel-reservation-entity-service-configmap
    - name: UNLEASH_URL
      valueFrom:
        configMapKeyRef:
          key: unleashUrl
          name: hotel-reservation-entity-service-configmap
    - name: UNLEASH_TOKEN
      valueFrom:
        secretKeyRef:
          key: token
          name: unleash-enterprise-secrets
    - name: PROMOTIONAL_PACKAGES
      value: ADBFPR,HSCKIF,FHSCOU2,FIFR24
    - name: CIOL_RATES
      valueFrom:
        configMapKeyRef:
          key: ciolRates
          name: hotel-reservation-entity-service-configmap
    - name: CIOL_HOTELS
      valueFrom:
        configMapKeyRef:
          key: ciolHotels
          name: hotel-reservation-entity-service-configmap
    - name: CIOL_COUNTRY_CODES
      valueFrom:
        configMapKeyRef:
          key: ciolCountryCodes
          name: hotel-reservation-entity-service-configmap
    - name: CIOL_MAX_ROOMS
      valueFrom:
        configMapKeyRef:
          key: ciolMaxRooms
          name: hotel-reservation-entity-service-configmap
    - name: DAYS_WITHIN_ARRIVAL
      valueFrom:
        configMapKeyRef:
          key: ciolWithinArrival
          name: hotel-reservation-entity-service-configmap
    - name: CIOL_EMAILS
      valueFrom:
        configMapKeyRef:
          key: ciolEmails
          name: hotel-reservation-entity-service-configmap
    - name: MDP_PACKAGES
      valueFrom:
        configMapKeyRef:
          key: mdpPackages
          name: hotel-reservation-entity-service-configmap
    - name: COOL_DAYS_UNTIL_DEPARTURE
      valueFrom:
        configMapKeyRef:
          key: coolDaysUntilDeparture
          name: hotel-reservation-entity-service-configmap
    - name: COOL_RSV_STATUS
      valueFrom:
        configMapKeyRef:
          key: coolRsvStatus
          name: hotel-reservation-entity-service-configmap
    - name: DE_REG_CARD_HOTELS
      valueFrom:
        configMapKeyRef:
          key: deRegCardHotels
          name: hotel-reservation-entity-service-configmap
    - name: DE_REG_CARD_ROOMS
      valueFrom:
        configMapKeyRef:
          key: deRegCardRooms
          name: hotel-reservation-entity-service-configmap
    - name: COOL_STARTING_HOUR
      valueFrom:
        configMapKeyRef:
          key: coolStartingHour
          name: hotel-reservation-entity-service-configmap
    - name: COOL_ENDING_HOUR
      valueFrom:
        configMapKeyRef:
          key: coolEndingHour
          name: hotel-reservation-entity-service-configmap
    - name: COOL_ENDING_HOUR_LCO
      valueFrom:
        configMapKeyRef:
          key: coolEndingHourLco
          name: hotel-reservation-entity-service-configmap
    - name: COOL_PILOT_HOTELS
      valueFrom:
        configMapKeyRef:
          key: coolPilotHotels
          name: hotel-reservation-entity-service-configmap
    - name: CACHE_TYPE
      valueFrom:
        configMapKeyRef:
          key: cacheType
          name: hotel-reservation-entity-service-configmap
    - name: REDIS_ENDPOINT
      valueFrom:
        configMapKeyRef:
          key: redisEndpoint
          name: hotel-reservation-entity-service-configmap
    - name: DK_MAX_ROOMS
      valueFrom:
        configMapKeyRef:
          key: dkMaxRooms
          name: hotel-reservation-entity-service-configmap
    - name: DK_HOTELS
      valueFrom:
        configMapKeyRef:
          key: dkHotels
          name: hotel-reservation-entity-service-configmap
    - name: DK_RESERVATION_STATUES
      valueFrom:
        configMapKeyRef:
          key: dkReservationStatues
          name: hotel-reservation-entity-service-configmap
    - name: PROVIDERS
      valueFrom:
        configMapKeyRef:
          key: thirdPartyBookingProvidersExcluded
          name: hotel-reservation-entity-service-configmap
    - name: DAYS_WITHIN_ARRIVAL_FOR_THIRD_PARTY
      valueFrom:
        configMapKeyRef:
          key: ciolWithinArrivalForThirdParty
          name: hotel-reservation-entity-service-configmap
    - name: UNIVERSAL_LOGIN_API_KEY
      valueFrom:
        secretKeyRef:
          name: universal-login-api-key
          key: universal-login-api-key
  readinessProbe:
    httpGet:
      path: /v1/reservations/actuator/health/readiness
      port: 9103
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 24

  livenessProbe:
    httpGet:
      path: /v1/reservations/actuator/health/liveness
      port: 9103
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 10
    successThreshold: 1
    failureThreshold: 6
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2000Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 9001
    runAsGroup: 9001
    fsGroup: 9001
    seccompProfile:
      type: RuntimeDefault
  dns:
    ndots: 3
service:
  create: true
  name: hotel-reservation-entity-service
  type: ClusterIP
  ports:
    - port: 9103
      targetPort: 9103
      protocol: TCP
      name: http

configMap:
  create: true
  data:
    cacheType: redis
    redisEndpoint: clustercfg.opera-dev.jynzd4.memorydb.eu-west-1.amazonaws.com:6379
    bart_reservation_url: https://api.uat.eks.whitbread.digital
    ccui_tenant_audience: https://api.dev.whitbread.digital
    ccui_tenant_issuer: https://dev-whitbread-digital.eu.auth0.com/
    ccui_tenant_jwk_uri: https://dev-whitbread-digital.eu.auth0.com/.well-known/jwks.json
    ccui_tenant_namespace: https://ccui.opera.whitbread.digital
    companyId: '12015058'
    distr_tenant_audience: https://api.distribution.nonprod.whitbread.digital
    distr_tenant_issuer: https://dist-whitbread-digital.eu.auth0.com/
    distr_tenant_jwk_uri: https://dist-whitbread-digital.eu.auth0.com/.well-known/jwks.json
    distr_tenant_namespace: https://premierinn.com
    opera-confirmation-config-bic-enabled: 'false'
    pi_bb_tenant_audience: https://wbodetest.eu.auth0.com/api/v2/
    pi_bb_tenant_issuer: https://auth0.premierinn.digital/
    pi_bb_tenant_jwk_uri: https://auth0.premierinn.digital/.well-known/jwks.json
    pi_bb_tenant_namespace: https://premierinn.com
    unleashEnvironment: dev
    unleashUrl: https://whitbread.edge.getunleash.io/api
    ciolRates: EMPLOYEE,HOUSEUSE,EMERALD1,GP,BS,TP,TM,NONFBKBB,NONFBOOK
    ciolHotels: EXCLUDE
    ciolCountryCodes: GB, DE
    ciolMaxRooms: "4"
    ciolWithinArrival: "2"
    ciolEmails: ''
    mdpPackages: MDBFST,MDBEVA,MD2DIN
    coolDaysUntilDeparture: "0"
    coolRsvStatus: InHouse
    deRegCardHotels: ''
    deRegCardRooms: "4"
    coolStartingHour: "5"
    coolEndingHour: "12"
    coolEndingHourLco: "14"
    coolPilotHotels: EXCLUDE
    dkHotels: LINMIL,FRAMTI,FRAWES,MANOLD,EDIPAR,LONTAL,LONBAI,LONKIN
    dkMaxRooms: '1'
    dkReservationStatues: Reserved, InHouse
    thirdPartyBookingProvidersExcluded: ''
    ciolWithinArrivalForThirdParty: "1"
istio:
  create: true
  auth: false
  gateways:
    - gateway: opera-api
      create: true
      regex:
        enabled: true
        pattern: ^\/v\d+\/reservations\/qrcode\/[^\/]+.*|^\/v\d+\/reservations\/universal-login\/link-leisure-customer.*
    - gateway: rest-api-private
      create: true
      regex:
        enabled: true
        pattern: ^\/v\d+\/reservations.*