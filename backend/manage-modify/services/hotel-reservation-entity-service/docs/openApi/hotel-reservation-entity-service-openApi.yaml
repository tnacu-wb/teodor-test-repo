components:
  schemas:
    AccompanyingGuestDetailsDto:
      type: object
      properties:
        additionalDetails:
          $ref: "#/components/schemas/StayingGuestAdditionalDetailsDto"
        emailAddress:
          type: string
        employeeAccountId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        title:
          type: string
    AccountCompanyItemsDto:
      type: object
      properties:
        charges:
          type: string
        companyId:
          type: string
        companyNumber:
          type: string
    AddNewRoomRequestDto:
      type: object
      properties:
        bookingChannel:
          $ref: "#/components/schemas/BookingChannelDto"
        leadGuest:
          $ref: "#/components/schemas/LeadGuestDto"
        ratePlanCode:
          type: string
        roomOccupancy:
          $ref: "#/components/schemas/RoomOccupancyDto"
        roomType:
          type: string
          minLength: 1
        specialRequests:
          type: array
          items:
            type: string
        tempBookingRef:
          type: string
          minLength: 1
        token:
          type: string
      required:
      - leadGuest
      - roomOccupancy
      - roomType
      - tempBookingRef
    AdditionalGuestInfoDto:
      type: object
      properties:
        acceptFutureMailing:
          type: boolean
        purposeOfStay:
          type: string
    AddressCcuiDto:
