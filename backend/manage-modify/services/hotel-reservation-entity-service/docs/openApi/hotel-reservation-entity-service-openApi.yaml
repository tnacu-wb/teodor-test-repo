        addressLine3:
          type: string
          maxLength: 35
          minLength: 0
          pattern: "^[ a-zA-Z0-9-ÖØ-ʒͰ-ͳͶ-ͷͻ-ͽvΑ-Ͽἀ-ῼЀ-ӿễấßÜÖÄüöä/'.,-]*$"
        addressLine4:
          type: string
          maxLength: 35
          minLength: 0
          pattern: "^[ a-zA-Z0-9-ÖØ-ʒͰ-ͳͶ-ͷͻ-ͽvΑ-Ͽἀ-ῼЀ-ӿễấßÜÖÄüöä/'.,-]*$"
