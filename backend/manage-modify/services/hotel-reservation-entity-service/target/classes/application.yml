server:
  port: 9103
  shutdown: graceful

swagger:
  api:
    version: "1.0.0"

info:
  build:
    groupId: "uk.co.whitbread"
    artifact: "hotel-reservation-entity-service"
    description: "Whitbread Hotel Reservation Entity Microservice"
    version: "1.0.0"
    git:
      originUrl: "@git.remote.origin.url@"
      branch: "@git.branch@"
      commit:
        id: "@git.commit.id@"
        time: "@git.commit.time@"
        message: "@git.commit.message.short@"

io:
  getunleash:
    app-name: "${spring.application.name}"
    instance-id: "1.0.0"
    environment: "${UNLEASH_ENVIRONMENT}"
    api-url: "${UNLEASH_URL}"
    api-token: "${UNLEASH_TOKEN}"
    send-metrics-connect-timeout: "${UNLEASH_SEND_METRICS_CONNECT_TIMEOUT:5s}"
    send-metrics-read-timeout: "${UNLEASH_SEND_METRICS_READ_TIMEOUT:5s}"
    send-metrics-interval: "${UNLEASH_SEND_METRICS_INTERVAL:60s}"

springdoc:
  show-actuator: true
  writer-with-order-by-keys: true

management:
  tracing:
    propagation:
      type: w3c
    baggage:
      correlation:
        fields:
          - x-amzn-trace-id
          - flow-code
          - wb-session-id
        enabled: true
      enabled: true
      remote-fields:
        - x-amzn-trace-id
        - flow-code
        - wb-session-id
  endpoints:
    web:
      base-path: /v1/reservations/actuator
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    distribution:
      percentiles:
        http.server.requests: [ 0.95, 0.99 ]
      percentiles-histogram:
        http.server.requests: true
      maximum-expected-value:
        http.server.requests: 2000ms

logging:
  level:
    io:
      getunleash: TRACE
    brave: WARN
    org.springframework.cache: info
  configuration:
    debug:
      enabled: true
      exclusions:
        - .*/actuator.*
  pattern:
    # Logging pattern containing traceId and spanId; no longer provided through Sleuth by default
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

spring:
  application:
    name: hotel-reservation-entity-service
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  lifecycle:
    timeout-per-shutdown-phase: 1m
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      key-prefix: "Hotel-Reservation-Entity-Service"
      use-key-prefix: true
  data:
    redis:
      ssl:
        enabled: true
      cluster:
        max-redirects: 5
        nodes: ${REDIS_ENDPOINT:localhost:6379}
      client-type: lettuce
      lettuce:
        cluster:
          refresh:
            period: 5m
            adaptive: true
      timeout: 10000
      connect-timeout: 10000

distribution:
  meals:
    11: PREMIER_BREAKFAST
    12: CONTINENTAL_BREAKFAST
    17: MEAL_DEAL
    18: BOXED_BREAKFAST
    15: CONTINENTAL_BUNDLE
    14: LIGHTER_BUNDLE
    20: BREAKFAST_ROLL_BUNDLE
  fixedRateAuthority: "SCOPE_RATE_PRICE::WRITE"

package:
  groups:
    MDP: ${MDP_PACKAGES:MDBFST,MDBEVA,MD2DIN}

config:
  whitbread-privilege:
    companyId: ${COMPANY_ID:12015058}
  service:
    ohip:
      host: http://${OHIP_HOST:localhost:9100}/ohip
      connectionTimeoutMillis: 5000
