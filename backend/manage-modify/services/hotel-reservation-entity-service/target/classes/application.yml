auth:
  tenants:
    - name: "CCUI Tenant"
      audience: ${CCUI_TENANT_AUDIENCE}
      namespace:  ${CCUI_TENANT_NAMESPACE}
      issuer:  ${CCUI_TENANT_ISSUER:}
      jwkUri:  ${CCUI_TENANT_JWK_URI:https://dev-whitbread-digital.eu.auth0.com/.well-known/jwks.json}
    - name: "PI BB Tenant"
      audience:  ${PI_BB_TENANT_AUDIENCE}
      namespace:  ${PI_BB_TENANT_NAMESPACE}
      issuer:  ${PI_BB_TENANT_ISSUER}
      jwkUri:  ${PI_BB_TENANT_JWK_URI:https://auth0.premierinn.digital/.well-known/jwks.json}
    - name: "Distribution Tenant"
      audience: ${DISTR_TENANT_AUDIENCE}
      namespace: ${DISTR_TENANT_NAMESPACE}
      issuer: ${DISTR_TENANT_ISSUER}
      jwkUri: ${DISTR_TENANT_JWK_URI:https://dist-whitbread-digital.eu.auth0.com/.well-known/jwks.json}

business-booker:
