opera:
  confirmation:
    config:
      bic:
        enabled: ${OPERA_CONFIRMATION_CONFIG_BIC_ENABLED:false}

promotion:
  promotionalPackages: ${PROMOTIONAL_PACKAGES:}

thirdpartybooking:
  subchannel: PI.MOBILE, BB.MOBILE, KIOSK.WEB
  providersExcluded: ${PROVIDERS:}
  daysWithinArrival: ${DAYS_WITHIN_ARRIVAL_FOR_THIRD_PARTY:1}

ciol:
  rules:
    maxRooms: ${CIOL_MAX_ROOMS:4}
    daysWithinArrival: ${DAYS_WITHIN_ARRIVAL:2}
    ciolRatesExcluded: ${CIOL_RATES}
    ciolHotels: ${CIOL_HOTELS:FRAMTI}
    ciolCountryCodes: ${CIOL_COUNTRY_CODES:GB}
    ciolEmails: ${CIOL_EMAILS:test@test.com}
    deRegCardRooms: ${DE_REG_CARD_ROOMS:1}
    deRegCardHotels: ${DE_REG_CARD_HOTELS:FRAWES}

cool:
  rules:
    daysUntilDeparture: ${COOL_DAYS_UNTIL_DEPARTURE:0}
    startingHour: ${COOL_STARTING_HOUR:5}
    endingHour: ${COOL_ENDING_HOUR:12}
    endingHourLco: ${COOL_ENDING_HOUR_LCO:14}
    coolReservationStatus: ${COOL_RSV_STATUS:InHouse}
    pilotHotels: ${COOL_PILOT_HOTELS:HEAPTI,FRAMTI,STUAIR,LONEUS}

qrcode:
  inputCharset: ISO-8859-1
  width: 394
  height: 394
  filename: qr.png

digitalkey:
  rules:
    maxRooms: ${DK_MAX_ROOMS:1}
    dkHotels: ${DK_HOTELS:LINMIL}
    reservationStatues: ${DK_RESERVATION_STATUES:Reserved,InHouse}

universal-login:
  api-key: ${UNIVERSAL_LOGIN_API_KEY:}

