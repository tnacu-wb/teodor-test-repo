          type: string
    AccountValueResponseDto:
      type: object
      properties:
        currencyCode:
          type: string
        value:
          type: number
    Address:
      type: object
      properties:
        companyName:
          type: string
        countryCode:
          type: string
          pattern: "^[A-Z]{1,3}$"
        countryCodeISO:
          type: string
        line1:
          type: string
        line2:
          type: string
        line3:
          type: string
        line4:
          type: string
        line5:
          type: string
        postCode:
          type: string
        type:
          type: string
          enum:
          - HOME
          - BUSINESS
      required:
      - countryCode
      - line1
    BBStaysRequest:
      type: object
      properties:
        business:
          type: boolean
        companyId:
          type: string
        continuationToken:
          type: string
        employeeId:
          type: string
        filterType:
          type: string
          enum:
          - NAME
          - ARRIVAL_DATE
          - CONFIRM_NUMBER
        filterValue:
          type: string
        includeCheckInBookings:
          type: boolean
        sortOrder:
          type: string
          enum:
          - DEFAULT
        typeOfBooking:
          type: string
          enum:
          - FUTURE
          - PAST
          - CANCELLED
          - CHECKED_IN
    BBStaysRequestV2:
      type: object
      properties:
        business:
          type: boolean
        companyId:
          type: string
        continuationToken:
          type: string
        employeeId:
          type: string
        filterType:
          type: string
          enum:
          - NAME
          - ARRIVAL_DATE
          - CONFIRM_NUMBER
        filterValue:
          type: string
        includeCheckInBookings:
          type: boolean
        pageIndex:
          type: integer
          format: int32
          minimum: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
        sortOrder:
          type: string
          enum:
          - DEFAULT
        typeOfBooking:
          type: string
          enum:
          - FUTURE
          - PAST
          - CANCELLED
          - CHECKED_IN
