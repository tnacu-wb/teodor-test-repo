          description: Internal Server Error
      summary: Actuator web endpoint 'health-path'
      tags:
      - Actuator
  /hotel-info-service/actuator/info:
    get:
      operationId: info
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
