  /hotels/{hotel-code}/key:
    get:
      operationId: getHotelKeyData
      parameters:
      - in: path
        name: hotel-code
        required: true
        schema:
          type: string
      - in: query
        name: request
        required: true
        schema:
          $ref: '#/components/schemas/HotelKeyDataRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelKeyData'
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Error Occurred '
        "405":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Method Not Allowed
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      tags:
      - Hotel Info Controller
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        details:
          type: array
          items:
            type: string
      required:
      - code
      - details
    Field:
      type: object
      properties:
        labelKey:
          type: string
        name:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        required:
          type: boolean
        type:
          type: string
    HotelInfoRequest:
      type: object
      properties:
        country:
          type: string
          enum:
          - GB
          - DE
        format:
          type: string
          enum:
          - SHORT
          - LONG
        language:
          type: string
          enum:
          - EN
          - DE
    HotelKeyData:
      type: object
      properties:
        brand:
          type: string
          enum:
          - HUB
          - PI
          - PID
          - ZIP
        code:
          type: string
        name:
          type: string
    HotelKeyDataRequest:
      type: object
      properties:
        language:
          type: string
          enum:
          - EN
          - DE
    Link:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
    MultiHotelInfoRequest:
      type: object
      properties:
        country:
          type: string
          enum:
          - GB
          - DE
        format:
          type: string
          enum:
          - SHORT
          - LONG
        hotelCodes:
          type: array
          items:
            type: string
          maxItems: 100
          minItems: 0
        language:
          type: string
          enum:
          - EN
          - DE
    MultiHotelInfoResponse:
      type: object
      properties:
        hotels:
          type: array
          items:
            type: string
        total:
          type: integer
          format: int32
    MultiHotelKeyDataRequest:
      type: object
      properties:
        hotelCodes:
          type: array
          items:
            type: string
          maxItems: 100
          minItems: 1
        language:
          type: string
          enum:
          - EN
          - DE
      required:
      - hotelCodes
    MultiHotelKeyDataResponse:
      type: object
      properties:
        keyData:
          type: array
          items:
            $ref: '#/components/schemas/HotelKeyData'
    Option:
      type: object
      properties:
        labelKey:
          type: string
        value:
          type: string
    Section:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        labelKey:
          type: string
        name:
          type: string
