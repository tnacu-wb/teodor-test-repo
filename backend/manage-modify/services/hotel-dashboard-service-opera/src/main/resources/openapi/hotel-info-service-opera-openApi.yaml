  /hotels:
    get:
      operationId: getHotelInfo
      parameters:
      - in: query
        name: request
        required: true
        schema:
          $ref: '#/components/schemas/MultiHotelInfoRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiHotelInfoResponse'
          description: Success
        "400":
          content:
            application/json:
              schema:
