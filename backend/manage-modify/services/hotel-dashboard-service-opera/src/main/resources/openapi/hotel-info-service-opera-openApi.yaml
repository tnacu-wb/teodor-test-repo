  /hotels/{hotel-code}:
    get:
      operationId: getHotelInfo_1
      parameters:
      - in: path
        name: hotel-code
        required: true
        schema:
          type: string
      - in: query
        name: request
        required: true
        schema:
          $ref: '#/components/schemas/HotelInfoRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
