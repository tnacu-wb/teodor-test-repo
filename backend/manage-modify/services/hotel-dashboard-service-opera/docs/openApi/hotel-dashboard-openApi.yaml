openapi: 3.1.0
info:
  description: <p>App Dashboard - Should only display bookings within x number of
    days from arrivalDate. **Default value of 14 days**.</p>
  title: App Dashboard Documentation
  version: 1.0.0
servers:
- description: Generated server url
  url: http://localhost:9056
tags:
- description: Monitor and interact
  externalDocs:
    description: Spring Boot Actuator Web API Documentation
    url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
  name: Actuator
paths:
  /dashboard:
    get:
      description: Generates a dashboard to be used by the mobile apps. This version
        supports logged users and it returns frequent bookings.
      operationId: retrieveDashboard
      parameters:
      - in: header
        name: Authorization
        required: false
        schema:
          type: string
      - in: header
        name: session-id
        required: false
        schema:
          type: string
      - in: header
        name: Origin
        required: false
        schema:
          type: string
      - in: query
        name: hasRecentSearches
        required: false
        schema:
          type: boolean
          default: true
      - in: query
        name: customer-id
        required: false
        schema:
          type: string
      - in: query
        name: request
        required: true
        schema:
          $ref: "#/components/schemas/RetrieveDashboardRequestDto"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardElement"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 'Error Occurred '
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      tags:
      - dashboard-controller
  /hotel-dashboard-service/actuator:
    get:
      operationId: links
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator root web endpoint
      tags:
      - Actuator
  /hotel-dashboard-service/actuator/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'health'
      tags:
      - Actuator
  /hotel-dashboard-service/actuator/info:
    get:
      operationId: info
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'info'
      tags:
      - Actuator
  /hotel-dashboard-service/actuator/metrics:
    get:
      operationId: listNames
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'metrics'
      tags:
      - Actuator
  /hotel-dashboard-service/actuator/metrics/{requiredMetricName}:
    get:
      operationId: metric
      parameters:
      - in: path
        name: requiredMetricName
        required: true
        schema:
          type: string
      - in: query
        name: tag
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "404":
          description: Not Found
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Actuator web endpoint 'metrics-requiredMetricName'
      tags:
      - Actuator
components:
  schemas:
    Action:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
          enum:
          - CIOL
          - UPSELLS
          - DIRECTIONS
          - BOOKING_DETAILS
    Address:
      type: object
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
        addressLine3:
          type: string
        addressLine4:
          type: string
        addressLine5:
          type: string
        country:
          type: string
        postCode:
          type: string
    Content:
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
        address:
          $ref: "#/components/schemas/Address"
        arrivalDate:
          type: string
          format: date
          example: 2022-01-01
        checkedIn:
          type: boolean
        confirmationNumber:
          type: string
        departureDate:
          type: string
          format: date
          example: 2022-01-01
        frequentBookings:
          type: array
          items:
            $ref: "#/components/schemas/FrequentBooking"
        guests:
          type: integer
          format: int32
        hotelBrand:
          type: string
        hotelCode:
          type: string
        hotelImage:
          type: string
        hotelName:
          type: string
        map:
          $ref: "#/components/schemas/Map"
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/Room"
    DashboardElement:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/Content"
        type:
          type: string
          enum:
          - UPCOMING_BOOKING
          - FREQUENT_BOOKINGS
          - RECENT_SEARCHES
          - PAST_SEARCHES
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "001"
          minLength: 1
        details:
          type: array
          example:
          - Error message
          items:
            type: string
      required:
      - code
      - details
    FrequentBooking:
      type: object
      properties:
        hotelBrand:
          type: string
        hotelCode:
          type: string
        hotelImage:
          type: string
        hotelName:
          type: string
    Link:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
    Map:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    RetrieveDashboardRequestDto:
      type: object
      properties:
        arrivalDate:
          type: string
          format: date
          example: 2022-01-01
        business:
          type: boolean
        companyId:
          type: string
        confirmationNumber:
          type: string
        employeeId:
          type: string
        language:
          type: string
        surname:
          type: string
    Room:
      type: object
      properties:
        type:
          type: string
