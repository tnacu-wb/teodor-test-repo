        addressLine5:
          type: string
        companyName:
          type: string
        countryCode:
          type: string
        postCode:
          type: string
        type:
          type: string
    AnswersDto:
      type: object
      properties:
        answerValues:
          type: array
          items:
            type: string
        type:
          type: string
    BillingAddressDto:
      type: object
      properties:
