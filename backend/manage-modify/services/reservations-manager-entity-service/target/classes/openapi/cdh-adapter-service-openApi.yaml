openapi: 3.0.1
info:
  description: <p>CDH Api Documentation</p>
  title: CDH API Documentation
  version: 2.1.0
servers:
  - description: Generated server url
    url: http://localhost:9119
tags:
  - description: Monitor and interact
    externalDocs:
      description: Spring Boot Actuator Web API Documentation
      url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
    name: Actuator
paths:
  /v1/cdh/account/companies:
    post:
      operationId: getCompanies
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySearchCriteriaDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySearchResponseDto"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Search companies from CDH Account Services API V2
      tags:
        - company-controller
  /v1/cdh/account/employee:
    get:
      operationId: getEmployee
      parameters:
        - in: query
          name: getEmployeeRequestDto
          required: true
          schema:
            $ref: "#/components/schemas/GetEmployeeRequestDto"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEmployeeResponseDto"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401.":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Fetches the employee details from CDH
      tags:
        - employee-controller
  /v1/cdh/account/employees:
    get:
      operationId: getEmployees
      parameters:
        - in: query
          name: employeeSearchCriteriaDto
          required: true
          schema:
            $ref: "#/components/schemas/EmployeeSearchCriteriaDto"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEmployeesResponseDto"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401.":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Fetches the employees from CDH
      tags:
        - employee-controller
  /v1/cdh/account/employees/company/{companyAccountId}:
    get:
      operationId: getCompanyEmployees
      parameters:
        - in: path
          name: companyAccountId
          required: true
          schema:
            type: string
        - in: query
          name: accessedBy
          required: true
          schema:
            type: string
        - in: query
          name: pageSize
          required: true
          schema:
            type: integer
            format: int32
        - in: query
          name: pageToken
          required: false
          schema:
            type: string
        - in: query
          name: accessContext
          required: false
          schema:
            type: string
        - in: query
          name: awaitingApproval
          required: false
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEmployeesResponseDto"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401.":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Fetches company employees based on given filters from CDH
      tags:
        - employee-controller
  /v1/cdh/actuator:
    get:
      operationId: links
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
          description: OK
      summary: Actuator root web endpoint
      tags:
        - Actuator
  /v1/cdh/actuator/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
      summary: Actuator web endpoint 'health'
      tags:
        - Actuator
  /v1/cdh/actuator/health/**:
    get:
      operationId: health-path
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
      summary: Actuator web endpoint 'health-path'
      tags:
        - Actuator
  /v1/cdh/actuator/info:
    get:
      operationId: info
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
      summary: Actuator web endpoint 'info'
      tags:
        - Actuator
  /v1/cdh/actuator/metrics:
    get:
      operationId: metrics
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
      summary: Actuator web endpoint 'metrics'
      tags:
        - Actuator
  /v1/cdh/actuator/metrics/{requiredMetricName}:
    get:
      operationId: metrics-requiredMetricName
      parameters:
        - in: path
          name: requiredMetricName
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
      summary: Actuator web endpoint 'metrics-requiredMetricName'
      tags:
        - Actuator
  /v1/cdh/actuator/prometheus:
    get:
      operationId: prometheus
      responses:
        "200":
          content:
            application/openmetrics-text;version=1.0.0;charset=utf-8:
              schema:
                type: object
            application/vnd.google.protobuf;proto=io.prometheus.client.MetricFamily;encoding=delimited:
              schema:
                type: object
            text/plain;version=0.0.4;charset=utf-8:
              schema:
                type: object
          description: OK
      summary: Actuator web endpoint 'prometheus'
      tags:
        - Actuator
  /v1/cdh/companies/{companyId}/reports/emergency-report:
    get:
      operationId: getEmergencyReport
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: string
        - example: 2023-10-05
          in: query
          name: fromDate
          required: true
          schema:
            type: string
        - example: 2023-10-05
          in: query
          name: toDate
          required: true
          schema:
            type: string
        - in: query
          name: accessContext
          required: true
          schema:
            type: string
        - in: query
          name: accessedBy
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyReportResponseDto"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Emergency Report from CDH Booking Services API V2
      tags:
        - report-controller
  /v1/cdh/companies/{companyId}/reports/management-information:
    get:
      operationId: getManagementInformation
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: string
        - example: 2023-10-05
          in: query
          name: fromDate
          required: true
          schema:
            type: string
        - example: 2023-10-05
          in: query
          name: toDate
          required: true
          schema:
            type: string
        - in: query
          name: accessContext
          required: true
          schema:
            type: string
        - in: query
          name: accessedBy
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementInformationResponseDto"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Management Information from CDH Booking Services API V2
      tags:
        - report-controller
  /v1/cdh/reservation/invoices:
    get:
      operationId: getBookingInvoices
      parameters:
        - in: query
          name: bookingReference
          required: true
          schema:
            type: string
        - in: query
          name: accessContext
          required: true
          schema:
            type: string
        - in: query
          name: accessedBy
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationInvoicesResponseDto"
          description: OK
      tags:
        - cdh-reservation-search-controller
  /v1/cdh/reservation/search:
    post:
      operationId: getReservationSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CdhReservationSearchCriteriaDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CdhReservationSearchDto"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Search bookings from CDH Booking Services API V2
      tags:
        - cdh-reservation-search-controller
  /v1/cdh/reservation/{reservationId}:
    get:
      operationId: getReservationById
      parameters:
        - in: path
          name: reservationId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CdhReservationSearchDto"
          description: OK
      tags:
        - cdh-reservation-search-controller
components:
