{{/*
  Secret provisioning via CyberArk + ExternalSecret.

  The ExternalSecret (external-secret.yaml) syncs OHIP credentials from
  CyberArk into a K8s Secret named: {{ .Values.ohip.secretName }}

  APP_KEY, CLIENT_ID and CLIENT_SECRET are stored as secrets (the app key is an
  API credential sent as x-app-key). The remaining OHIP config (base URL, scope,
  enterprise ID) is non-sensitive and set directly in the Helm values files.

  CyberArk accounts to create (per environment):

    Safe: {{ .Values.cyberark.safe }}
    Platform: Unix via SSH

    | Account Name             | Store value in |
    |--------------------------|----------------|
    | uat-ohip-app-key         | address field  |
    | uat-ohip-client-id       | address field  |
    | uat-ohip-client-secret   | address field  |
    | sit-ohip-app-key         | address field  |
    | sit-ohip-client-id       | address field  |
    | sit-ohip-client-secret   | address field  |
    | perf-ohip-app-key        | address field  |
    | perf-ohip-client-id      | address field  |
    | perf-ohip-client-secret  | address field  |

  For local dev/testing without CyberArk, create the secret manually:

    kubectl create secret generic opera-ohip-app-credentials \
      --namespace=opera-ohip-app \
      --from-literal=UAT_OHIP_APP_KEY=... \
      --from-literal=UAT_OHIP_CLIENT_ID=... \
      --from-literal=UAT_OHIP_CLIENT_SECRET=...
*/}}
