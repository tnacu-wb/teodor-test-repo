{{- if and .Values.cyberark.enabled .Values.cyberark.safe }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.ohip.secretName }}
  labels:
    {{- include "opera-ohip-app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: conjur-digital-app-secrets
    kind: SecretStore
  target:
    name: {{ .Values.ohip.secretName }}
    creationPolicy: Owner
  data:
    # UAT credentials (app key + OAuth client)
    - secretKey: UAT_OHIP_APP_KEY
      remoteRef:
        key: data/vault/{{ .Values.cyberark.safe }}/uat-ohip-app-key/address
    - secretKey: UAT_OHIP_CLIENT_ID
      remoteRef:
        key: data/vault/{{ .Values.cyberark.safe }}/uat-ohip-client-id/address
    - secretKey: UAT_OHIP_CLIENT_SECRET
      remoteRef:
        key: data/vault/{{ .Values.cyberark.safe }}/uat-ohip-client-secret/address
    # SIT credentials (app key + OAuth client)
    - secretKey: SIT_OHIP_APP_KEY
      remoteRef:
        key: data/vault/{{ .Values.cyberark.safe }}/sit-ohip-app-key/address
    - secretKey: SIT_OHIP_CLIENT_ID
      remoteRef:
        key: data/vault/{{ .Values.cyberark.safe }}/sit-ohip-client-id/address
    - secretKey: SIT_OHIP_CLIENT_SECRET
      remoteRef:
        key: data/vault/{{ .Values.cyberark.safe }}/sit-ohip-client-secret/address
    # PERF credentials (app key + OAuth client)
    - secretKey: PERF_OHIP_APP_KEY
      remoteRef:
        key: data/vault/{{ .Values.cyberark.safe }}/perf-ohip-app-key/address
    - secretKey: PERF_OHIP_CLIENT_ID
      remoteRef:
        key: data/vault/{{ .Values.cyberark.safe }}/perf-ohip-client-id/address
    - secretKey: PERF_OHIP_CLIENT_SECRET
      remoteRef:
        key: data/vault/{{ .Values.cyberark.safe }}/perf-ohip-client-secret/address
{{- end }}
