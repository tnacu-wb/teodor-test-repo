# PERF (performance/load-testing) environment overrides
# Layered: values.yaml → nonprod.yaml → perf.yaml
#
# PERF uses Serverless Aurora (provisioned by Infra). Shared Aurora connection
# settings (credentials via ESO `existingSecret`, pools, TLS) live in
# nonprod.yaml; this file sets only the PERF Aurora writer endpoint plus
# PERF capacity overrides.
#
# PERF exists to exercise Temporal under sustained load, so it is sized with more
# headroom than the functional non-prod envs. Per-pod connection pools stay small
# (inherited from nonprod.yaml) to respect the Aurora Serverless per-ACU
# connection ceiling; throughput is scaled out via server replicas rather than
# by widening each pod's pool.

temporal:
  server:
    # `replicaCount` is the EFFECTIVE scaling control for PERF. The temporal
    # 1.6.0 chart has no HorizontalPodAutoscaler template, so the `autoscaling`
    # block below is inert (it creates no HPA) — PERF runs a fixed 3 replicas,
    # NOT an autoscaled 3→10. To raise capacity for a load test, bump
    # replicaCount here. The autoscaling block is retained only for parity with
    # the other env files and for future use if a chart version starts honoring
    # it; adjust replicaCount to change actual capacity.
    replicaCount: 3

    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

    config:
      persistence:
        datastores:
          # Aurora Serverless writer endpoint (eu-west-1), anchored once and
          # reused for both datastores. All other connection settings
          # (credentials, pools, TLS) are inherited from nonprod.yaml.
          default:
            sql:
              connectAddr: &auroraAddr "temporal-perf.cluster-cfp3ckubgukh.eu-west-1.rds.amazonaws.com:5432"
          visibility:
            sql:
              connectAddr: *auroraAddr

# Temporal Web UI — ExternalDNS creates DNS record automatically
temporalUI:
  gateway:
    enabled: true
    host: "temporal-ui.perf.opera.whitbread.digital"
