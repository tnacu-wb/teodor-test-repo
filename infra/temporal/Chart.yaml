apiVersion: v2
name: whitbread-temporal
description: Temporal workflow orchestration platform for Whitbread Digital
type: application
version: 1.0.0
appVersion: "1.31.2"

# Declare external charts as dependencies
dependencies:
  # Temporal - official chart from temporalio
  - name: temporal
    version: "1.6.0"
    repository: "https://go.temporal.io/helm-charts"
    condition: temporal.enabled

  # NOTE: The Bitnami PostgreSQL subchart has been removed. Every environment
  # (all non-prod + production) now uses external Serverless Aurora as the
  # Temporal datastore, so there is no in-cluster database dependency.
