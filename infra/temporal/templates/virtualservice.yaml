{{- if .Values.temporalUI.gateway.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: temporal-web-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: temporal
spec:
  gateways:
    - {{ .Release.Name }}-ui
  hosts:
    - {{ .Values.temporalUI.gateway.host | quote }}
  http:
    - match:
        - uri:
            regex: .*
      route:
        - destination:
            host: {{ .Release.Name }}-web.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8080
          weight: 100
{{- end }}
