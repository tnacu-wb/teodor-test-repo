{{- if and .Values.deployment (ne (.Values.deployment).create false) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.applicationName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.applicationName }}
    whitbread.services/name: {{ .Values.applicationName }}
    helm.sh/chart: {{ .Chart.Version }}
    app.kubernetes.io/version: {{ .Values.image.tag | trunc 63 }}
spec:
  {{- if ne (.Values.autoscaling).create true }}
  replicas: {{ .Values.deployment.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.applicationName }}
      whitbread.services/name: {{ .Values.applicationName }}
  template:
    metadata:
      labels:
        app: {{ .Values.applicationName }}
        whitbread.services/name: {{ .Values.applicationName }}
        helm.sh/chart: {{ .Chart.Version }}
        checksum/values: {{ tpl (toYaml .Values) . | sha256sum | trunc 63 }}
        app.kubernetes.io/version: {{ .Values.image.tag | trunc 63 }}
        {{- if .Values.releaseStage }}
        dynatrace-release-stage: {{ .Values.releaseStage }}
        {{- end }}
        app.kubernetes.io/part-of: {{ .Values.namespace }}
      annotations:
        {{- if and .Values.prometheusSpring (ne (.Values.prometheusSpring).create false) }}
        spring.prometheus/scrape: 'true'
        spring.prometheus/metric_path: {{ .Values.prometheusSpring.path }}
        spring.prometheus/scrape_port: '{{ index (index .Values.service.ports 0) "targetPort" }}'
        {{- end }}
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "{{ .Values.deployment.dns.ndots }}"
      {{- if (.Values.deployment).terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.deployment.securityContext }}
      securityContext: {{- toYaml .Values.deployment.securityContext | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Values.applicationName }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env: {{- tpl (toYaml .Values.deployment.containerEnvs) . | trim | nindent 10 }}
        ports: {{- toYaml .Values.deployment.containerPorts | trim | nindent 10 }}
        livenessProbe: {{- toYaml .Values.deployment.livenessProbe | trim | nindent 10 }}
        readinessProbe: {{- toYaml .Values.deployment.readinessProbe | trim | nindent 10 }}
        {{- if (.Values.deployment).lifecycle }}
        lifecycle: {{- toYaml .Values.deployment.lifecycle | nindent 10 }}
        {{- end }}
        resources: {{- toYaml .Values.deployment.resources | nindent 10 }}
        {{- if (.Values.deployment).containerSecurityContext }}
        securityContext: {{- toYaml .Values.deployment.containerSecurityContext | nindent 10 }}
        {{- end }}
        {{- with .Values.deployment.containerEnvFrom }}
        envFrom: {{- toYaml . | nindent 10 }}
        {{- end}}
      serviceAccountName: {{ .Values.deployment.serviceAccount | default "default" }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.deployment.tolerations }}
      tolerations:
        {{- toYaml .Values.deployment.tolerations | nindent 10 }}
      {{- end }}
      {{- if .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.deployment.nodeSelector | nindent 10 }}
      {{- end }}
{{- end -}}
