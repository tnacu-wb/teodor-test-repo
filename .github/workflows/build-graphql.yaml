name: Build GraphQL

on:
  workflow_call:
    outputs:
      apollo-version:
        description: Version from graphql/package.json.
        value: ${{ jobs.validate-and-build.outputs.apollo-version }}
      artifact-name:
        description: Apollo build artifact consumed by the image job.
        value: ${{ jobs.validate-and-build.outputs.artifact-name }}
    secrets:
      OPERA_APOLLO_APIKEY:
        required: true

jobs:
  validate-and-build:
    name: Graph schema check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      apollo-version: ${{ steps.apollo-version.outputs.apollo-version }}
      artifact-name: opera-apollo-subgraphs
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Use LTS Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.0'

      - name: Install Rover CLI
        run: npm install --global @apollo/rover

      - name: Resolve target graph
        id: deployment-env
        env:
          REF: ${{ github.ref }}
        run: bash .github/workflows/scripts/graphql/resolve-graphql-environment.sh

      - name: Schema compatibility check
        env:
          APOLLO_KEY: ${{ secrets.OPERA_APOLLO_APIKEY }}
          TARGET_ENVIRONMENT: ${{ steps.deployment-env.outputs.environment }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/workflows/scripts/graphql/check-graphql-schemas.sh

      - name: Install dependencies
        working-directory: graphql
        run: npm install

      - name: Build project
        working-directory: graphql
        run: npm run build

      - name: Get Apollo version
        id: apollo-version
        working-directory: graphql
        run: bash "$GITHUB_WORKSPACE/.github/workflows/scripts/graphql/get-graphql-version.sh"

      - name: Package Apollo artifact
        env:
          GRAPHQL_DIR: graphql
          ARTIFACT_PATH: ${{ runner.temp }}/opera-apollo-subgraphs.tar
        run: bash .github/workflows/scripts/graphql/package-graphql-artifact.sh

      - name: Save Apollo artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opera-apollo-subgraphs
          path: ${{ runner.temp }}/opera-apollo-subgraphs.tar
          retention-days: 1
          if-no-files-found: error
