name: Kiro Issue Closure Cleanup FE

on:
  workflow_call:
    inputs:
      issue_number:
        description: "GitHub issue number that was closed"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  find-and-close-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Find and close PR linked to issue
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const issueNumber = Number('${{ inputs.issue_number }}');
            
            if (!issueNumber) {
              core.warning('No issue number provided; skipping PR closure.');
              return;
            }

            core.info(`Looking for PR linked to issue #${issueNumber}...`);

            // Strategy 1: Search for PRs that have "Closes #ISSUE_NUMBER" in their body.
            // This is the most common pattern used by the Kiro resolver.
            let prNumber = null;
            const searchQuery = `repo:${context.repo.owner}/${context.repo.repo} type:pr "Closes #${issueNumber}"`;
            
            try {
              const searchResult = await github.rest.search.issuesAndPullRequests({
                q: searchQuery,
              });
              
              if (searchResult.data.items && searchResult.data.items.length > 0) {
                prNumber = searchResult.data.items[0].number;
                core.info(`Found PR #${prNumber} via "Closes #${issueNumber}" search.`);
              }
            } catch (searchError) {
              core.warning(`PR search failed: ${searchError.message}`);
            }

            // Strategy 2: If not found, check the issue's timeline for a linked PR.
            if (!prNumber) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });

                // If the issue has a pull_request field, it's a PR (unlikely for this use case).
                // Otherwise, look at the issue's pull_request links in the API response.
                // GitHub doesn't directly expose linked PRs in the issue object, but we can
                // use the search as the primary method.
                
                core.info(`Issue #${issueNumber} found: ${issue.data.title}`);
              } catch (issueError) {
                core.warning(`Could not retrieve issue #${issueNumber}: ${issueError.message}`);
              }
            }

            if (!prNumber) {
              core.warning(`No open PR found linked to issue #${issueNumber}. The PR may already be closed or there is no linked PR.`);
              return;
            }

            // Found a PR; now close it using the App token so the closure event fires.
            core.info(`Closing PR #${prNumber}...`);
            try {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                state: 'closed',
              });
              core.info(`✅ PR #${prNumber} closed successfully. This will trigger the pull_request: [closed] event.`);
            } catch (closeError) {
              core.setFailed(`Failed to close PR #${prNumber}: ${closeError.message}`);
            }
