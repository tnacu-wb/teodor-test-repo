name: Frontend Ephemeral Comment Trigger
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # Serialise per PR so two quick comments don't race on the same releases.
  group: fe-ephemeral-comment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Validate trigger phrase and permission
    # Cheap pre-filter before spinning a runner up: the comment must be on a PR and
    # its body must at least contain the phrase. GitHub Actions expressions have no
    # trim() function, so the authoritative, exact/trimmed, case-sensitive match is
    # done in JS inside the `check` step below.
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'Ephemeral UP')
    runs-on: ubuntu-slim
    outputs:
      authorized:       ${{ steps.check.outputs.authorized }}
      phrase-match:     ${{ steps.check.outputs.phrase-match }}
      pr-number:        ${{ steps.pr.outputs.number }}
      head-ref:         ${{ steps.pr.outputs.head-ref }}
      base-ref:         ${{ steps.pr.outputs.base-ref }}
      checkout-ref:     ${{ steps.pr.outputs.checkout-ref }}
      base-out-of-sync: ${{ steps.pr.outputs.out-of-sync }}
      mergeable-state:  ${{ steps.pr.outputs.mergeable-state }}
    steps:
      - name: Check trigger phrase and commenter permission
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            // Authoritative phrase match: exact, trimmed, case-sensitive.
            // The `if:` pre-filter only guarantees the phrase is a substring, so a body
            // like 'Please Ephemeral UP now' or 'Ephemeral UPGRADE' still reaches here and
            // must be rejected; ' Ephemeral UP ' (surrounding whitespace) must be accepted.
            const body = context.payload.comment.body ?? '';
            if (body.trim() !== 'Ephemeral UP') {
              // Phrase did not match exactly (e.g. 'Please Ephemeral UP now',
              // 'Ephemeral UPGRADE'). This is a "not triggered" case, distinct from an
              // unauthorised commenter, so the misleading "lacks write access" reaction
              // must not fire — the `ignored` job keys off phrase-match being 'true'.
              core.setOutput('phrase-match', 'false');
              core.setOutput('authorized', 'false');
              return;
            }
            core.setOutput('phrase-match', 'true');
            // A commenter who is not a repo collaborator makes this endpoint return 404.
            // That is a normal "not authorised" outcome, not an error: swallow it and set
            // authorized=false so the `ignored` job still posts the `confused` reaction.
            // Reserve a thrown failure for genuinely unexpected API errors.
            let ok = false;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.payload.comment.user.login,
              });
              ok = ['write', 'maintain', 'admin'].includes(data.permission);
            } catch (e) {
              if (e.status === 404) {
                core.info(`Commenter '${context.payload.comment.user.login}' is not a collaborator; treating as unauthorised.`);
              } else {
                throw e;
              }
            }
            core.setOutput('authorized', ok ? 'true' : 'false');
      - name: Resolve PR head/base and mergeability
        id: pr
        if: steps.check.outputs.authorized == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const number = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number,
            });
            const supported = ['main', 'test-deployment'].includes(pr.base.ref);
            const open = pr.state === 'open';
            if (!supported || !open) { core.setFailed('PR is not open against a supported base'); return; }
            // Always check out the immutable pr.head.sha, never the mutable
            // refs/pull/<n>/merge ref. Pinning the exact reviewed/authorised commit is
            // what gets built, closing the time-of-check/time-of-use (TOCTOU) gap flagged
            // by CodeQL (#541-#545): the merge ref can be recomputed by GitHub after the
            // authorisation check, so building it risks deploying a different commit than
            // the one that was reviewed.
            // Trade-off: the comment path deploys the PR head as-is (not merged with
            // base). `out-of-sync` is still derived from mergeability and stays purely
            // informational — when true, the notify-out-of-sync job warns the user.
            // GitHub returns mergeable=true (clean), false (real conflicts), or null
            // (mergeability not yet computed). Only `false` is a genuine conflict; null is
            // simply unknown and must not be reported as a conflict. Both non-clean states
            // still flag out-of-sync (informational only — the head is deployed as-is).
            const mergeableState =
              pr.mergeable === true ? 'clean' : pr.mergeable === false ? 'conflicts' : 'unknown';
            core.setOutput('number', String(number));
            core.setOutput('head-ref', pr.head.ref);
            core.setOutput('base-ref', pr.base.ref);
            core.setOutput('checkout-ref', pr.head.sha);
            core.setOutput('out-of-sync', mergeableState === 'clean' ? 'false' : 'true');
            core.setOutput('mergeable-state', mergeableState);
  acknowledge:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-slim
    steps:
      - name: React to the trigger comment
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: context.payload.comment.id, content: 'rocket',
            });

  ignored:
    needs: authorize
    # Only fire on a genuine permission failure: the phrase matched exactly but the
    # commenter lacks write access. A mere phrase mismatch is "not triggered", not
    # "unauthorised", and must not post the misleading reaction.
    if: needs.authorize.outputs.phrase-match == 'true' && needs.authorize.outputs.authorized == 'false'
    runs-on: ubuntu-slim
    steps:
      - name: Note that the request was ignored
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: context.payload.comment.id, content: 'confused',
            });
            core.warning('Ephemeral deploy request ignored: commenter lacks write access.');

  notify-out-of-sync:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true' && needs.authorize.outputs.base-out-of-sync == 'true'
    runs-on: ubuntu-slim
    steps:
      - name: Warn that the branch is not in sync with base
        uses: actions/github-script@v9
        env:
          BASE_REF: ${{ needs.authorize.outputs.base-ref }}
          MERGEABLE_STATE: ${{ needs.authorize.outputs.mergeable-state }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
        with:
          script: |
            const base = process.env.BASE_REF;
            // Only assert conflicts when the API explicitly said mergeable=false; an
            // 'unknown' state means GitHub had not finished computing mergeability.
            const body =
              process.env.MERGEABLE_STATE === 'conflicts'
                ? `This branch has merge conflicts with \`${base}\`. Deploying the branch head as-is — please update the branch.`
                : `This branch could not be confirmed in sync with \`${base}\` (mergeability not yet determined). Deploying the branch head as-is.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });

  deploy:
    # Same branch-name (head-ref) as the POC path so release/environment naming is
    # identical: a comment on a POC-suffixed branch upgrades the same release instead
    # of creating a duplicate environment.
    needs: [authorize, acknowledge]
    # Acknowledgement (the rocket reaction) is feedback, not a deployment prerequisite:
    # always() keeps the deploy running even if the reaction API failed, while the
    # authorized guard still gates on a successful authorization.
    if: always() && needs.authorize.outputs.authorized == 'true'
    # The called workflow's jobs request id-token/pull-requests/issues write. A reusable
    # workflow's token can only be equal to or more restrictive than the caller job's, so
    # these must be granted here or the run fails at startup (permission escalation).
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: write
      deployments: write
    uses: ./.github/workflows/ci-fe-ephemeral-deploy.yaml
    with:
      pr-number: ${{ needs.authorize.outputs.pr-number }}
      branch-name: ${{ needs.authorize.outputs.head-ref }}
      checkout-ref: ${{ needs.authorize.outputs.checkout-ref }}
      base-out-of-sync: ${{ needs.authorize.outputs.base-out-of-sync == 'true' }}
      trigger-source: comment
    secrets: inherit

  report-failure:
    # Closes the feedback loop for an authorised request: if the reusable deploy fails
    # (build, image publish, or Helm), the commenter otherwise sees only the rocket
    # reaction and has to hunt through the Actions tab. always() lets this run after a
    # deploy failure; the guard keeps it to genuinely authorised, genuinely failed runs.
    needs: [authorize, deploy]
    if: always() && needs.authorize.outputs.authorized == 'true' && needs.deploy.result == 'failure'
    runs-on: ubuntu-slim
    permissions:
      # Commenting on a PR via the issues API requires the pull-requests scope.
      issues: write
      pull-requests: write
    steps:
      - name: Comment deploy failure on PR
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.info('No valid PR number resolved; skipping failure comment.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `❌ The ephemeral deployment triggered by \`Ephemeral UP\` failed. See the run for details: ${process.env.RUN_URL}`,
            });
