name: QA Playwright PI

on:
  workflow_dispatch:
    inputs:
      tests_filter:
        description: 'Test title/tag regex (e.g. @smoke, @regression, or 380779). Leave blank for all PI tests.'
        required: false
        type: string
        default: ''
      environment:
        description: 'Target test environment'
        required: true
        type: choice
        options:
          - uat
          - dit
        default: uat
      locale:
        description: 'Website locale'
        required: true
        type: choice
        options:
          - gb-en
          - de-de
        default: gb-en

permissions:
  contents: read

jobs:
  playwright:
    uses: ./.github/workflows/qa-playwright.yaml
    with:
      app: pi
      environment: ${{ inputs.environment }}
      locale: ${{ inputs.locale }}
      tests_filter: ${{ inputs.tests_filter }}
    secrets: inherit