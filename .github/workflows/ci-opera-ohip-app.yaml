name: CI opera-ohip-app

# Dedicated CI for the opera-ohip-app internal tool.
# Builds on PR, pushes Docker image + deploys Helm chart on merge to main.

on:
  push:
    branches:
      - main
    paths:
      - 'tools/opera-ohip-app/**'
      - 'infra/opera-ohip-app/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'tools/opera-ohip-app/**'
      - 'infra/opera-ohip-app/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 327347623470.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: 327347623470.dkr.ecr.eu-west-1.amazonaws.com/whitbreaddigital/opera-ohip-app
  TOOL_DIR: tools/opera-ohip-app
  CHART_DIR: infra/opera-ohip-app
  HELM_VERSION: '3.12.0'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Quality gate — runs on every PR commit and on main
  # ──────────────────────────────────────────────────────────────
  lint-and-build:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          # Pinned major; package.json engines is a range (>=22) which
          # node-version-file cannot resolve to a concrete version.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ env.TOOL_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.TOOL_DIR }}
        run: npm ci

      - name: Format check
        working-directory: ${{ env.TOOL_DIR }}
        run: npm run format:check

      - name: Lint
        working-directory: ${{ env.TOOL_DIR }}
        run: npm run lint

      - name: Type check
        working-directory: ${{ env.TOOL_DIR }}
        run: npm run type-check

      - name: Test
        working-directory: ${{ env.TOOL_DIR }}
        run: npm test

      - name: Build
        working-directory: ${{ env.TOOL_DIR }}
        run: npm run build

  # ──────────────────────────────────────────────────────────────
  # Helm validation — runs on every PR commit
  # ──────────────────────────────────────────────────────────────
  helm-validate:
    name: Validate Helm chart
    if: github.event_name == 'pull_request'
    # Grant the reusable workflow the permissions it declares — a called
    # workflow cannot elevate the caller's token, so the caller must pass them.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/helm-validate.yaml
    with:
      chart-name: opera-ohip-app
      target-environment: tooling

  # ──────────────────────────────────────────────────────────────
  # Docker build & push — only on main after quality gate passes
  # ──────────────────────────────────────────────────────────────
  docker-push:
    name: Docker build & push
    needs: lint-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Resolve image metadata
        id: meta
        run: |
          VERSION=$(jq -r '.version' ${{ env.TOOL_DIR }}/package.json)
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${VERSION}-${SHORT_SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: arn:aws:iam::327347623470:role/GitHubActionsECRPushRole
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: ${{ env.TOOL_DIR }}
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image-tag }}
            ${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.version }}
            ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # Helm deploy to tooling — only on main after Docker push
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to tooling
    needs: docker-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: tooling-default-runner-scale-set
    environment: tooling
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Helm
        uses: ./.github/actions/setup-helm
        with:
          chart-path: ${{ env.CHART_DIR }}
          install-aws-cli: 'false'
          helm-version: ${{ env.HELM_VERSION }}

      # Reuse the shared deployer so this tool gets the same safe release
      # recovery as the generic workflow: a failed/pending release is rolled
      # back to its last deployed revision (preserving the running workload)
      # and only uninstalled when there is genuinely no deployed revision —
      # instead of blindly uninstalling and deleting Helm secrets. Inputs are
      # passed as env vars (never interpolated into a shell body).
      - name: Deploy with Helm
        env:
          CHART_PATH: opera-ohip-app
          ENVIRONMENT: tooling
          INPUT_NAMESPACE: opera-ohip-app
          HELM_TIMEOUT: 10m
          EXTRA_SET: image.tag=${{ needs.docker-push.outputs.image-tag }}
        run: ./infra/scripts/deploy-chart.sh

      - name: Verify deployment
        if: success()
        run: |
          echo "Release status:"
          helm status opera-ohip-app -n opera-ohip-app
          echo ""
          echo "Pods:"
          kubectl get pods -n opera-ohip-app

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Post-deploy debug ==="
          kubectl get pods -n opera-ohip-app -o wide 2>&1 || true
          echo ""
          kubectl get events -n opera-ohip-app --sort-by='.lastTimestamp' 2>&1 | tail -20 || true
          echo ""
          kubectl logs -n opera-ohip-app -l app.kubernetes.io/instance=opera-ohip-app --tail=30 2>&1 || true
