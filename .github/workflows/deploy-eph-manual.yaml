name: Ephemeral Deploy (manual)

# On-demand ephemeral deploy for developers.
#
# Context: ephemeral auto-deploy on pull_request is temporarily turned off to
# relieve dev cluster capacity.
# (see TEMP notes in ci-be.yaml and build-service.yaml)
#
# This workflow lets a developer deploy one or more services for a given PR on demand. 
# It reuses build-service.yaml with pr-number set, 
# which builds & pushes image and then runs ci-matrix-deploy-eph.yaml.
# (same path a PR used to have automatically)
#
# Run from PR source branch (select it as workflow ref)
# so rebuilt image and release metadata match the code under review.

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number - names release(s) <service>-pr-<number>'
        required: true
        type: string
      service-names:
        description: 'Service name or comma-separated list (e.g. basket-service,sample-service)'
        required: true
        type: string
      branch-name:
        description: 'Source branch for release metadata (defaults to selected ref)'
        required: false
        type: string
        default: ''

  push:
    branches:
      - feat/CTECH-13286-eph-envs  ###

permissions:
  contents: read

jobs:
  # Parse service list into JSON array for the matrix and
  # validate inputs before build/deploy.
  prepare:
    name: Prepare service list
    runs-on: tooling-default-runner-scale-set
    outputs:
      services: ${{ steps.parse.outputs.services }}
    steps:
      - name: Parse and validate inputs
        id: parse
        env:
          PR_NUMBER: ${{ inputs.pr-number || '22' }}  ###
          SERVICE_NAMES: ${{ inputs.service-names || 'basket-confirmation-processor' }}  ###
        ### move to helper-scripts?
        run: |
          set -euo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr-number must be a positive integer (got '$PR_NUMBER')"
            exit 1
          fi

          # Split on commas, trim whitespace, drop blanks. 
          # Service names are alphanumeric + hyphens; no JSON escaping is required.
          IFS=',' read -ra parts <<< "$SERVICE_NAMES"
          services=()
          declare -A seen=()
          for p in "${parts[@]}"; do
            s="$(echo "$p" | xargs || true)"
            [[ -z "$s" ]] && continue
            if [[ ! "$s" =~ ^[A-Za-z0-9-]+$ ]]; then
              echo "::error::Invalid service name '$s' (allowed: letters, digits, hyphens)"
              exit 1
            fi
            if [[ -n "${seen[$s]:-}" ]]; then
              echo "::warning::Duplicate service name '$s' ignored."
              continue
            fi
            seen[$s]=1
            services+=("$s")
          done

          if [[ ${#services[@]} -eq 0 ]]; then
            echo "::error::service-names is empty after parsing '$SERVICE_NAMES'"
            exit 1
          fi

          json="["
          first=1
          for s in "${services[@]}"; do
            if [[ $first -eq 1 ]]; then first=0; else json+=","; fi
            json+="\"$s\""
          done
          json+="]"

          echo "Parsed ${#services[@]} service(s): ${services[*]}"
          echo "services=$json" >> "$GITHUB_OUTPUT"

  # One build+deploy per service. build-service.yaml, called WITH pr-number,
  # builds the image and runs helm-deploy-eph > ci-matrix-deploy-eph.yaml,
  # creating <service>-pr-<number> release in opera-be.
  deploy:
    name: Deploy ${{ matrix.service }}
    needs: prepare
    concurrency:
      group: eph-deploy-${{ inputs.pr-number }}-${{ matrix.service }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    uses: ./.github/workflows/build-service.yaml
    with:
      service-name: ${{ matrix.service }}
      pr-number: ${{ inputs.pr-number || '22' }}  ###
      branch-name: ${{ inputs.branch-name || github.ref_name }}  ###
      deploy-eph: true
    secrets: inherit
