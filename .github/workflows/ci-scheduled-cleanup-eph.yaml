name: Scheduled Cleanup Ephemeral BE

# Nightly sweep of the per-PR backend environments created by
# ci-matrix-deploy-eph.yaml (Helm releases named <service>-pr-<number> in the
# opera-be namespace).
#
# ci-matrix-cleanup-eph.yaml already tears these down when a PR closes. That is
# the primary path and this workflow does not replace it — it is the safety net
# for everything that path cannot catch:
#
#   * the PR-closed run failed, was cancelled, or the runner was unavailable
#   * the PR was closed while the deploy was still in flight, so the release
#     appeared after the cleanup had already listed the namespace
#   * a release left behind in a non-deployed status (failed, pending-upgrade)
#     that no cleanup run ever matched
#   * a PR that is still open but abandoned — nobody has pushed to it in
#     STALE_DAYS, and its pods are holding node capacity for nothing
#
# It is deliberately release-driven rather than PR-driven: it lists what is
# actually running in the cluster and then asks GitHub whether each release
# still has a reason to exist. A PR-driven sweep (as cleanup-pr-fe.yaml does for
# the frontend) only ever sees open PRs, so it cannot find an orphan whose PR
# closed months ago.
#
# Removing a live environment is cheap to undo: the next push to an open PR
# redeploys it. That is why the thresholds below are days, not weeks.
#
# Scheduled workflows only ever run from the default branch, so edits here take
# effect once merged to main — not from a PR branch. Use the workflow_dispatch
# trigger (with dry-run) to exercise a change before merging. GitHub also delays
# or drops scheduled runs under load, so treat this as eventually-consistent
# housekeeping and never as a guarantee.

on:
  schedule:
    # 08:00 UTC daily — the same slot as the frontend sweep in
    # cleanup-pr-fe.yaml, and before the UK working day, so the cluster starts
    # the day reclaimed rather than losing an environment mid-review.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      stale-days:
        description: Remove releases whose PR is open but has had no new commit for this many days
        required: false
        default: '1'
        type: string
      dry-run:
        description: List what would be removed without uninstalling anything
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write
  deployments: write
  pull-requests: read
  issues: write

# One sweep at a time. This does NOT serialise against ci-matrix-cleanup-eph.yaml
# (that workflow groups per PR), so the two can overlap on the same release. That
# is harmless: `helm uninstall --ignore-not-found` succeeds on an already-removed
# release, and a genuine concurrent-operation error is reported as a failure to
# retry rather than crashing the sweep.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  HELM_DRIVER: configmap  ###

jobs:
  sweep:
    name: Reclaim inactive ephemeral backend environments
    runs-on: dev-default-runner-scale-set

    # Checked out only for the helper scripts under
    # .github/workflows/scripts/helper-scripts/ — every service name is still
    # derived from the release name, nothing else is read from the tree.
    # Scheduled workflows run from the default branch, so this checks out main.
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: List ephemeral Helm releases
        id: list
        run: |
          set -euo pipefail

          # --all so releases stuck in failed / pending-* / unknown are included:
          # a half-installed release still holds pods and is exactly what leaks.
          # The filter is anchored so `-pr-12` never matches `-pr-123`, and a
          # production release (no -pr-<n> suffix) can never be matched at all.
          # --filter=... rather than --filter ...: the value starts with a dash,
          # and the joined form leaves pflag no room to read it as a flag.
          raw=$(helm list --namespace opera-be --all --filter='-pr-[0-9]+$' -o json)

          # Drop the terminal states: `uninstalled` is retained history with no
          # workload behind it, and `uninstalling` is another run's in-flight
          # removal that this sweep must not fight over.
          releases=$(echo "$raw" | jq -c '
            [ .[]
              | select(.status != "uninstalled" and .status != "uninstalling")
              | select(.name | test("-pr-[0-9]+$"))
              | {name, status, updated, revision, chart} ]')

          count=$(echo "$releases" | jq 'length')
          echo "Found ${count} ephemeral release(s) in opera-be."
          echo "$releases" | jq -r '.[] | "  \(.name)  [\(.status)]  updated \(.updated)"'

          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo 'releases<<RELEASES_EOF'
            echo "$releases"
            echo 'RELEASES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Decide which releases are inactive
        id: decide
        if: steps.list.outputs.count != '0'
        uses: actions/github-script@v9
        env:
          RELEASES: ${{ steps.list.outputs.releases }}
          STALE_DAYS: ${{ inputs.stale-days || '7' }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const releases = JSON.parse(process.env.RELEASES || '[]');
            const staleDays = Number(process.env.STALE_DAYS) || 7;
            const cutoff = Date.now() - staleDays * 24 * 60 * 60 * 1000;

            // Helm prints Go's time format: "2026-08-20 03:14:59.123456789 +0000 UTC".
            // Neither the fractional seconds nor the trailing zone name parse, so
            // rebuild it as ISO 8601. Returns null when the shape is unrecognised —
            // an unparseable timestamp must never be the reason something is deleted.
            const releaseAgeDays = (updated) => {
              const m = /^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2})(?:\.\d+)? ([+-]\d{2})(\d{2})/.exec(updated || '');
              if (!m) return null;
              const t = Date.parse(`${m[1]}T${m[2]}${m[3]}:${m[4]}`);
              if (Number.isNaN(t)) return null;
              return Math.floor((Date.now() - t) / (24 * 60 * 60 * 1000));
            };

            // Last *commit* date, not pr.updated_at: a comment or a label change
            // must not keep an abandoned environment alive for another week. Same
            // signal cleanup-pr-fe.yaml uses for the frontend.
            const lastActivity = async (pr) => {
              try {
                const commits = await github.paginate(github.rest.pulls.listCommits, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  per_page: 100,
                });
                const last = commits.at(-1);
                return last?.commit?.committer?.date || last?.commit?.author?.date || pr.updated_at;
              } catch (error) {
                core.warning(`Could not list commits for PR #${pr.number} (${error?.status ?? 'unknown'}); falling back to updated_at.`);
                return pr.updated_at;
              }
            };

            // One lookup per PR number, not per release: a PR touching five
            // services has five releases and one state.
            const prCache = new Map();
            const lookupPr = async (number) => {
              if (prCache.has(number)) return prCache.get(number);
              let result;
              try {
                const { data } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: number,
                });
                result = { found: true, pr: data };
              } catch (error) {
                if (error?.status === 404) {
                  result = { found: false };
                } else {
                  // An API hiccup must not be read as "this PR is gone". Keep the
                  // release and let tomorrow's sweep decide.
                  result = { error: error?.status ?? 'unknown' };
                }
              }
              prCache.set(number, result);
              return result;
            };

            const remove = [];
            const keep = [];

            for (const release of releases) {
              const match = /^(.*)-pr-(\d+)$/.exec(release.name);
              if (!match) {
                keep.push({ ...release, reason: 'release name does not match <service>-pr-<number>' });
                continue;
              }
              const [, service, prText] = match;
              const prNumber = Number(prText);
              const ageDays = releaseAgeDays(release.updated);
              const entry = { release: release.name, service, prNumber, status: release.status, ageDays };

              // ci-matrix-deploy-eph.yaml falls back to pr-0 when it runs without
              // a pull_request context (a manual dispatch), so -pr-0 is a real
              // release with no PR behind it. It is left for a human: nothing in
              // GitHub records who asked for it or when they are done with it.
              if (prNumber === 0) {
                keep.push({ ...entry, reason: 'manual deploy (pr-0) — remove by hand or via ci-matrix-cleanup-eph.yaml' });
                continue;
              }

              const lookup = await lookupPr(prNumber);

              if (lookup.error) {
                keep.push({ ...entry, reason: `PR lookup failed (status ${lookup.error}); retrying next sweep` });
                continue;
              }
              if (!lookup.found) {
                remove.push({ ...entry, reason: `PR #${prNumber} does not exist` });
                continue;
              }

              const pr = lookup.pr;
              if (pr.state === 'closed') {
                remove.push({ ...entry, reason: `PR #${prNumber} is ${pr.merged_at ? 'merged' : 'closed'}`, prState: 'closed' });
                continue;
              }

              const activity = await lastActivity(pr);
              const activityMs = Date.parse(activity);
              if (Number.isNaN(activityMs)) {
                keep.push({ ...entry, reason: `PR #${prNumber} is open; last-activity date could not be read` });
                continue;
              }
              const idleDays = Math.floor((Date.now() - activityMs) / (24 * 60 * 60 * 1000));

              if (activityMs <= cutoff) {
                remove.push({ ...entry, reason: `PR #${prNumber} is open but has had no new commit for ${idleDays} day(s)`, prState: 'open', idleDays });
              } else {
                keep.push({ ...entry, reason: `PR #${prNumber} is open and active (last commit ${idleDays} day(s) ago)` });
              }
            }

            core.info(`Inactive: ${remove.length}, retained: ${keep.length}`);
            for (const r of remove) core.info(`  REMOVE ${r.release} — ${r.reason}`);
            for (const k of keep) core.info(`  KEEP   ${k.release} — ${k.reason}`);

            core.setOutput('remove', JSON.stringify(remove));
            core.setOutput('keep', JSON.stringify(keep));
            core.setOutput('remove-count', String(remove.length));

      - name: Uninstall inactive Helm releases
        id: uninstall
        if: steps.decide.outputs.remove-count != '' && steps.decide.outputs.remove-count != '0'
        env:
          REMOVE: ${{ steps.decide.outputs.remove }}
          DRY_RUN: ${{ inputs.dry-run || false }}
        run: |
          set -euo pipefail

          removed=()
          failed=()

          while IFS=$'\t' read -r release reason; do
            [[ -z "$release" ]] && continue

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "[dry-run] would uninstall ${release} — ${reason}"
              removed+=("$release")
              continue
            fi

            echo "Uninstalling ${release} — ${reason}"
            # --ignore-not-found so losing a race with ci-matrix-cleanup-eph.yaml
            # is a no-op rather than an error.
            if helm uninstall "$release" --namespace opera-be --ignore-not-found --wait --timeout 5m; then
              removed+=("$release")
            else
              # One stuck release must not abandon the rest of the sweep. The job
              # still fails at the end so the leak is not silent.
              echo "::warning::Failed to uninstall '${release}'; it may need removing by hand."
              failed+=("$release")
            fi
          done < <(echo "$REMOVE" | jq -r '.[] | [.release, .reason] | @tsv')

          printf '%s\n' "${removed[@]:-}" | sed '/^$/d' | jq -R -s -c 'split("\n") | map(select(length > 0))' > removed.json
          printf '%s\n' "${failed[@]:-}"  | sed '/^$/d' | jq -R -s -c 'split("\n") | map(select(length > 0))' > failed.json

          echo "removed=$(cat removed.json)" >> "$GITHUB_OUTPUT"
          echo "failed=$(cat failed.json)" >> "$GITHUB_OUTPUT"

      # ci-matrix-deploy-eph.yaml creates a Temporal namespace named after the
      # release for services that configure TEMPORAL_NAMESPACE; the PR-closed
      # cleanup deletes it, and this is the same safety net for it that the
      # sweep is for the Helm release. Deleting a namespace terminates any
      # workflows still running in it, which for a reclaimed environment is the
      # point — retention only purges closed histories, never running
      # workflows. Namespace name = release name, so the removed releases are
      # passed verbatim; the script warns rather than fails on every error (a
      # missing namespace is the normal case for services that never created
      # one). See the script header for the full rationale.
      - name: Delete Temporal namespaces
        if: ${{ steps.uninstall.outputs.removed != '' && steps.uninstall.outputs.removed != '[]' && !(inputs.dry-run) }}
        env:
          REMOVED: ${{ steps.uninstall.outputs.removed }}
        run: |
          set -euo pipefail
          mapfile -t namespaces < <(jq -r '.[]' <<< "${REMOVED}")
          .github/workflows/scripts/helper-scripts/temporal-namespace-remover.sh "${namespaces[@]}"

      - name: Delete deployments and environments
        if: ${{ steps.uninstall.outputs.removed != '' && steps.uninstall.outputs.removed != '[]' && !(inputs.dry-run) }}
        uses: actions/github-script@v9
        env:
          REMOVED: ${{ steps.uninstall.outputs.removed }}
          REMOVE_DETAIL: ${{ steps.decide.outputs.remove }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const removed = new Set(JSON.parse(process.env.REMOVED || '[]'));
            const detail = JSON.parse(process.env.REMOVE_DETAIL || '[]').filter(d => removed.has(d.release));

            const formatError = (error) => {
              const status = error?.status ?? 'unknown';
              const message = error?.message ?? 'No error message';
              return `status=${status}, message=${message}`;
            };

            for (const { service, prNumber } of detail) {
              // Matches the name ci-matrix-deploy-eph.yaml gives the job environment.
              const environmentName = `${service}-PR-${prNumber}`;

              let deployments;
              try {
                deployments = await github.rest.repos.listDeployments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  environment: environmentName,
                });
              } catch (error) {
                if (error?.status !== 404) {
                  core.warning(`Error listing deployments for '${environmentName}': ${formatError(error)}`);
                }
                continue;
              }

              for (const deployment of deployments.data) {
                const del = () => github.request('DELETE /repos/{owner}/{repo}/deployments/{deployment_id}', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                });
                try {
                  await del();
                } catch (error) {
                  if (error?.status === 422) {
                    // An active deployment cannot be deleted; mark it inactive first.
                    try {
                      await github.rest.repos.createDeploymentStatus({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        deployment_id: deployment.id,
                        state: 'inactive',
                        description: 'Marking inactive before scheduled cleanup',
                      });
                      await del();
                    } catch (retryError) {
                      core.warning(`Failed to delete deployment ${deployment.id} after inactivation: ${formatError(retryError)}`);
                    }
                  } else if (error?.status !== 404) {
                    core.warning(`Unexpected error deleting deployment ${deployment.id}: ${formatError(error)}`);
                  }
                }
              }

              try {
                await github.request('DELETE /repos/{owner}/{repo}/environments/{environment_name}', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  environment_name: environmentName,
                });
                core.info(`Environment '${environmentName}' deleted`);
              } catch (error) {
                if (error?.status === 403) {
                  core.warning(`Environment '${environmentName}' retained (insufficient permission): ${formatError(error)}`);
                } else if (error?.status !== 404) {
                  core.warning(`Unexpected error deleting environment '${environmentName}': ${formatError(error)}`);
                }
              }
            }

      # Clear the opt-in label for CLOSED PRs whose release this safety-net removed. The
      # on-close cleanup (ci-matrix-cleanup-eph.yaml) removes it too, but can miss a PR
      # (its run failed/cancelled, or the release appeared after it swept). Without this a
      # reopened PR would auto-deploy from the stale `ephemeral-active-be` label with no
      # fresh "Ephemeral UP". Open (stale) PRs are deliberately LEFT labelled — the reclaim
      # comment below tells the author a push recreates the env, which relies on the label
      # still gating ci-be.yaml's build-services-pr.
      - name: Clear opt-in label for reclaimed closed PRs
        if: ${{ always() && steps.uninstall.outputs.removed != '' && steps.uninstall.outputs.removed != '[]' && !(inputs.dry-run) }}
        uses: actions/github-script@v9
        env:
          REMOVED: ${{ steps.uninstall.outputs.removed }}
          REMOVE_DETAIL: ${{ steps.decide.outputs.remove }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const removed = new Set(JSON.parse(process.env.REMOVED || '[]'));
            const detail = JSON.parse(process.env.REMOVE_DETAIL || '[]').filter(d => removed.has(d.release));
            // One removeLabel per closed PR (a PR spanning several services appears once).
            const closedPrs = [...new Set(detail.filter(d => d.prState === 'closed').map(d => d.prNumber))];
            for (const prNumber of closedPrs) {
              const removeLabel = () => github.rest.issues.removeLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, name: 'ephemeral-active-be',
              });
              try {
                await removeLabel();
                core.info(`Removed 'ephemeral-active-be' label from closed PR #${prNumber}.`);
              } catch (error) {
                // 404 = label was not applied (or already gone); nothing to clean up.
                if (error?.status === 404) {
                  core.info(`Closed PR #${prNumber} had no 'ephemeral-active-be' label; nothing to remove.`);
                  continue;
                }
                // Retry once; still non-fatal — a label blip must not fail the sweep.
                core.warning(`Label removal failed for PR #${prNumber} (${error?.message ?? error}); retrying once.`);
                try {
                  await removeLabel();
                  core.info(`Removed 'ephemeral-active-be' label from closed PR #${prNumber} on retry.`);
                } catch (retryError) {
                  if (retryError?.status === 404) {
                    core.info(`Closed PR #${prNumber} had no 'ephemeral-active-be' label on retry.`);
                  } else {
                    core.warning(`Could not remove 'ephemeral-active-be' label from PR #${prNumber} after retry: ${retryError?.message ?? retryError}`);
                  }
                }
              }
            }

      - name: Comment on open PRs whose environment was reclaimed
        if: ${{ steps.uninstall.outputs.removed != '' && steps.uninstall.outputs.removed != '[]' && !(inputs.dry-run) }}
        uses: actions/github-script@v9
        env:
          REMOVED: ${{ steps.uninstall.outputs.removed }}
          REMOVE_DETAIL: ${{ steps.decide.outputs.remove }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const removed = new Set(JSON.parse(process.env.REMOVED || '[]'));
            const detail = JSON.parse(process.env.REMOVE_DETAIL || '[]').filter(d => removed.has(d.release));

            // Only open PRs get a comment. A closed PR's author has no action to
            // take, and commenting on every merged PR is noise.
            const byPr = new Map();
            for (const d of detail.filter(d => d.prState === 'open')) {
              if (!byPr.has(d.prNumber)) byPr.set(d.prNumber, []);
              byPr.get(d.prNumber).push(d);
            }

            for (const [prNumber, entries] of byPr) {
              const idleDays = entries[0].idleDays;
              const body = [
                '### Ephemeral backend environment reclaimed',
                '',
                `No new commit on this PR for ${idleDays} day(s), so its backend environment was removed to free cluster capacity:`,
                ...entries.map(e => `- \`${e.release}\``),
                '',
                'Push to this branch and the deploy pipeline will recreate it.',
              ].join('\n');

              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body,
                });
              } catch (error) {
                if (error?.status === 403) {
                  core.warning(`Skipping comment on PR #${prNumber}: token lacks permission.`);
                } else {
                  core.warning(`Could not comment on PR #${prNumber}: ${error?.status ?? 'unknown'}`);
                }
              }
            }

      - name: Write sweep summary
        if: always()
        env:
          FOUND: ${{ steps.list.outputs.count }}
          REMOVE: ${{ steps.decide.outputs.remove }}
          KEEP: ${{ steps.decide.outputs.keep }}
          REMOVED: ${{ steps.uninstall.outputs.removed }}
          FAILED: ${{ steps.uninstall.outputs.failed }}
          DRY_RUN: ${{ inputs.dry-run || false }}
          STALE_DAYS: ${{ inputs.stale-days || '7' }}
        run: |
          set -euo pipefail

          # The uninstall step is skipped when nothing is inactive, so its
          # outputs can be empty strings rather than JSON.
          remove_json="${REMOVE:-}"; [[ -z "$remove_json" ]] && remove_json='[]'
          removed_json="${REMOVED:-}"; [[ -z "$removed_json" ]] && removed_json='[]'

          {
            echo "## Ephemeral backend cleanup sweep"
            echo
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "**Dry run** — nothing was uninstalled."
              echo
            fi
            echo "Namespace \`opera-be\`, releases matching \`<service>-pr-<number>\`."
            echo "Open PRs are reclaimed after **${STALE_DAYS} day(s)** without a new commit."
            echo
            echo "Found: ${FOUND:-0}"
            echo

            # Driven by what actually came out, not by what was selected: a
            # release that failed to uninstall belongs only in the Failed
            # section below, never in both.
            if [[ "$removed_json" != "[]" ]]; then
              echo "### Removed"
              echo
              echo "| Release | Status | Age (days) | Reason |"
              echo "| --- | --- | --- | --- |"
              echo "$remove_json" | jq -r --argjson done "$removed_json" '
                .[] | select([.release] | inside($done))
                | "| `\(.release)` | \(.status) | \(.ageDays // "?") | \(.reason) |"'
              echo
            fi

            if [[ -n "${KEEP:-}" && "${KEEP:-[]}" != "[]" ]]; then
              echo "### Retained"
              echo
              echo "| Release | Reason |"
              echo "| --- | --- |"
              echo "$KEEP" | jq -r '.[] | "| `\(.release)` | \(.reason) |"'
              echo
            fi

            if [[ -n "${FAILED:-}" && "${FAILED:-[]}" != "[]" ]]; then
              echo "### Failed to uninstall"
              echo
              echo "$FAILED" | jq -r '.[] | "- `\(.)` — needs removing by hand"'
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any release could not be removed
        if: always()
        env:
          FAILED: ${{ steps.uninstall.outputs.failed }}
        run: |
          set -euo pipefail
          [[ -z "${FAILED:-}" ]] && exit 0
          count=$(echo "$FAILED" | jq 'length')
          if [[ "$count" -gt 0 ]]; then
            echo "::error::${count} ephemeral release(s) could not be uninstalled: $(echo "$FAILED" | jq -r 'join(", ")')"
            exit 1
          fi
