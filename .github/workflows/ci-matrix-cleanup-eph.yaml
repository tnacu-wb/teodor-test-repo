name: Matrix Cleanup Ephemeral

# Tears down the per-PR backend environments created by ci-matrix-deploy-eph.yaml.

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr-number:
        description: Number of the PR whose ephemeral backend environments should be removed
        required: true
        type: string

permissions:
  contents: read
  actions: write
  deployments: write
  pull-requests: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: false

env:
  HELM_DRIVER: configmap  ###

jobs:
  cleanup:
    name: Remove ephemeral backend environments
    runs-on: dev-default-runner-scale-set
    steps:
      - name: Resolve PR number
        id: prepare
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
        run: |
          set -euo pipefail

          pr_number="${PR_NUMBER:-}"
          if [[ -z "$pr_number" || "$pr_number" == "null" ]]; then
            echo "::error::No PR number available; cannot determine which releases to remove."
            exit 1
          fi
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "::error::PR number '$pr_number' is not numeric."
            exit 1
          fi

          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "Cleaning up ephemeral backend environments for PR-${pr_number}"
          echo "Helm releases matching: *-pr-${pr_number} in namespace opera-be"

      # Checkout the base branch rather than the PR merge ref: for a PR closed without
      # merging the merge ref no longer resolves, and only the service list is needed.
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
          fetch-depth: 1

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Uninstall ephemeral Helm releases
        id: uninstall
        env:
          PR_NUMBER: ${{ steps.prepare.outputs.pr-number }}
        run: |
          set -euo pipefail

          # Anchored on the end of the release name so PR 12 never matches PR 123.
          filter="-pr-${PR_NUMBER}$"

          list_failed=false
          if ! releases=$(helm list --namespace opera-be --filter "$filter" --short 2>/tmp/helm-list.err); then
            echo "::error::helm list failed for PR-${PR_NUMBER} in opera-be:"
            cat /tmp/helm-list.err >&2
            list_failed=true
            releases=""
          fi
          echo "list-failed=${list_failed}" >> "$GITHUB_OUTPUT"

          if [[ -z "$releases" ]]; then
            echo "No Helm releases found for PR-${PR_NUMBER} in opera-be."
          else
            echo "Found $(echo "$releases" | wc -l | tr -d ' ') release(s) to remove:"
            echo "$releases"
          fi

          removed=()
          failed=()
          while IFS= read -r release; do
            [[ -z "$release" ]] && continue
            echo "Uninstalling Helm release: ${release}"
            if helm uninstall "$release" --namespace opera-be --ignore-not-found --wait --timeout 5m; then
              removed+=("$release")
            else
              # Never fail the whole run on one stuck release — the remaining releases and
              # the GitHub environment cleanup still need to happen.
              echo "::warning::Failed to uninstall '${release}'; it may need removing by hand."
              failed+=("$release")
            fi
          done <<< "$releases"

          printf '%s\n' "${removed[@]:-}" | sed '/^$/d' | jq -R -s -c 'split("\n") | map(select(length > 0))' > removed.json
          printf '%s\n' "${failed[@]:-}"  | sed '/^$/d' | jq -R -s -c 'split("\n") | map(select(length > 0))' > failed.json

          echo "removed=$(cat removed.json)" >> "$GITHUB_OUTPUT"
          echo "failed=$(cat failed.json)" >> "$GITHUB_OUTPUT"

          # Environments to delete: every backend service in the repo, plus any service
          # inferred from a release we just removed (covers services deleted since the
          # deploy). Repo services are included so an environment still gets cleaned up
          # when its Helm release failed to install in the first place.
          repo_services=$(find backend/*/services -maxdepth 2 -name pom.xml -exec dirname {} \; \
            | xargs -r -I{} basename {} || true)
          release_services=$(echo "$releases" | sed -E "s#-pr-${PR_NUMBER}\$##" || true)

          services=$(printf '%s\n%s\n' "$repo_services" "$release_services" \
            | sed '/^$/d' | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "services=$services" >> "$GITHUB_OUTPUT"

      # ci-matrix-deploy-eph.yaml creates a Temporal namespace named after the
      # release for services that configure TEMPORAL_NAMESPACE; this removes
      # every namespace the server actually holds for this PR. All failures
      # degrade to warnings so the GitHub environment cleanup below always
      # runs. See the script header for the full rationale.
      - name: Delete Temporal namespaces
        if: steps.uninstall.outputs.list-failed != 'true'
        env:
          PR_NUMBER: ${{ steps.prepare.outputs.pr-number }}
        run: .github/workflows/scripts/helper-scripts/temporal-namespace-remover.sh --pr-number "${PR_NUMBER}"

      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Delete deployments and environments
        if: steps.uninstall.outputs.list-failed != 'true'
        uses: actions/github-script@v9
        env:
          SERVICES: ${{ steps.uninstall.outputs.services }}
          PR_NUMBER: ${{ steps.prepare.outputs.pr-number }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const prNumber = process.env.PR_NUMBER;
            const services = JSON.parse(process.env.SERVICES || '[]');

            const formatError = (error) => {
              const status = error?.status ?? 'unknown';
              const message = error?.message ?? 'No error message';
              const apiMessage = error?.response?.data?.message;
              return `status=${status}, message=${message}${apiMessage ? `, api_message=${apiMessage}` : ''}`;
            };

            const deleted = [];
            const notFound = [];

            for (const service of services) {
              const environmentName = `${service}-PR-${prNumber}`;

              let deployments;
              try {
                deployments = await github.rest.repos.listDeployments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  environment: environmentName,
                });
              } catch (error) {
                if (error?.status === 404) {
                  notFound.push(environmentName);
                } else {
                  core.warning(`Error listing deployments for '${environmentName}': ${formatError(error)}`);
                }
                continue;
              }

              // Nothing was ever deployed under this name. Skip quietly rather than logging every repo service.
              if (deployments.data.length === 0) {
                notFound.push(environmentName);
                continue;
              }

              core.info(`Processing environment: ${environmentName} (${deployments.data.length} deployment(s))`);

              for (const deployment of deployments.data) {
                try {
                  await github.request('DELETE /repos/{owner}/{repo}/deployments/{deployment_id}', {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    deployment_id: deployment.id,
                  });
                  core.info(`Deployment ${deployment.id} deleted from ${environmentName}`);
                } catch (error) {
                  if (error?.status === 404) {
                    core.info(`Deployment ${deployment.id} already deleted (404).`);
                  } else if (error?.status === 422) {
                    // An active deployment cannot be deleted; mark it inactive first.
                    core.info(`Deployment ${deployment.id} appears active; marking inactive and retrying delete.`);
                    try {
                      await github.rest.repos.createDeploymentStatus({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        deployment_id: deployment.id,
                        state: 'inactive',
                        description: 'Marking inactive before cleanup deletion',
                      });
                      await github.request('DELETE /repos/{owner}/{repo}/deployments/{deployment_id}', {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        deployment_id: deployment.id,
                      });
                      core.info(`Deployment ${deployment.id} deleted from ${environmentName} after inactivation.`);
                    } catch (retryError) {
                      core.warning(`Failed to delete deployment ${deployment.id} after inactivation: ${formatError(retryError)}`);
                    }
                  } else {
                    core.warning(`Unexpected error deleting deployment ${deployment.id}: ${formatError(error)}`);
                  }
                }
              }

              try {
                await github.request('DELETE /repos/{owner}/{repo}/environments/{environment_name}', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  environment_name: environmentName,
                });
                core.info(`Environment '${environmentName}' deleted`);
                deleted.push(environmentName);
              } catch (error) {
                if (error?.status === 404) {
                  notFound.push(environmentName);
                } else if (error?.status === 403) {
                  core.warning(`Environment '${environmentName}' retained (insufficient permission): ${formatError(error)}`);
                } else {
                  core.warning(`Unexpected error deleting environment '${environmentName}': ${formatError(error)}`);
                }
              }
            }

            core.info(`Cleanup summary - Deleted: ${deleted.length}, NotFound/skipped: ${notFound.length}`);
            if (deleted.length > 0) {
              core.info(`Environments deleted: ${deleted.join(', ')}`);
            }
            core.setOutput('deleted', JSON.stringify(deleted));

      - name: Post cleanup comment on PR
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.prepare.outputs.pr-number }}
          REMOVED: ${{ steps.uninstall.outputs.removed }}
          FAILED: ${{ steps.uninstall.outputs.failed }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const removed = JSON.parse(process.env.REMOVED || '[]');
            const failed = JSON.parse(process.env.FAILED || '[]');

            // Nothing was deployed for this PR — stay silent rather than commenting on
            // every closed PR that never touched a backend service.
            if (removed.length === 0 && failed.length === 0) {
              core.info('No ephemeral backend releases were removed; skipping cleanup comment.');
              return;
            }

            const lines = ['### Ephemeral backend cleanup', ''];
            if (removed.length > 0) {
              lines.push(`Uninstalled from \`opera-be\`:`);
              lines.push(...removed.map(r => `- \`${r}\``));
            }
            if (failed.length > 0) {
              lines.push('', `:warning: Failed to uninstall — these need removing by hand:`);
              lines.push(...failed.map(r => `- \`${r}\``));
            }

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: lines.join('\n'),
              });
            } catch (error) {
              if (error?.status === 403) {
                core.warning('Skipping cleanup comment: token lacks permission to comment on this PR.');
                return;
              }
              throw error;
            }

      # Remove the opt-in label on close so a reopened PR does not silently auto-deploy.
      # ci-be.yaml's build-services-pr gates deploy on `ephemeral-active-be`, and GitHub
      # replays labels across close/reopen; without this the env is torn down here but the
      # stale label would trigger a fresh deploy on the `reopened` event with no new
      # "Ephemeral UP" authorization.
      - name: Remove ephemeral-active-be label
        if: always()
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.prepare.outputs.pr-number }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.info('No valid PR number resolved; skipping label removal.');
              return;
            }
            const removeLabel = () => github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              name: 'ephemeral-active-be',
            });
            try {
              await removeLabel();
              core.info(`Removed 'ephemeral-active-be' label from PR #${prNumber}.`);
            } catch (error) {
              // 404 = label was not applied (or already gone); nothing to clean up.
              if (error?.status === 404) {
                core.info(`PR #${prNumber} had no 'ephemeral-active-be' label; nothing to remove.`);
                return;
              }
              // A transient blip could otherwise leave the stale opt-in label on the PR,
              // so a reopen would auto-deploy without a fresh "Ephemeral UP". Retry once.
              // Still non-fatal after that: a label hiccup must not fail an otherwise
              // successful teardown, and the reopen path is still bounded by the fork guard.
              core.warning(`Label removal failed for PR #${prNumber} (${error?.message ?? error}); retrying once.`);
              try {
                await removeLabel();
                core.info(`Removed 'ephemeral-active-be' label from PR #${prNumber} on retry.`);
              } catch (retryError) {
                if (retryError?.status === 404) {
                  core.info(`PR #${prNumber} had no 'ephemeral-active-be' label on retry; nothing to remove.`);
                } else {
                  core.warning(`Could not remove 'ephemeral-active-be' label from PR #${prNumber} after retry: ${retryError?.message ?? retryError}`);
                }
              }
            }

      - name: Fail if any release could not be removed
        env:
          FAILED: ${{ steps.uninstall.outputs.failed }}
          LIST_FAILED: ${{ steps.uninstall.outputs.list-failed }}
        run: |
          set -euo pipefail

          if [[ "${LIST_FAILED:-false}" == "true" ]]; then
            echo "::error::helm list failed for this PR; ephemeral releases could not be listed and may remain in opera-be."
            exit 1
          fi
          count=$(echo "$FAILED" | jq 'length')
          if [[ "$count" -gt 0 ]]; then
            echo "::error::${count} ephemeral release(s) could not be uninstalled: $(echo "$FAILED" | jq -r 'join(", ")')"
            exit 1
          fi
          echo "All ephemeral releases for this PR were removed."
