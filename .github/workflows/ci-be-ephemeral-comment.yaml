name: Backend Ephemeral Comment Trigger

### see moving parts to actions/ for BE; see .kiro for FE
### see moving scripts to helper-scripts/; see unify w/FE
### GitHub deployment registration + verification comment
### (register-pr-deployment + post-issue-verification + report-failure)
### confirming canary non-write commenter
### determine fork/force push guards/gh repos settings drift
#
# On-demand Backend ephemeral deploy driven by PR comment, mirroring Frontend
# (ci-fe-ephemeral-comment.yaml, CTECH-13440/PR 293 & 316).
#
# A developer comments "Ephemeral UP" on a PR > this workflow builds + deploys
# ALL ephemerally-deployable backend services
# (have ephemeral-values.yaml or values.yaml - enumerated by `detect` job, not PR diff)
# as <svc>-pr-<n> releases, and adds the shared `ephemeral-active-be` label.
# After that, ci-be.yaml's build-services-pr redeploys the PR's CHANGED deployable
# services on every commit (optional: unlabelled PRs never auto-deploy).
#
# issue_comment ALWAYS runs from default branch, so github.sha is main - not PR code. 
# This resolves PR head SHA via API and pass it as checkout-ref
# so build-service.yaml builds exact reviewed commit.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: be-ephemeral-comment-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  HELM_DRIVER: configmap  ###

jobs:
  authorize:
    name: Validate trigger phrase and permission
    # Cheap pre-filter before spinning a runner: must be a PR comment that contains the
    # phrase. The authoritative exact/trimmed match is done in JS below (Actions
    # expressions have no trim()).
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'Ephemeral UP')
    runs-on: tooling-default-runner-scale-set
    outputs:
      authorized:   ${{ steps.check.outputs.authorized }}
      phrase-match: ${{ steps.check.outputs.phrase-match }}
      pr-number:    ${{ steps.pr.outputs.number }}
      head-ref:     ${{ steps.pr.outputs.head-ref }}
      base-ref:     ${{ steps.pr.outputs.base-ref }}
      checkout-ref: ${{ steps.pr.outputs.checkout-ref }}
      out-of-sync:  ${{ steps.pr.outputs.out-of-sync }}
    steps:
      - name: Check trigger phrase and commenter permission
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Authoritative phrase match: exact, trimmed, case-sensitive. The `if:`
            // pre-filter only guarantees the phrase is a substring, so 'Ephemeral UPGRADE'
            // or 'Please Ephemeral UP now' still reach here and must be rejected.
            const body = context.payload.comment.body ?? '';
            if (body.trim() !== 'Ephemeral UP') {
              core.setOutput('phrase-match', 'false');
              core.setOutput('authorized', 'false');
              return;
            }
            core.setOutput('phrase-match', 'true');
            // getCollaboratorPermissionLevel 404s for a non-collaborator. Treat that as
            // "not authorized" so the `ignored` job posts the confused reaction, rather
            // than letting an uncaught 404 fail the job. Any other error is a real fault.
            let permission = 'none';
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.payload.comment.user.login,
              });
              permission = data.permission;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const ok = ['write', 'maintain', 'admin'].includes(permission);
            core.setOutput('authorized', ok ? 'true' : 'false');

      - name: Resolve PR head/base and mergeability
        id: pr
        if: steps.check.outputs.authorized == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const number = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number,
            });
            // Fork trust boundary: this privileged workflow (secrets + id-token + a
            // write-capable token) must never build/deploy a fork's head. Same-repo only.
            const sameRepo = pr.head.repo && pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (!sameRepo) {
              core.setFailed('Refusing to deploy a fork PR head from a privileged workflow.'); return;
            }
            // Backend supports base `main` only: ci-be.yaml (on-commit redeploy) and
            // ci-matrix-cleanup-eph (close cleanup) trigger on main only, so a
            // test-deployment PR would deploy once but never redeploy or auto-clean.
            const supported = ['main'].includes(pr.base.ref);
            if (!supported || pr.state !== 'open') {
              core.setFailed('PR is not open against a supported base (main).'); return;
            }
            // Always build the immutable pr.head.sha, never the mutable merge ref —
            // closes the TOCTOU gap (the merge ref can be recomputed after the auth
            // check). The comment path deploys the head as-is (not merged with base).
            core.setOutput('number', String(number));
            core.setOutput('head-ref', pr.head.ref);
            core.setOutput('base-ref', pr.base.ref);
            core.setOutput('checkout-ref', pr.head.sha);
            // mergeable is computed async and is often null on a fresh get; treat null as
            // "unknown" and do NOT warn (only an explicit false is out-of-sync).
            core.setOutput('out-of-sync', pr.mergeable === false ? 'true' : 'false');

  acknowledge:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: tooling-default-runner-scale-set
    steps:
      - name: React to the trigger comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: context.payload.comment.id, content: 'rocket',
            });

  ignored:
    needs: authorize
    # Only fire on a genuine permission failure: phrase matched exactly but the
    # commenter lacks write access. A mere phrase mismatch is "not triggered".
    if: needs.authorize.outputs.phrase-match == 'true' && needs.authorize.outputs.authorized == 'false'
    runs-on: tooling-default-runner-scale-set
    steps:
      - name: Note that the request was ignored
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: context.payload.comment.id, content: 'confused',
            });
            core.warning('Ephemeral deploy request ignored: commenter lacks write access.');

  notify-out-of-sync:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true' && needs.authorize.outputs.out-of-sync == 'true'
    runs-on: tooling-default-runner-scale-set
    steps:
      - name: Warn that the branch is not in sync with base
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
          BASE_REF: ${{ needs.authorize.outputs.base-ref }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `This branch has conflicts with \`${process.env.BASE_REF}\`. Deploying the branch head as-is — please update the branch.`,
            });

  detect:
    name: List deployable backend services
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: tooling-default-runner-scale-set
    permissions:
      contents: read
    outputs:
      services:    ${{ steps.list.outputs.services }}
      has-backend: ${{ steps.list.outputs.has-backend }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.authorize.outputs.checkout-ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: List deployable services
        id: list
        run: |
          set -euo pipefail
          services=$(bash .github/workflows/scripts/helper-scripts/list-deployable-eph.sh)
          echo "$services" | jq -e 'type == "array"' >/dev/null
          while IFS= read -r svc; do
            [[ -z "$svc" ]] && continue
            if [[ ! "$svc" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error::Rejected service name '$svc' from PR-controlled helper (allowed: lowercase letters, digits, hyphens)."
              exit 1
            fi
          done < <(jq -r '.[]' <<<"$services")
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "has-backend=$([ "$(jq 'length' <<<"$services")" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Deployable backend services ($(jq 'length' <<<"$services")): $services"

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [authorize, detect]
    if: needs.authorize.outputs.authorized == 'true' && needs.detect.outputs.has-backend == 'true'
    # Share the per-release group with build-services-pr and deploy-eph-manual so the
    # same release is never deployed by two entry points at once.
    concurrency:
      group: eph-deploy-${{ needs.authorize.outputs.pr-number }}-${{ matrix.service }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    uses: ./.github/workflows/build-service.yaml
    with:
      service-name: ${{ matrix.service }}
      pr-number: ${{ needs.authorize.outputs.pr-number }}
      branch-name: ${{ needs.authorize.outputs.head-ref }}
      checkout-ref: ${{ needs.authorize.outputs.checkout-ref }}
      deploy-eph: true
      changed: false
      verify-pr-open: true
    secrets: inherit

  mark-ephemeral:
    # Label the PR after a successful deploy so ci-be.yaml's build-services-pr
    # redeploys it on later commits (the sticky opt-in). Shared label with the FE.
    needs: [authorize, deploy]
    if: needs.authorize.outputs.authorized == 'true' && needs.deploy.result == 'success'
    runs-on: tooling-default-runner-scale-set
    steps:
      - name: Add ephemeral-active label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const label = 'ephemeral-active-be';
            // Close race: the deploy can finish just after the PR closes (and after the
            // close cleanup already stripped this label). Re-check before (re)adding it,
            // so we never leave a stale opt-in label on a closed PR that a reopen would
            // auto-deploy from. Mirrors the deploy job's verify-pr-open guard; fail-open
            // on a lookup error (the scheduled sweep still clears closed-PR labels).
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
              });
              if (pr.state !== 'open') {
                core.warning(`PR #${prNumber} is ${pr.state}; not adding the '${label}' label to a closed PR.`);
                return;
              }
            } catch (e) {
              core.warning(`Could not verify PR #${prNumber} state (${e?.status ?? e}); proceeding to label.`);
            }
            const add = () => github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prNumber, labels: [label],
            });
            try {
              await add();
            } catch (e) {
              // First-ever use: the repo label may not exist. Create it, then retry once.
              if (e.status === 404 || e.status === 422) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo, name: label,
                  color: '0e8a16',
                  description: 'PR has an ephemeral environment; redeploy on new commits.',
                }).catch(() => {});
                await add();
              } else { throw e; }
            }
            core.info(`Labelled PR #${prNumber} with '${label}'.`);
