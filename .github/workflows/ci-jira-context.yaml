name: Jira Context Injector

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  jira-context:
    name: Inject Jira context into PR
    runs-on: ubuntu-latest

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: whitbread-eos/wbd-workflows-templates
          ref: main
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          pip install requests

      - name: Run Jira context injector
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_CONTEXT_PATH: /tmp/jira_context.md
        run: |
          python scripts/jira-context/jira_context.py

          echo "JIRA_CONTEXT_PATH=/tmp/jira_context.md" >> $GITHUB_ENV

      - name: Post/Update Jira context in PR description
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const fs = require('fs');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const jiraBlock = fs.readFileSync(process.env.JIRA_CONTEXT_PATH, 'utf8');

            const markerStart = '<!-- jira-context:start -->';
            const markerEnd = '<!-- jira-context:end -->';

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const currentBody = pr.body || '';

            function upsertBlock(body, block) {
              const start = body.indexOf(markerStart);
              const end = body.indexOf(markerEnd);

              if (start !== -1 && end !== -1 && end > start) {
                const before = body.slice(0, start).trimEnd();
                const after = body.slice(end + markerEnd.length).trimStart();
                return `${before}\n\n${block}\n\n${after}`.trim() + '\n';
              }

              const sep = body.trim().length ? '\n\n' : '';
              return (body.trimEnd() + sep + block + '\n').trim() + '\n';
            }

            const nextBody = upsertBlock(currentBody, jiraBlock);

            if (nextBody !== currentBody) {
              await github.rest.pulls.update({ owner, repo, pull_number, body: nextBody });
              core.info('Updated PR description with Jira context block.');
            } else {
              core.info('PR description already up-to-date; no change.');
            }

      - name: Post/Update Jira context comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const fs = require('fs');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;

            const body = fs.readFileSync(process.env.JIRA_CONTEXT_PATH, 'utf8');
            const markerStart = '<!-- jira-context:start -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(markerStart));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing Jira context comment: ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              core.info(`Created Jira context comment: ${created.data.id}`);
            }
