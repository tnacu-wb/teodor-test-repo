name: Build and publish frontend container image
description: Compute an FE image tag, build the shared application Dockerfile, and optionally publish it.

inputs:
  app-name:
    description: Application image name.
    required: true
  app-version:
    description: Application version prefix for the image tag.
    required: true
  semantic-version:
    description: Optional repo-wide X.Y.Z tag emitted verbatim for a production main deployment build.
    required: false
    default: ""
  ref-name:
    description: Explicit ref value used in the image tag.
    required: true
  commit-sha:
    description: Commit SHA used in the image tag.
    required: true
  ecr-registry:
    description: ECR registry host used when ECR publishing is enabled.
    required: false
    default: ""
  push-dockerhub:
    description: Whether to publish the built image to Docker Hub.
    required: false
    default: "false"
  push-ecr:
    description: Whether to publish the built image to ECR.
    required: false
    default: "false"

outputs:
  image-tag:
    description: Computed tag shared by every published image variant.
    value: ${{ steps.build.outputs.image-tag }}

runs:
  using: composite
  steps:
    - name: Build and publish image
      id: build
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        APP_VERSION: ${{ inputs.app-version }}
        SEMANTIC_VERSION: ${{ inputs.semantic-version }}
        REF_NAME: ${{ inputs.ref-name }}
        COMMIT_SHA: ${{ inputs.commit-sha }}
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
        PUSH_DOCKERHUB: ${{ inputs.push-dockerhub }}
        PUSH_ECR: ${{ inputs.push-ecr }}
      run: bash "$GITHUB_ACTION_PATH/build-and-push.sh"
