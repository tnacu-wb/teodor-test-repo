name: Scan frontend component quality
description: Prepare coverage and run the SonarQube scanner for one frontend component.

inputs:
  component-path:
    description: Component path relative to the frontend workspace.
    required: true
  node-version:
    description: Node.js version used while preparing the scan.
    required: true
  sonar-cli-version:
    description: Sonar scanner CLI version.
    required: false
    default: 6.0.0.4432
  github-ref-name:
    description: Explicit ref name reported to SonarQube.
    required: true
  github-token:
    description: GitHub token supplied to the SonarQube scanner.
    required: true
  sonar-token:
    description: SonarQube authentication token.
    required: true

runs:
  using: composite
  steps:
    - name: Derive component name
      id: component
      shell: bash
      env:
        COMPONENT_PATH: ${{ inputs.component-path }}
      run: bash "$GITHUB_ACTION_PATH/derive-component-name.sh"

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Yarn
      shell: bash
      working-directory: frontend/pi-front-end-applications
      run: npm install -g yarn

    - name: Download lcov.info
      uses: actions/download-artifact@v8
      with:
        name: lcov.info
        path: frontend/pi-front-end-applications

    - name: Download Sonar scanner
      shell: bash
      working-directory: frontend/pi-front-end-applications
      env:
        SONAR_CLI_VERSION: ${{ inputs.sonar-cli-version }}
      run: |
        curl -O "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_CLI_VERSION}-linux.zip"
        unzip "sonar-scanner-cli-${SONAR_CLI_VERSION}-linux.zip"

    - name: SonarQube Scan
      shell: bash
      working-directory: frontend/pi-front-end-applications
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        COMPONENT_PATH: ${{ inputs.component-path }}
        COMPONENT_NAME: ${{ steps.component.outputs.component-name }}
        GITHUB_REF_NAME: ${{ inputs.github-ref-name }}
        SONAR_CLI_VERSION: ${{ inputs.sonar-cli-version }}
      run: bash "$GITHUB_ACTION_PATH/run-sonar-scan.sh"
