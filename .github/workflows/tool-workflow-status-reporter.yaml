# Collects annotations from current workflow run and sends a summary to a Microsoft Teams channel via webhook.
name: Workflow Run Status to Teams
on:
  workflow_call:
    inputs:
      annotations_level:
        required: false
        type: string
        default: '"failure","warning"'
        description: 'Comma-separated list of annotation levels to include: "failure", "warning", "notice" ; must be enclosed in quotes'
      exclude_jobs:
        required: false
        type: string
        default: ''
        description: 'Comma-separated list of job names to exclude from annotation collection; must match job names exactly and be enclosed in quotes'
      max_message_length:
        required: false
        type: number
        default: 250
        description: 'Maximum length of annotation messages to include in the Teams summary'
      max_annotations:
        required: false
        type: number
        default: 7
        description: 'Maximum number of annotations to include in the Teams summary'
    secrets:
      TEAMS_WEBHOOK:
        required: true
        description: 'The Microsoft Teams webhook URL to send the summary to'

permissions:
  actions: read
  checks: read

jobs:
  workflow-status-to-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Parse and send workflow annotations to Teams
        shell: python
        run: |
          import requests, json, sys

          # Configuration and github API
          MAX_MESSAGE_LENGTH = ${{ inputs.max_message_length }}
          MAX_ANNOTATIONS = ${{ inputs.max_annotations }}
          EXCLUDED_JOBS = { ${{ inputs.exclude_jobs }} }
          INCLUDE_LEVELS = { ${{ inputs.annotations_level }} }

          def github_api(path):
              headers = {"Authorization": f"token ${{ secrets.GITHUB_TOKEN }}","Accept": "application/vnd.github+json, application/vnd.github.mercy-preview+json"}
              resp = requests.get(f"https://api.github.com/repos/${{ github.repository }}{path}", headers=headers, timeout=300)
              resp.raise_for_status()
              return resp.json()

          # Exit early if repo is in testing mode
          if "devops-testing" in github_api("/topics").get("names", []):
            print("::notice::Repo is in testing mode, skipping")
            sys.exit(0)

          # Fetch workflow run and jobs, base for analysis
          workflow_run = github_api(f"/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}")
          workflow_jobs = github_api(f"/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs")

          # Collect annotations excluding specific jobs and filter by level
          annotations = sorted(
              [
                  {"job_id": job["id"], "job_name": job["name"], **annot}
                  for job in workflow_jobs["jobs"] if job["name"] not in EXCLUDED_JOBS
                  for annot in github_api(f"/check-runs/{job['id']}/annotations") if annot["annotation_level"] in INCLUDE_LEVELS
              ],
              key=lambda a: 0 if a["annotation_level"] == "failure" else 1 if a["annotation_level"] == "warning" else 2
          )

          # Exit early if no relevant annotations
          if not annotations:
              print(f"::notice::No {INCLUDE_LEVELS} annotations found, exiting.")
              sys.exit(0)

          # Collect failed steps across all jobs, we keep this annotation-independent, for accurate display based on annotation level sorting
          failed_steps_by_job = {
              job["name"]: {
                  "job_id": job["id"],
                  "steps": [{"name": step["name"], "number": step["number"]} for step in job.get("steps", []) if step.get("conclusion") == "failure"]
              }
              for job in workflow_jobs["jobs"]
              if job["name"] not in EXCLUDED_JOBS and [step for step in job.get("steps", []) if step.get("conclusion") == "failure"]
          }

          # Update workflow_run with annotation stats
          workflow_run.update({
              "total_annotations": len(annotations),
              "failures": sum(a["annotation_level"] == "failure" for a in annotations),
              "warnings": sum(a["annotation_level"] == "warning" for a in annotations)
          })

          # Build adaptive card for Teams
          card = {
              "type": "message",
              "attachments": [
                  {
                      "contentType": "application/vnd.microsoft.card.adaptive",
                      "content": {
                          "$schema": "https://adaptivecards.io/schemas/adaptive-card.json",
                          "type": "AdaptiveCard",
                          "version": "1.5",
                          "msteams": {"width": "Full"},
                          "body": [
                              {"type": "TextBlock", "text": workflow_run["repository"]["name"], "weight": "Bolder", "size": "Large", "wrap": True},
                              {"type": "TextBlock", "text": workflow_run["name"], "weight": "Bolder", "size": "Medium", "wrap": True, "spacing": "Small"},
                              {"type": "TextBlock", "text": workflow_run["display_title"], "weight": "Bolder", "size": "Medium", "wrap": True, "spacing": "Small"},
                              {"type": "FactSet",
                                  "separator": True,
                                  "facts": [
                                      {"title": "Branch:", "value": f"`{workflow_run['head_branch']}`"},
                                      {"title": "Commit:", "value": f"`{workflow_run['head_sha'][:7]}`"},
                                      {"title": "Actor:", "value": workflow_run["actor"]["login"]},
                                      *([{"title": "PR:", "value": f"#{pr['number']}"} for pr in workflow_run.get("pull_requests", [])]
                                          if workflow_run["event"] == "pull_request" else []
                                      )
                                  ]
                              },
                              {"type": "Container",
                                  "style": "emphasis",
                                  "spacing": "Medium",
                                  "items": [
                                      *(
                                          [{
                                              "type": "TextBlock",
                                              "text": f"Detected {workflow_run['failures']} failures and {workflow_run['warnings']} warnings"
                                                      + (f" (showing only {MAX_ANNOTATIONS})" if workflow_run['total_annotations'] > MAX_ANNOTATIONS else ""),
                                              "weight": "Bolder",
                                              "wrap": True
                                          }]
                                          if workflow_run["failures"] or workflow_run["warnings"] else []
                                      ),
                                      *[{
                                          "type": "Container",
                                          "spacing": "Small",
                                          "style": "default",
                                          "showBorder": True,
                                          "items": [
                                              {
                                                  "type": "TextBlock",
                                                  "text": f"[{a['annotation_level'].upper()}] {a['job_name'].split('/')[-1]}: "
                                                          f"{a['message'][:MAX_MESSAGE_LENGTH]}"
                                                          f"{'...' if len(a['message']) > MAX_MESSAGE_LENGTH else ''}",
                                                  "wrap": True,
                                                  "color": "Attention" if a["annotation_level"] == "failure" else "Warning" if a["annotation_level"] == "warning" else "Default"
                                              }
                                          ]
                                      }
                                      for a in annotations[:MAX_ANNOTATIONS]
                                      ],
                                      *(
                                          [{
                                              "type": "TextBlock",
                                              "text": "**Failed job steps:**",
                                              "weight": "Bolder",
                                              "spacing": "Medium",
                                              "separator": True
                                          }] if failed_steps_by_job else []
                                      ),
                                      *[{
                                          "type": "TextBlock",
                                          "text": f"""{job_name.split('/')[-1]}: {', '.join([f'[{step["name"]}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/{job_data["job_id"]}#step:{step["number"]})' for step in job_data['steps']])}""",
                                          "wrap": True,
                                          "spacing": "Small"
                                      }
                                      for job_name, job_data in failed_steps_by_job.items()
                                      ]
                                  ]
                              }
                          ],
                          "actions": [
                              {"type": "Action.OpenUrl",
                                "title": "View Workflow Run and Logs in GitHub",
                                "url": workflow_run["html_url"]
                              }
                          ]
                      }
                  }
              ]
          }

          # Send to Teams
          resp = requests.post("${{ secrets.TEAMS_WEBHOOK }}", json=card, timeout=120)
          resp.raise_for_status()
          print(f"::notice::Successfully sent workflow summary for run {workflow_run['id']}/{workflow_run['run_attempt']} to Microsoft Teams ✅")
