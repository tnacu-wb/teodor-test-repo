name: Kiro CLI Issue Resolver

on:
  issues:
    types: [opened]

  issue_comment:
    types: [created, edited]

  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to resolve (for manual runs)"
        required: true
        type: string

# The reusable workflow needs these to push a branch and open a PR.
permissions:
  contents: write
  pull-requests: write
  issues: read

# One run per issue; don't cancel an in-progress resolution.
concurrency:
  group: kiro-issue-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  resolve-issue:
    # For issue_comment events, only act on comments on real issues — never on pull
    # request comments (the API delivers PR comments as issue_comment too). This stops
    # unrelated PR comments such as the "Ephemeral UP" ephemeral-deploy trigger from
    # kicking off the issue resolver. Also skip bot comments to avoid infinite loops.
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request == null &&
       github.event.comment.user.type == 'User' &&
       !startsWith(github.event.comment.body, '[bot]'))
    
    uses: ./.github/workflows/ci-issues-pipeline-fe.yaml
    secrets: inherit
    with:
      issue_number: ${{ github.event.issue.number || github.event.inputs.issue_number }}
      issue_title: ${{ github.event.issue.title || github.event.issue.title }}
      issue_body: ${{ github.event.issue.body || github.event.issue.body }}
      issue_labels: ${{ join(github.event.issue.labels.*.name, ', ') }}
