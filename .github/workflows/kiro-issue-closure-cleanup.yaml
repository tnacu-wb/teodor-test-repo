name: Kiro CLI Issue Closure Cleanup

on:
  issues:
    types: [closed]

  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to clean up (for manual runs)"
        required: true
        type: string

# The reusable workflow needs to delete branches and update PRs/issues.
permissions:
  contents: write
  pull-requests: write
  issues: write

# One cleanup run per issue.
concurrency:
  group: kiro-issue-cleanup-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  cleanup-on-issue-close:
    uses: ./.github/workflows/ci-issues-closure-cleanup-fe.yaml
    secrets: inherit
    with:
      issue_number: ${{ github.event.issue.number || github.event.inputs.issue_number }}
