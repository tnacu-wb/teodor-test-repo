name: Matrix Deploy Ephemeral

# Ephemeral (per-pull-request) deploy for a backend service. Each release is {{service_name}}-pr{{number}}.

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Name of the service to deploy (e.g. payment-orchestration-service)'
        required: true
        type: string
      image-tag:
        description: Docker image tag to deploy
        required: true
        type: string
      branch-name:
        description: Pull request source branch name
        required: true
        type: string
      image-repository:
        description: Fully-qualified image repository including the registry host
        required: true
        type: string
      pr-number:
        description: >-
          Pull request number. Passed explicitly by ci-be.yaml so this workflow
          gets the correct value when called via workflow_call, where
          github.event.pull_request is not populated.
        required: true
        type: string
      checkout-ref:
        description: >-
          Commit SHA to check out for Helm chart + ephemeral-values.yaml. Empty
          uses github.sha. Comment-trigger path (issue_comment) MUST set this to the
          PR head SHA, otherwise github.sha is the default branch and the deploy would
          use main's chart/values against PR head's image. On-commit and manual paths 
          leave it empty (github.sha already resolves to PR merge commit/pushed commit, 
          which carries the reviewed chart changes).
        required: false
        type: string
        default: ''
      verify-pr-open:
        description: >-
          When true, re-check the PR is still open immediately before the Helm release
          is written, so a PR that closed mid-deploy is not recreated by this run. The
          close cleanup (ci-matrix-cleanup-eph) uses a different concurrency group, so
          it cannot serialise against this deploy. Auto callers (ci-be build-services-pr,
          the comment trigger) set this; the manual path leaves it off. Best-effort — a
          close in the remaining window is still swept by ci-scheduled-cleanup-eph.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  issues: read

env:
  HELM_DRIVER: configmap  ###

jobs:
  prepare:
    name: Prepare ephemeral metadata for ${{ inputs.service-name }}
    runs-on: dev-default-runner-scale-set
    outputs:
      service-name: ${{ steps.prepare.outputs.service-name }}
      pr-number: ${{ steps.prepare.outputs.pr-number }}
      release-name: ${{ steps.prepare.outputs.release-name }}
      environment-name: ${{ steps.prepare.outputs.environment-name }}
      sanitized-branch: ${{ steps.prepare.outputs.sanitized-branch }}
      service-host: ${{ steps.prepare.outputs.service-host }}
    steps:
      - name: Prepare deployment metadata
        id: prepare
        env:
          SERVICE_NAME: ${{ inputs.service-name }}
          BRANCH_NAME: ${{ inputs.branch-name }}
          # pr-number is passed explicitly from the caller — github.event.pull_request
          # is not populated under workflow_call, so reading it here would always
          # produce an empty string and fall through to the "0" default.
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail

          pr_number="${PR_NUMBER:-}"
          if [[ -z "$pr_number" || "$pr_number" == "null" ]]; then
            pr_number="0"
          fi

          sanitized_branch=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9/-]#-#g; s#/#-#g; s#-+#-#g; s#^-+##; s#-+$##')
          sanitized_branch=${sanitized_branch:0:35}
          # Truncation above can re-introduce a trailing dash; strip leading/trailing dashes again.
          sanitized_branch=$(echo "$sanitized_branch" | sed -E 's#^-+##; s#-+$##')

          if [[ -z "$sanitized_branch" ]]; then
            sanitized_branch="pr"
          fi

          suffix="-pr-${pr_number}"
          service_slug="${SERVICE_NAME:0:$(( 53 - ${#suffix} ))}"
          service_slug=$(echo "$service_slug" | sed -E 's#-+$##')
          release_name="${service_slug}${suffix}"

          environment_name="${SERVICE_NAME}-PR-${pr_number}"

          # Ephemeral backend releases are not published through the Istio gateway; they
          # are addressed in-cluster by their service name.
          service_host="${release_name}.opera-be.svc.cluster.local"

          {
            echo "service-name=$SERVICE_NAME"
            echo "pr-number=$pr_number"
            echo "release-name=$release_name"
            echo "environment-name=$environment_name"
            echo "sanitized-branch=$sanitized_branch"
            echo "service-host=$service_host"
          } >> "$GITHUB_OUTPUT"

          echo "Deploying $SERVICE_NAME as release '$release_name' (branch $sanitized_branch, PR $pr_number)"

  deploy:
    name: Ephemeral deploy ${{ inputs.service-name }}
    needs: prepare
    runs-on: dev-default-runner-scale-set
    environment:
      name: ${{ needs.prepare.outputs.environment-name }}
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write

    env:
      SERVICE_NAME: ${{ inputs.service-name }}

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Deploy chart + ephemeral-values.yaml from reviewed commit. 
      # On comment path checkout-ref is PR head SHA (github.sha would be main); 
      # the on-commit/manual paths pass empty and fall back to github.sha as before.
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.checkout-ref != '' && inputs.checkout-ref || github.sha }}
          fetch-depth: 0
          path: digital-monorepo
          persist-credentials: false

      # Two ways to configure a PR release, preferred first. Both layer the
      # backend stack-level ephemeral defaults
      # (backend/infrastructure/helm/ephemeral-values.yaml) with the service's
      # own file; only the ORDER differs, because in one case the service file
      # is already ephemeral-shaped and in the other it is production.
      #
      #  1. A <service>/infrastructure/helm/ephemeral-values.yaml. Stack
      #     defaults go UNDER it, so the service file wins on every key and only
      #     has to state what is service-specific. Production values are NOT
      #     layered in, so PR and production tuning cannot drift into each other.
      #  2. The service's values.yaml with the stack defaults layered LAST, so
      #     the ephemeral switches override whatever production declares.
      #
      # `--set ephemeral=true` alone only gates the Flagger Canary. Without the
      # layering above a PR release in case 2 would still get the production HPA,
      # PDB, VirtualService and resource limits from its own values.
      #
      # Helm merges maps key by key but replaces lists wholesale, so a list the
      # service file sets (containerEnvs, containerPorts, service.ports) fully
      # replaces the stack default rather than adding to it. The stack defaults
      # file documents which keys are therefore left out of it.
      - name: Locate service helm values
        id: helm-values
        run: |
          set -euo pipefail
          SVC_DIR=$(find digital-monorepo -type d -path "*/${SERVICE_NAME}/infrastructure/helm" -print -quit)
          STACK_DEFAULTS="digital-monorepo/backend/infrastructure/helm/ephemeral-values.yaml"

          if [ ! -f "${STACK_DEFAULTS}" ]; then
            echo "No stack-level ephemeral defaults at ${STACK_DEFAULTS}; using service values alone."
            STACK_DEFAULTS=""
          fi

          if [ -n "${SVC_DIR}" ] && [ -f "${SVC_DIR}/ephemeral-values.yaml" ]; then
            echo "Ephemeral values: stack defaults + ${SVC_DIR}/ephemeral-values.yaml"
            echo "found=true" >> "${GITHUB_OUTPUT}"
            echo "base-file=${STACK_DEFAULTS}" >> "${GITHUB_OUTPUT}"
            echo "values-file=${SVC_DIR}/ephemeral-values.yaml" >> "${GITHUB_OUTPUT}"
            echo "overlay-file=" >> "${GITHUB_OUTPUT}"
          elif [ -n "${SVC_DIR}" ] && [ -f "${SVC_DIR}/values.yaml" ]; then
            echo "Production values + stack ephemeral defaults as overlay: ${SVC_DIR}/values.yaml"
            echo "found=true" >> "${GITHUB_OUTPUT}"
            echo "base-file=" >> "${GITHUB_OUTPUT}"
            echo "values-file=${SVC_DIR}/values.yaml" >> "${GITHUB_OUTPUT}"
            echo "overlay-file=${STACK_DEFAULTS}" >> "${GITHUB_OUTPUT}"
          else
            echo "No helm values found for ${SERVICE_NAME}" >&2
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      # Race guard: the close cleanup (ci-matrix-cleanup-eph) uses a different
      # concurrency group, so a PR that closes mid-deploy can be torn down and then
      # recreated here on a now-closed PR. Re-check the PR is still open just before the
      # release is written. Best-effort — a close in the remaining window is still swept
      # by ci-scheduled-cleanup-eph. Auto callers set verify-pr-open; the manual path
      # (and pr-0) skip it. Fail-open on a lookup error: never block a real deploy on an
      # API blip.
      #
      # Also guards a stale head: checkout-ref was captured in `authorize` at trigger
      # time, so a force-push since then would deploy a commit that is no longer the PR
      # head. When checkout-ref is set (comment path), abort on mismatch and let the
      # dev re-comment "Ephemeral UP" for the new head — matching the frontend path.
      # (On-commit/manual leave checkout-ref empty and use github.sha, so no compare.)
      - name: Verify PR is still open
        if: ${{ inputs.verify-pr-open }}
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.info('No real PR number (manual / pr-0 deploy); skipping open-state check.');
              return;
            }
            let pr;
            try {
              ({ data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
              }));
            } catch (error) {
              core.warning(`Could not verify PR #${prNumber} state (${error?.status ?? error}); proceeding with deploy.`);
              return;
            }
            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is ${pr.state}; refusing to (re)create the ephemeral release on a closed PR.`);
              return;
            }
            const checkoutRef = (process.env.CHECKOUT_REF || '').toLowerCase();
            const headSha = (pr.head.sha || '').toLowerCase();
            if (checkoutRef && headSha && checkoutRef !== headSha) {
              core.setFailed(`PR #${prNumber} head has moved (deploying ${checkoutRef}, current head ${headSha}); refusing to deploy a stale commit. Re-comment "Ephemeral UP" to deploy the new head.`);
            }

      - name: Clear stale Helm state
        env:
          RELEASE_NAME: ${{ needs.prepare.outputs.release-name }}
          NAMESPACE: opera-be
        run: digital-monorepo/.github/workflows/scripts/helper-scripts/clear-stale-helm-op.sh

      # A service whose values configure TEMPORAL_NAMESPACE (= the release
      # name, reflected from the pod's `app` label) needs that namespace to
      # exist before the pods the helm upgrade creates come up; the script
      # skips services whose values files never mention it. See the script
      # header for the full rationale.
      - name: Create Temporal namespace for the PR release
        env:
          RELEASE_NAME: ${{ needs.prepare.outputs.release-name }}
          BASE_FILE: ${{ steps.helm-values.outputs.base-file }}
          VALUES_FILE: ${{ steps.helm-values.outputs.values-file }}
          OVERLAY_FILE: ${{ steps.helm-values.outputs.overlay-file }}
        run: |
          digital-monorepo/.github/workflows/scripts/helper-scripts/temporal-namespace-creator.sh \
            "${RELEASE_NAME}" "${BASE_FILE}" "${VALUES_FILE}" "${OVERLAY_FILE}"

      - name: Deploy to Kubernetes with Helm
        env:
          RELEASE_NAME: ${{ needs.prepare.outputs.release-name }}
          BASE_FILE: ${{ steps.helm-values.outputs.base-file }}
          VALUES_FILE: ${{ steps.helm-values.outputs.values-file }}
          OVERLAY_FILE: ${{ steps.helm-values.outputs.overlay-file }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        run: |
          set -euo pipefail
          # Leading ./ keeps Helm treating this as a local chart directory. Without
          # it, a path Helm cannot stat is re-parsed as <repo>/<chart> and fails
          # with "repo digital-monorepo not found".
          helm upgrade --install "${RELEASE_NAME}" ./digital-monorepo/infra/helm/opera-app-chart \
            --namespace opera-be \
            --set image.tag="${IMAGE_TAG}" \
            --set namespace="opera-be" \
            --set applicationName="${RELEASE_NAME}" \
            --set service.name="${RELEASE_NAME}" \
            --set imageAutomation.create=false \
            --set ephemeral=true \
            --set image.repository="${IMAGE_REPOSITORY}" \
            ${BASE_FILE:+--values "${BASE_FILE}"} \
            --values "${VALUES_FILE}" \
            ${OVERLAY_FILE:+--values "${OVERLAY_FILE}"} \
            --wait \
            --timeout 10m \
            --cleanup-on-fail
