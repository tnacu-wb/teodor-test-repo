name: Build Library

on:
  workflow_call:
    inputs:
      library-name:
        description: 'Name of the library to build (e.g. commons-cdh-lib)'
        required: true
        type: string

# Explicitly excluded: Sonar scan (to be added once SonarCloud project is provisioned),
# artifact upload (libraries are consumed via the local Maven reactor),
# Docker build, container push, Helm release, DIT sync, release-checks (all apply to deployable
# services only).

jobs:
  build:
    name: Build ${{ inputs.library-name }}
    runs-on: tooling-default-runner-scale-set
    permissions:
      actions: read
      contents: read

    env:
      LIBRARY_NAME: ${{ inputs.library-name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Write settings.xml
        env:
          SETTINGS_XML: ${{ vars.SETTINGS_XML }}
        run: echo "$SETTINGS_XML" | base64 -d > backend/settings.xml

      # Resolve the squad-based library path dynamically
      - name: Resolve library path
        id: resolve-path
        run: |
          matches=(backend/*/libs/$LIBRARY_NAME)
          if [[ ${#matches[@]} -eq 0 || ! -d "${matches[0]}" ]]; then
            echo "::error::Library directory not found: backend/*/libs/$LIBRARY_NAME"
            exit 1
          fi
          if [[ ${#matches[@]} -gt 1 ]]; then
            echo "::error::Ambiguous match for $LIBRARY_NAME: ${matches[*]}"
            exit 1
          fi
          echo "library-path=${matches[0]}" >> "$GITHUB_OUTPUT"
          echo "module-path=${matches[0]#backend/}" >> "$GITHUB_OUTPUT"

      # Caches
      # Shares one Maven repository with build-service.yaml and
      # build-docker-container.yaml. RESTORE ONLY — the seed-maven-cache job in
      # ci-be.yaml resolves the whole reactor and owns the write, so a parallel matrix
      # job cannot freeze a partial cache under the shared key.
      # See the comment in build-service.yaml for the full rationale.
      - name: Restore Maven packages
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # Build & Test using Maven
      - name: Maven build
        env:
          MAVEN_CLI_OPTS: ${{ vars.MAVEN_CLI_OPTS }}
        working-directory: backend/
        # Maven build cache on the shared EFS volume — same flags as build-service.yaml.
        run: |
          mvn $MAVEN_CLI_OPTS \
            -Dmaven.build.cache.location=/mnt/efs/maven-build-cache \
            -Dmaven.build.cache.maxLocalBuildsCached=7 \
            clean verify -pl "${{ steps.resolve-path.outputs.module-path }}" -am
