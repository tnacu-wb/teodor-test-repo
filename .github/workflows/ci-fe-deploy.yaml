name: CI FE Deploy

# main is not a push trigger: ci-main-versioning.yaml tags the merge commit and
# calls this workflow with that version.
on:
  push:
    branches:
      - "release/*"
      - "hotfix/release*"
      - "perf/*"
  workflow_dispatch:
    inputs:
      # demo param; implement if needed
      extra-params:
        description: "Extra params; JSON"
        required: false
        type: string
  workflow_call:
    inputs:
      semantic-version:
        description: X.Y.Z version that ci-main-versioning.yaml just tagged on github.sha.
        required: true
        type: string

permissions:
  contents: read

# Literal name, not github.workflow: when called, github.workflow is the caller's
# name, which would put this and the backend pipeline in one group.
concurrency:
  group: CI FE Deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.20.0"

jobs:
  # Main-line work runs only when ci-main-versioning.yaml calls this workflow with
  # the version it just tagged. This gate proves that tag points at github.sha
  # before any job uses it.
  main-deployment-gate:
    name: Resolve production main deployment context
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    outputs:
      semantic-version: ${{ steps.version-tag.outputs.semantic-version }}
      checkout-sha: ${{ steps.version-tag.outputs.checkout-sha }}
    steps:
      - name: Checkout tagged commit with tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate semantic version and tag
        id: version-tag
        env:
          SEMANTIC_VERSION: ${{ inputs.semantic-version }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$SEMANTIC_VERSION" ]]; then
            echo "::error::Production main builds run only when ci-main-versioning.yaml calls this workflow with a semantic-version."
            exit 1
          fi
          if [[ ! "$SEMANTIC_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::semantic-version must use X.Y.Z format; got '$SEMANTIC_VERSION'."
            exit 1
          fi
          if [[ ! "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::github.sha must be an immutable 40-character commit SHA; got '$CHECKOUT_SHA'."
            exit 1
          fi
          tag_sha="$(git rev-parse -q --verify "refs/tags/${SEMANTIC_VERSION}^{commit}" || true)"
          if [[ "$tag_sha" != "$CHECKOUT_SHA" ]]; then
            echo "::error::Tag '${SEMANTIC_VERSION}' does not point to ${CHECKOUT_SHA} (got '${tag_sha:-<missing>}'); refusing to build an unversioned deployment."
            exit 1
          fi
          echo "semantic-version=${SEMANTIC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "checkout-sha=${CHECKOUT_SHA}" >> "$GITHUB_OUTPUT"

  code-analysis:
    needs: main-deployment-gate
    if: |
      always() &&
      (github.event_name != 'push' ||
      github.ref != 'refs/heads/main' ||
      needs.main-deployment-gate.result == 'success') &&
      !endsWith(github.head_ref || github.ref_name, '-Issues-XX') &&
      !endsWith(github.head_ref || github.ref_name, '-JIRA-XX')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.main-deployment-gate.outputs.checkout-sha || github.sha }}

      - name: Analyze frontend code
        uses: ./.github/frontend/actions/code-analysis
        with:
          branch-name: ${{ github.head_ref || github.ref_name }}
          repository: ${{ github.repository }}
          prisma-code-analysis-access-key-id: ${{ secrets.PRISMA_CODE_ANALYSIS_ACCESS_KEY_ID }}
          prisma-code-analysis-secret-key: ${{ secrets.PRISMA_CODE_ANALYSIS_SECRET_KEY }}

  build:
    needs: main-deployment-gate
    if: |
      always() &&
      (github.event_name != 'push' ||
      github.ref != 'refs/heads/main' ||
      needs.main-deployment-gate.result == 'success')
    runs-on: tooling-fe-runner-scale-set
    defaults:
      run:
        working-directory: frontend/pi-front-end-applications
    outputs:
      business-booker-version: ${{ steps.frontend-build.outputs.business-booker-version }}
      ccui-version: ${{ steps.frontend-build.outputs.ccui-version }}
      premier-inn-version: ${{ steps.frontend-build.outputs.premier-inn-version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.main-deployment-gate.outputs.checkout-sha || github.sha }}

      - name: Build frontend applications
        id: frontend-build
        uses: ./.github/frontend/actions/build
        with:
          node-version: ${{ env.NODE_VERSION }}
          run-full-validation: ${{ !endsWith(github.head_ref || github.ref_name, '-Issues-XX') && !endsWith(github.head_ref || github.ref_name, '-JIRA-XX') }}
          target-environment: >-
            ${{ github.ref_name == 'main' && 'dev' ||
            contains(github.ref, '/merge') && 'dev' ||
            contains(github.ref, 'gh-readonly-queue') && 'dev' ||
            contains(github.ref, 'hotfix/release') && 'demo' ||
            contains(github.ref, 'release/') && 'uat' ||
            contains(github.ref, 'perf/') && 'perf' }}

      - name: Notify Jira on build failure
        if: ${{ failure() && endsWith(github.head_ref || github.ref_name, '-JIRA-XX') }}
        continue-on-error: true
        env:
          JIRA_DOMAIN: whitbreadis.atlassian.net
          EMAIL: iyyappan.murugan@whitbread.com
          API_TOKEN: ${{ secrets.JIRA_KIRO_INTEGRATION }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_SCRIPT_ROOT: ${{ github.workspace }}/.github/frontend/scripts
        run: bash "$CI_SCRIPT_ROOT/notifications/jira-build-failure-comment.sh"

  quality-scans:
    # always(): main-deployment-gate is skipped off main, and a skipped job
    # anywhere upstream would otherwise skip this job too.
    if: |
      always() &&
      needs.build.result == 'success' &&
      !endsWith(github.head_ref || github.ref_name, '-Issues-XX') &&
      !endsWith(github.head_ref || github.ref_name, '-JIRA-XX')
    needs: [build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/pi-front-end-applications
    env:
      SRCCLR_API_TOKEN: ${{ secrets.OPERA_FE_SCA_TOKEN }}
      SONAR_CLI_VERSION: 6.0.0.4432
      VOSP_API_WRAPPER_VERSION: "23.8.12.0"
    strategy:
      fail-fast: false
      matrix:
        component-path: ${{ fromJson(vars.COMPONENTS) }} # see move JSON in workflows-templates; not used
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Scan frontend component quality
        uses: ./.github/frontend/actions/quality-scan
        with:
          component-path: ${{ matrix.component-path }}
          node-version: ${{ env.NODE_VERSION }}
          sonar-cli-version: ${{ env.SONAR_CLI_VERSION }}
          github-ref-name: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  image-build:
    if: |
      always() &&
      github.event_name != 'merge_group' &&
      needs.build.result == 'success' &&
      (needs.quality-scans.result == 'success' || needs.quality-scans.result == 'skipped') &&
      (needs.code-analysis.result == 'success' || needs.code-analysis.result == 'skipped') &&
      (github.event_name != 'push' ||
      github.ref != 'refs/heads/main' ||
      needs.main-deployment-gate.result == 'success')
    needs: [main-deployment-gate, build, quality-scans, code-analysis]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      business-booker-image-tag: ${{ steps.frontend-image.outputs.business-booker-image-tag }}
      ccui-image-tag: ${{ steps.frontend-image.outputs.ccui-image-tag }}
      premier-inn-image-tag: ${{ steps.frontend-image.outputs.premier-inn-image-tag }}
      image-tag: ${{ steps.frontend-image.outputs.image-tag }}
    strategy:
      matrix:
        app-name: [business-booker, ccui, premier-inn]
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.main-deployment-gate.outputs.checkout-sha || github.sha }}

      - name: Build and publish frontend image
        id: frontend-image
        uses: ./.github/frontend/actions/container-image
        with:
          app-name: ${{ matrix.app-name }}
          app-version: ${{ needs.build.outputs[format('{0}-version', matrix.app-name)] }}
          semantic-version: ${{ github.ref == 'refs/heads/main' && needs.main-deployment-gate.outputs.semantic-version || '' }}
          ref-name: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          commit-sha: ${{ needs.main-deployment-gate.outputs.checkout-sha || github.sha }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          aws-role-to-assume: arn:aws:iam::327347623470:role/GitHubActionsECRPushRole
          aws-region: eu-west-1
          push-dockerhub: "true"
          push-ecr: "true"

  release-check:
    name: Release check (${{ matrix.app-name }})
    # always(): see quality-scans; image-build must still have succeeded.
    if: |
      always() &&
      needs.image-build.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.event_name != 'merge_group' &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/heads/hotfix/release') ||
      startsWith(github.ref, 'refs/heads/perf/'))
    needs: [image-build]
    strategy:
      matrix:
        app-name: [business-booker, ccui, premier-inn]
    runs-on: >-
      ${{ format('{0}-default-runner-scale-set',
      github.ref == 'refs/heads/main' && 'dev' ||
      contains(github.ref, 'gh-readonly-queue') && 'dev' ||
      startsWith(github.ref, 'refs/heads/release/') && 'uat' ||
      startsWith(github.ref, 'refs/heads/hotfix/release') && 'demo' ||
      startsWith(github.ref, 'refs/heads/perf/') && 'perf') }}
    timeout-minutes: 30
    env:
      REPO_NAME: ${{ matrix.app-name }}
      SERVICE: ${{ matrix.app-name }}
      NAMESPACE: opera-fe
      CHECK_TIMEOUT: "600"
      IMAGE_TAG: ${{ needs.image-build.outputs[format('{0}-image-tag', matrix.app-name)] }}
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Verify release
        uses: ./.github/actions/release-check
        with:
          app-name: ${{ matrix.app-name }}
          image-tag: ${{ needs.image-build.outputs[format('{0}-image-tag', matrix.app-name)] }}
          namespace: opera-fe
          check-timeout: "600"

  dit-sync:
    name: Update development GitOps tag (${{ matrix.app-name }})
    if: |
      always() &&
      needs.image-build.result == 'success' &&
      needs.release-check.result == 'success' &&
      github.ref_name == 'main'
    needs: [image-build, release-check]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        app-name: [business-booker, ccui, premier-inn]
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Update development GitOps tag
        uses: ./.github/actions/gitops-tag-update
        with:
          app-name: ${{ matrix.app-name }}
          image-tag: ${{ needs.image-build.outputs[format('{0}-image-tag', matrix.app-name)] }}
          github-app-id: ${{ vars.PIPELINE_APP_ID }}
          github-app-private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}

  # smoke-tests:
  #   # run on all branches except PRs
  #   if: |
  #     github.event_name != 'pull_request'
  #   needs: [dit-sync]
  #   uses: ./.github/workflows/ci-fe-smoke-tests.yaml
  #   secrets: inherit
  #   with:
  #     smoke-tests-branch: >-
  #       ${{ github.ref_name == 'main' &&
  #       'master' || 'release' }}
  #     opera-env: >-
  #       ${{ github.ref_name == 'main' && 'dev' ||
  #       contains(github.ref, 'hotfix/release') && 'demo' ||
  #       contains(github.ref, 'release/') && 'uat' ||
  #       contains(github.ref, 'perf/') && 'perf' }}
  #     app-list: "pi ccui bb"
  #     feature-tests-filter: ""
  #     thread-count: 3

  send-workflow-status-to-teams:
    uses: ./.github/workflows/tool-workflow-status-reporter.yaml
    needs: [code-analysis, build, quality-scans, image-build, release-check, dit-sync]
    if: ${{ always() }}
    permissions:
      actions: read
      checks: read
    secrets:
      TEAMS_WEBHOOK: ${{ secrets.MSTEAMS_ERRORS_FE }}
