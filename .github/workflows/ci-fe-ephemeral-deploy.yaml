name: Frontend Ephemeral Deploy (reusable)

# Reusable deploy path for frontend ephemeral environments. Both entry points call this:
#   - ci-fe.yaml (POC-suffix branches on the pull_request pipeline)
#   - ci-fe-ephemeral-comment.yaml (the "Ephemeral UP" comment trigger)
# Callers invoke it with `secrets: inherit`, so no secrets are declared explicitly here.
on:
  workflow_call:
    inputs:
      pr-number:
        description: "PR number; drives the <app>-PR-<n> environment name."
        required: true
        type: string
      branch-name:
        description: "PR head branch; used for Jira/issue derivation and image tagging (ephemeral release naming is PR-number based)."
        required: true
        type: string
      trigger-source:
        description: 'Entry point that invoked this workflow: "pull_request" or "comment".'
        required: true
        type: string
      # Image tags are optional: the pull_request (POC) path already built the images and
      # passes them in (build/image jobs skip); the comment path leaves them empty and this
      # workflow builds them itself.
      business-booker-image-tag:
        description: "Prebuilt business-booker image tag; empty means build here."
        required: false
        type: string
        default: ""
      ccui-image-tag:
        description: "Prebuilt ccui image tag; empty means build here."
        required: false
        type: string
        default: ""
      premier-inn-image-tag:
        description: "Prebuilt premier-inn image tag; empty means build here."
        required: false
        type: string
        default: ""
      checkout-ref:
        description: "Ref to check out (merge ref or head SHA); empty uses the default."
        required: false
        type: string
        default: ""
      base-out-of-sync:
        description: "True when the branch could not be merged with base and is deployed as-is."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

# Serialise every ephemeral deploy for a given PR, regardless of entry point.
# Both callers (ci-fe.yaml's synchronize path and ci-fe-ephemeral-comment.yaml's
# "Ephemeral UP" comment) funnel through this reusable workflow, so keying the group
# on the PR number here is the single place that prevents a comment-triggered deploy
# and a commit-triggered redeploy from racing two Helm upgrades on the same
# <app>-pr-<n> releases. cancel-in-progress: false lets the in-flight deploy finish
# so the last write always reflects the most recently *queued* run.
concurrency:
  group: fe-ephemeral-deploy-pr-${{ inputs.pr-number }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.20.0"

jobs:
  # Self-build path for the comment trigger (task 4.2).
  #
  # Both `build` and `image-build` are gated on `inputs.premier-inn-image-tag == ''`:
  #   - comment path  -> no tags supplied -> these jobs run and produce fresh images
  #   - pull_request (POC) path -> ci-fe.yaml passes prebuilt tags -> both jobs skip
  #
  # Structure mirrors ci-fe.yaml: a single Lerna `build` job produces the per-app
  # artifacts/versions, then the `image-build` matrix downloads each artifact and
  # publishes its image (DockerHub + ECR). The `image-build` job outputs the three
  # per-app image tags that task 4.3 (resolve-tags) consumes.
  #
  # Downstream jobs (resolve-tags, deploy matrix, Jira report) are added in tasks
  # 4.3-4.5.
  build:
    name: Lerna build (frontend apps)
    if: inputs.premier-inn-image-tag == '' && inputs.trigger-source == 'comment'
    runs-on: tooling-fe-runner-scale-set
    defaults:
      run:
        working-directory: frontend/pi-front-end-applications
    outputs:
      business-booker-version: ${{ steps.frontend-build.outputs.business-booker-version }}
      ccui-version: ${{ steps.frontend-build.outputs.ccui-version }}
      premier-inn-version: ${{ steps.frontend-build.outputs.premier-inn-version }}
    steps:
      - name: Validate checkout ref is an immutable commit SHA
        shell: bash
        # Runs before checkout, so it must not inherit the job's working-directory
        # default (frontend/pi-front-end-applications does not exist yet). Run from
        # the workspace root instead, or bash fails to start.
        working-directory: ${{ github.workspace }}
        run: |
          if [[ ! "${{ inputs.checkout-ref }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Unsafe checkout-ref: expected a 40-character commit SHA, got '${{ inputs.checkout-ref }}'" >&2
            exit 1
          fi

      - name: Verify checkout ref matches PR head SHA
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number('${{ inputs.pr-number }}');
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid pr-number input: '${{ inputs.pr-number }}'`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const expectedSha = String(pr.head.sha || '').toLowerCase();
            const providedSha = String('${{ inputs.checkout-ref }}').toLowerCase();
            if (expectedSha !== providedSha) {
              core.setFailed(
                `Unsafe checkout-ref: provided SHA (${providedSha}) does not match PR #${prNumber} head SHA (${expectedSha}).`
              );
            }

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Build, validate, and package with Lerna
        id: frontend-build
        uses: ./.github/frontend/actions/build
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Ephemeral preview build: skip lint/test/typecheck only for existing POC suffixes.
          run-full-validation: ${{ !endsWith(inputs.branch-name, '-Issues-XX') && !endsWith(inputs.branch-name, '-JIRA-XX') }}
          # Ephemeral deploys target dev, matching how ci-fe.yaml derives dev for
          # pull_request / merge refs.
          target-environment: dev

  image-build:
    name: Docker publish (${{ matrix.app-name }})
    if: |
      always() &&
      inputs.premier-inn-image-tag == '' &&
      needs.build.result == 'success'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      business-booker-image-tag: ${{ steps.frontend-image.outputs.business-booker-image-tag }}
      ccui-image-tag: ${{ steps.frontend-image.outputs.ccui-image-tag }}
      premier-inn-image-tag: ${{ steps.frontend-image.outputs.premier-inn-image-tag }}
      image-tag: ${{ steps.frontend-image.outputs.image-tag }}
    strategy:
      matrix:
        app-name: [business-booker, ccui, premier-inn]
    steps:
      - name: Validate checkout ref is an immutable commit SHA
        shell: bash
        run: |
          if [[ ! "${{ inputs.checkout-ref }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Unsafe checkout-ref: expected a 40-character commit SHA, got '${{ inputs.checkout-ref }}'" >&2
            exit 1
          fi

      - name: Checkout ${{ matrix.app-name }} source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Resolve checked-out commit SHA
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and publish ${{ matrix.app-name }} with Docker
        id: frontend-image
        uses: ./.github/frontend/actions/container-image
        with:
          app-name: ${{ matrix.app-name }}
          app-version: ${{ needs.build.outputs[format('{0}-version', matrix.app-name)] }}
          # The checked-out branch (merge ref or head) drives the image tag ref.
          ref-name: ${{ inputs.branch-name }}
          commit-sha: ${{ steps.commit.outputs.sha }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          aws-role-to-assume: arn:aws:iam::327347623470:role/GitHubActionsECRPushRole
          aws-region: eu-west-1
          push-dockerhub: "true"
          push-ecr: "true"
  # Effective image tags per app (task 4.3).
  #
  # This job normalises the two entry points into a single source of tags that the
  # downstream deploy matrix (task 4.4) reads exclusively, so the matrix is identical
  # regardless of how this workflow was invoked:
  #   - pull_request (POC) path -> image-build is skipped; tags arrive via inputs.
  #   - comment path            -> inputs are empty; tags come from image-build outputs.
  #
  # `needs: [image-build]` with `if: always()` lets this run even when image-build was
  # skipped (POC path). The guard rejects only a genuine image-build failure; 'skipped'
  # and 'success' both proceed. Per app the expression prefers the passed-in input and
  # falls back to the matching image-build output.
  resolve-tags:
    name: Resolve effective image tags
    # Only proceed when tags were passed in (POC path) OR image-build actually
    # succeeded (comment path). If the comment-path build fails, image-build is SKIPPED
    # (not failed/cancelled), so a `!= 'failure' && != 'cancelled'` guard would still
    # pass and resolve EMPTY tags into the deploy matrix. Requiring an explicit success
    # (or a passed-in POC tag) prevents that.
    if: |
      always() &&
      (inputs.premier-inn-image-tag != '' || needs.image-build.result == 'success')
    needs: [image-build]
    runs-on: ubuntu-slim
    outputs:
      business-booker-image-tag: ${{ inputs.business-booker-image-tag != '' && inputs.business-booker-image-tag || needs.image-build.outputs.business-booker-image-tag }}
      ccui-image-tag: ${{ inputs.ccui-image-tag != '' && inputs.ccui-image-tag || needs.image-build.outputs.ccui-image-tag }}
      premier-inn-image-tag: ${{ inputs.premier-inn-image-tag != '' && inputs.premier-inn-image-tag || needs.image-build.outputs.premier-inn-image-tag }}
    steps:
      - name: Verify resolved image tags are non-empty
        shell: bash
        env:
          BUSINESS_BOOKER_TAG: ${{ inputs.business-booker-image-tag != '' && inputs.business-booker-image-tag || needs.image-build.outputs.business-booker-image-tag }}
          CCUI_TAG: ${{ inputs.ccui-image-tag != '' && inputs.ccui-image-tag || needs.image-build.outputs.ccui-image-tag }}
          PREMIER_INN_TAG: ${{ inputs.premier-inn-image-tag != '' && inputs.premier-inn-image-tag || needs.image-build.outputs.premier-inn-image-tag }}
        run: |
          set -euo pipefail
          missing=0
          for pair in "business-booker=${BUSINESS_BOOKER_TAG}" "ccui=${CCUI_TAG}" "premier-inn=${PREMIER_INN_TAG}"; do
            app="${pair%%=*}"; tag="${pair#*=}"
            if [[ -z "$tag" ]]; then echo "::error::Empty image tag resolved for ${app}"; missing=1; fi
          done
          [[ "$missing" -eq 0 ]] || exit 1

      - name: Report resolved image tags
        shell: bash
        env:
          BUSINESS_BOOKER_TAG: ${{ inputs.business-booker-image-tag != '' && inputs.business-booker-image-tag || needs.image-build.outputs.business-booker-image-tag }}
          CCUI_TAG: ${{ inputs.ccui-image-tag != '' && inputs.ccui-image-tag || needs.image-build.outputs.ccui-image-tag }}
          PREMIER_INN_TAG: ${{ inputs.premier-inn-image-tag != '' && inputs.premier-inn-image-tag || needs.image-build.outputs.premier-inn-image-tag }}
        run: |
          echo "business-booker: ${BUSINESS_BOOKER_TAG}"
          echo "ccui: ${CCUI_TAG}"
          echo "premier-inn: ${PREMIER_INN_TAG}"

  # Per-app Helm deploy matrix (task 4.4), moved verbatim from ci-fe.yaml's
  # `deploy-frontend-ephemeral` job. The only adaptations are input references so the
  # matrix is identical for both entry points:
  #   - image tags come from `resolve-tags` (never a local image-build job)
  #   - branch-name / pr-number / checkout-ref come from workflow_call inputs
  #   - the PR-URL and linked-issue comments target `inputs.pr-number` via the API
  #     rather than `context.payload.pull_request`, which is absent on the comment path
  #
  # Entry-point gating (event type, base ref, POC suffix, comment authorisation) is done
  # by the callers; here the job simply runs once resolve-tags has produced tags.
  deploy:
    name: Helm ephemeral deploy (${{ matrix.app-name }})
    if: |
      always() &&
      needs.resolve-tags.result == 'success'
    needs: [resolve-tags]
    strategy:
      fail-fast: false
      matrix:
        app-name: [business-booker, ccui, premier-inn]
    runs-on: dev-default-runner-scale-set
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # Needed for the comment path to register a PR-head-bound GitHub Deployment.
      deployments: write
    environment:
      name: ${{ matrix.app-name }}-PR-${{ inputs.pr-number }}
      url: https://${{ steps.deployment-identity.outputs.host-name }}
    steps:
      - name: Checkout ${{ matrix.app-name }} source
        uses: actions/checkout@v7
        with:
          # The comment path passes the immutable PR head SHA (TOCTOU-safe); the pull_request
          # path falls back to the caller SHA for the default merge ref.
          ref: ${{ inputs.checkout-ref != '' && inputs.checkout-ref || github.sha }}
      - name: Derive Kubernetes names for ${{ matrix.app-name }}
        id: deployment-identity
        uses: ./.github/frontend/actions/deployment-identity
        with:
          branch-name: ${{ inputs.branch-name }}
          app-name: ${{ matrix.app-name }}
          pr-number: ${{ inputs.pr-number }}

      - name: Install Helm for ${{ matrix.app-name }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Clear stale Helm state for ${{ matrix.app-name }}
        env:
          RELEASE_NAME: ${{ steps.deployment-identity.outputs.release-name }}
          NAMESPACE: opera-fe
          CI_SCRIPT_ROOT: ${{ github.workspace }}/.github/frontend/scripts
        run: bash "$CI_SCRIPT_ROOT/deploy/clear-stale-helm-op.sh"

      - name: Deploy ${{ matrix.app-name }} with Helm
        env:
          APP_NAME: ${{ matrix.app-name }}
          RELEASE_NAME: ${{ steps.deployment-identity.outputs.release-name }}
          HOST_NAME: ${{ steps.deployment-identity.outputs.host-name }}
          CHART_PATH: ${{ steps.deployment-identity.outputs.chart-path }}
          VALUES_PATH: ${{ steps.deployment-identity.outputs.values-path }}
          IMAGE_REPO: ${{ steps.deployment-identity.outputs.image-repo }}
          IMAGE_TAG: ${{ needs.resolve-tags.outputs[format('{0}-image-tag', matrix.app-name)] }}
          CI_SCRIPT_ROOT: ${{ github.workspace }}/.github/frontend/scripts
        run: bash "$CI_SCRIPT_ROOT/deploy/helm-deploy.sh"

      - name: Register PR-scoped deployment for ${{ matrix.app-name }}
        # Comment-triggered runs are issue_comment events, which execute on
        # refs/heads/main — so the job's `environment:` auto-deployment binds to main and
        # never appears in the PR's Deployments box. Explicitly create a deployment bound
        # to the PR head SHA (inputs.checkout-ref) so it links to the PR. The POC
        # pull_request path already binds correctly via `environment:`, so this is
        # comment-path only to avoid duplicate deployments.
        if: ${{ inputs.trigger-source == 'comment' && inputs.checkout-ref != '' }}
        env:
          APP_NAME: ${{ matrix.app-name }}
          PR_NUMBER: ${{ inputs.pr-number }}
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          HOST_NAME: ${{ steps.deployment-identity.outputs.host-name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_SCRIPT_ROOT: ${{ github.workspace }}/.github/frontend/scripts
        run: bash "$CI_SCRIPT_ROOT/deploy/register-pr-deployment.sh"

      - name: Post ${{ matrix.app-name }} URL to PR
        if: ${{ !endsWith(inputs.branch-name, '-JIRA-XX') }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = Number('${{ inputs.pr-number }}');
            if (!issueNumber) {
              core.info('No PR number supplied; skipping deploy PR comment.');
              return;
            }

            const appName = '${{ matrix.app-name }}';
            const host = '${{ steps.deployment-identity.outputs.host-name }}';
            const body = `Changes for ${appName} have been deployed to https://${host} . Try this in AVD.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

      - name: Post ${{ matrix.app-name }} verification to issue
        if: ${{ steps.deployment-identity.outputs.issue-number != '' }}
        env:
          ISSUE_NUMBER: ${{ steps.deployment-identity.outputs.issue-number }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_SCRIPT_ROOT: ${{ github.workspace }}/.github/frontend/scripts
        run: bash "$CI_SCRIPT_ROOT/notifications/post-issue-verification.sh"

  # Jira deployment report (task 4.5), moved verbatim from ci-fe.yaml's
  # `report-ephemeral-deployment-jira` job. It posts a deployment comment to the linked
  # Jira issue for `-JIRA-XX` branches, from either entry point.
  #
  # Adaptations from the ci-fe.yaml version:
  #   - `needs: [deploy]` (the deploy matrix job in this reusable workflow) instead of
  #     `deploy-frontend-ephemeral`.
  #   - The gate drops `github.event_name == 'pull_request'` because this reusable
  #     workflow is invoked from both entry points; `inputs.branch-name` ending in
  #     `-JIRA-XX` is the correct, source-agnostic gate.
  #   - `BRANCH_NAME`/`PR_NUMBER` come from `inputs.branch-name`/`inputs.pr-number`
  #     rather than `github.head_ref`/`github.event.pull_request.number`, which are
  #     absent on the comment path.
  #   - The checkout uses no `ref`. The ci-fe.yaml version pinned
  #     `github.event.pull_request.base.sha` to run trusted (base-branch) notification
  #     code, but there is no `github.event.pull_request` on the comment path. For a
  #     reusable workflow invoked as `./.github/workflows/...`, a ref-less checkout
  #     resolves to the same trusted repository ref the caller runs at (the PR base for
  #     the pull_request path, the default branch for the comment path) — never the
  #     untrusted PR head. `inputs.checkout-ref` is deliberately NOT used here because it
  #     carries the untrusted head/merge ref used for building, not for running scripts.
  #     `persist-credentials: false` keeps the checkout token out of the workspace.
  report-ephemeral-deployment-jira:
    name: Jira deployment report (frontend apps)
    if: |
      always() &&
      needs.deploy.result != 'skipped' &&
      endsWith(inputs.branch-name, '-JIRA-XX')
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted notification code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trigger-source == 'pull_request' && github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Create GitHub token to read PR
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Post frontend deployment to Jira
        continue-on-error: true
        env:
          JIRA_DOMAIN: whitbreadis.atlassian.net
          EMAIL: iyyappan.murugan@whitbread.com
          API_TOKEN: ${{ secrets.JIRA_KIRO_INTEGRATION }}
          BRANCH_NAME: ${{ inputs.branch-name }}
          PR_NUMBER: ${{ inputs.pr-number }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          REPO: ${{ github.repository }}
          CI_SCRIPT_ROOT: ${{ github.workspace }}/.github/frontend/scripts
        run: bash "$CI_SCRIPT_ROOT/notifications/jira-pr-deployed-comment.sh"

  # Mark the PR so later commits redeploy automatically (task: redeploy-on-commit).
  #
  # Once a PR has an ephemeral environment — created via either entry point (the POC
  # `pull_request` gate or the "Ephemeral UP" comment) — every subsequent commit should
  # redeploy the latest code. ci-fe.yaml's `gate-ephemeral` keys that decision off this
  # label: a pushed commit re-runs the pull_request pipeline, sees the label, and
  # redeploys through this same workflow (a Helm `upgrade --install` over the existing
  # `<app>-pr-<n>` release, so it stays one environment, not a duplicate).
  #
  # The label is added whenever a deploy was attempted (success or partial failure both
  # leave an environment/release behind for the PR). Skipped/cancelled deploys leave
  # nothing, so they add no label. Cleanup on PR close removes the environments; the
  # label is irrelevant once the PR is closed.
  mark-pr-ephemeral:
    name: Mark PR as having an ephemeral environment
    if: |
      always() &&
      needs.deploy.result != 'skipped' &&
      needs.deploy.result != 'cancelled'
    needs: [deploy]
    runs-on: ubuntu-slim
    permissions:
      # contents: read lets the sparse checkout below fetch the scripts dir.
      # issues: write is needed to create the repo label on first use; pull-requests:
      # write is needed to *apply* the label, because the target number is a PR and the
      # /issues/{n}/labels endpoint requires the pull-requests scope for PRs (issues:
      # write alone returns 403 "Resource not accessible by integration").
      contents: read
      issues: write
      pull-requests: write
    steps:
      # This standalone job has no source checkout of its own, so sparse-checkout only
      # the scripts directory to make mark-pr-ephemeral.sh available to the run step below.
      # Cone-mode sparse checkout keeps this cheap (no full monorepo). Same ref logic as
      # the deploy job so the script is present on both entry points regardless of merge
      # state; persist-credentials:false since the script authenticates via GH_TOKEN.
      - name: Checkout ephemeral scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref != '' && inputs.checkout-ref || github.sha }}
          sparse-checkout: .github/frontend/scripts
          persist-credentials: false

      - name: Add ephemeral-active label to the PR
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_SCRIPT_ROOT: ${{ github.workspace }}/.github/frontend/scripts
        run: bash "$CI_SCRIPT_ROOT/deploy/mark-pr-ephemeral.sh"
