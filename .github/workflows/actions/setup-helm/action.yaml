name: 'Setup Helm Environment'
description: 'Install and configure Helm with dependencies'
inputs:
  chart-path:
    description: 'Path to the Helm chart (e.g., infra/temporal)'
    required: true
  install-aws-cli:
    description: 'Whether to install AWS CLI'
    required: false
    default: 'false'
  helm-version:
    description: 'Helm version to install'
    required: false
    default: '3.12.0'

runs:
  using: "composite"
  steps:
    - name: Install AWS CLI
      if: ${{ inputs.install-aws-cli == 'true' }}
      shell: bash
      run: |
        if ! command -v aws &> /dev/null; then
          echo "Installing AWS CLI..."
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install
        else
          echo "AWS CLI already installed"
        fi

    - name: Install Helm
      uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
      with:
        version: ${{ inputs.helm-version }}

    - name: Add Helm repositories
      shell: bash
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo add temporalio https://go.temporal.io/helm-charts
        helm repo update

    - name: Build dependencies
      shell: bash
      run: |
        cd ${{ inputs.chart-path }}
        helm dependency build
