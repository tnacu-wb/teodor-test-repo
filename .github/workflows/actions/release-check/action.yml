name: Verify deployed release
description: Monitor a Flagger canary or Flux HelmRelease until the requested image is live.

inputs:
  app-name:
    description: Application and Kubernetes resource name.
    required: true
  image-tag:
    description: Image tag expected in the deployed HelmRelease.
    required: true
  namespace:
    description: Kubernetes namespace containing the release.
    required: true
  check-timeout:
    description: Maximum HelmRelease polling time in seconds.
    required: false
    default: "600"

runs:
  using: composite
  steps:
    - name: Install kubectl
      shell: bash
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/

    - name: Check for Canary deployment
      id: canary
      shell: bash
      env:
        SERVICE: ${{ inputs.app-name }}
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        status=0
        kubectl get canary --no-headers -n "$NAMESPACE" "$SERVICE" || status=$?
        if [[ $status -ne 0 ]]; then
          echo "This application does not have a Canary deployment"
          echo "exists=false" >> "$GITHUB_OUTPUT"
        else
          echo "This application has a Canary deployment"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Monitor Canary deployment
      if: ${{ steps.canary.outputs.exists == 'true' }}
      shell: bash
      env:
        SERVICE: ${{ inputs.app-name }}
        NAMESPACE: ${{ inputs.namespace }}
      run: bash "$GITHUB_ACTION_PATH/monitor-canary.sh"

    - name: Install Flux CLI
      if: ${{ steps.canary.outputs.exists == 'false' }}
      shell: bash
      run: curl -s https://fluxcd.io/install.sh | sudo bash

    - name: Initial wait
      if: ${{ steps.canary.outputs.exists == 'false' }}
      shell: bash
      run: sleep 10

    - name: Monitor HelmRelease status
      if: ${{ steps.canary.outputs.exists == 'false' }}
      shell: bash
      env:
        REPO_NAME: ${{ inputs.app-name }}
        NAMESPACE: ${{ inputs.namespace }}
        CHECK_TIMEOUT: ${{ inputs.check-timeout }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: bash "$GITHUB_ACTION_PATH/monitor-helmrelease.sh"
