name: Cleanup Ephemeral Environments

# Manual sweep of the per-pull-request Helm releases in the dev cluster.
#
# All logic lives in .github/workflows/cleanup/ — see that directory's README for the
# naming convention and why the workflow file itself cannot sit alongside it (GitHub
# Actions ignores subdirectories of .github/workflows/).

on:
  workflow_dispatch:
    inputs:
      namespaces:
        description: Namespaces to sweep (comma separated)
        required: false
        type: string
        default: opera-be,opera-fe
      # A dropdown rather than a checkbox so choosing "no" is an explicit act; the script
      # treats true/yes and false/no as equivalent, for API and `gh workflow run` callers.
      dry-run:
        description: List what would be removed without uninstalling anything
        required: false
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'yes'
          - 'false'
          - 'no'
      skip-open-prs:
        description: Keep releases belonging to a pull request that is still open
        required: false
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'no'
          - 'true'
          - 'yes'
      release-filter:
        description: 'Optional extended regex to narrow the sweep (e.g. ^basket-service-)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cleanup-ephemeral-envs
  cancel-in-progress: false

env:
  HELM_DRIVER: configmap  ###

jobs:
  sweep:
    name: Sweep ephemeral Helm releases (dev)
    runs-on: dev-default-runner-scale-set
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      - name: Set up Helm
        uses: azure/setup-helm@v5

      # Needed for orphaned deployment diagnostic.
      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      # Only needed to protect live previews; the sweep reconstructs both release-name
      # forms from the open PRs so frontend branch-named releases are covered too.
      - name: Resolve open pull requests
        id: open-prs
        # Compared explicitly: a choice input is a string, and the string 'false' is truthy.
        if: ${{ inputs.skip-open-prs == 'true' || inputs.skip-open-prs == 'yes' }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const open = prs.map(pr => ({ number: pr.number, branch: pr.head.ref }));
            core.info(`Protecting ${open.length} open pull request(s).`);
            core.setOutput('open-prs', JSON.stringify(open));

      - name: Sweep ephemeral releases
        env:
          NAMESPACES: ${{ inputs.namespaces }}
          DRY_RUN: ${{ inputs.dry-run }}
          SKIP_OPEN_PRS: ${{ inputs.skip-open-prs }}
          RELEASE_FILTER: ${{ inputs.release-filter }}
          OPEN_PRS: ${{ steps.open-prs.outputs.open-prs || '[]' }}
        run: bash .github/workflows/cleanup/sweep-ephemeral-releases.sh
