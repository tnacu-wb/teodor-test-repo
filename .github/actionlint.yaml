self-hosted-runner:
  labels:
    - dev-default-runner-scale-set
    - tooling-default-runner-scale-set
    - tooling-fe-runner-scale-set

paths:
  .github/workflows/ci-fe.yaml:
    ignore:
      # actions/create-github-app-token@v3 now prefers client-id and keeps app-id
      # only as a deprecated fallback. Actionlint v1.7.12 bundles the older v3
      # metadata, so these two diagnostics are stale. The frontend structure
      # test enforces the current client-id interface explicitly.
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'
  .github/workflows/ci-fe-deploy.yaml:
    ignore:
      # The DIT sync job is intentionally retained as a disabled re-enable switch.
      - 'constant expression "false" in condition'
