name: Prisma container image scan
description: Scan an image, parse the report, and optionally comment on a pull request.

inputs:
  image-name:
    description: Fully qualified local image name to scan.
    required: true
  prisma-user:
    description: Prisma Cloud access key ID.
    required: true
  prisma-password:
    description: Prisma Cloud secret key.
    required: true
  github-token:
    description: Token used for the optional pull-request comment.
    required: false
    default: ""
  post-pr-comment:
    description: Whether to post scan results to the current pull request.
    required: false
    default: "false"
  continue-on-error:
    description: Whether a failed Prisma scan should be tolerated.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Prisma image check
      uses: PaloAltoNetworks/prisma-cloud-scan@411e7888936bb6fcce6fb0f94abb13d45b6f2674 # v1.9.0
      continue-on-error: ${{ inputs.continue-on-error == 'true' }}
      with:
        pcc_console_url: https://europe-west3.cloud.twistlock.com/eu-103255
        pcc_user: ${{ inputs.prisma-user }}
        pcc_pass: ${{ inputs.prisma-password }}
        image_name: ${{ inputs.image-name }}

    - name: Parse Prisma image scan results
      if: ${{ always() }}
      id: results
      shell: bash
      run: |
        v1=$(jq -r '("Vulnerabilities found for image **" + .results[].name + "**: total - **" + (.results[].vulnerabilityDistribution.total | tostring) + "**: critical - **" + (.results[].vulnerabilityDistribution.critical|tostring) + "**: high - **" + (.results[].vulnerabilityDistribution.high|tostring) + "**: medium - **"+ (.results[].vulnerabilityDistribution.medium|tostring) + "**: low - **"+ (.results[].vulnerabilityDistribution.low|tostring) +"**")' pcc_scan_results.json)
        echo "v1=$v1" >> "$GITHUB_OUTPUT"
        v2=$(jq -r '("Vulnerability threshold check results: **" + (if (.results[].vulnerabilityScanPassed) == true then "PASSED" else "FAILED" end) +"**")' pcc_scan_results.json)
        echo "v2=$v2" >> "$GITHUB_OUTPUT"

    - name: Post Prisma image scan result on PR
      if: ${{ always() && inputs.post-pr-comment == 'true' }}
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const output = `### Prisma Cloud Compute image scan results obtained during build process:
          ${{ steps.results.outputs.v1 }}
          ${{ steps.results.outputs.v2 }}
          For detailed information over these results, please go to [Workflow Execution - Prisma Image scan job](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) `;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          });
