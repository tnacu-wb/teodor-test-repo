name: Frontend deployment identity
description: Derive stable preview deployment names from explicit frontend inputs.

inputs:
  branch-name:
    description: Pull request source branch.
    required: true
  app-name:
    description: Frontend application name.
    required: false
    default: ""
  pr-number:
    description: Pull request number.
    required: false
    default: "0"
  values-variant:
    description: Which values file to deploy — ephemeral (per-PR preview) or dev.
    required: false
    default: ephemeral

outputs:
  app-name:
    description: Validated frontend application name.
    value: ${{ steps.identity.outputs.app-name }}
  pr-number:
    description: Normalized pull-request number.
    value: ${{ steps.identity.outputs.pr-number }}
  release-name:
    description: Helm release name for the preview.
    value: ${{ steps.identity.outputs.release-name }}
  host-name:
    description: Preview hostname for the application.
    value: ${{ steps.identity.outputs.host-name }}
  chart-path:
    description: Repository-relative path to the shared Helm chart.
    value: ${{ steps.identity.outputs.chart-path }}
  values-path:
    description: Repository-relative path to the application values file.
    value: ${{ steps.identity.outputs.values-path }}
  values-variant:
    description: Values variant the values-path resolves to.
    value: ${{ steps.identity.outputs.values-variant }}
  image-repo:
    description: Docker image repository for the application.
    value: ${{ steps.identity.outputs.image-repo }}
  environment-name:
    description: GitHub environment name for the preview.
    value: ${{ steps.identity.outputs.environment-name }}
  sanitized-branch:
    description: Branch name normalized for Kubernetes and DNS identifiers.
    value: ${{ steps.identity.outputs.sanitized-branch }}
  issue-number:
    description: Linked GitHub issue number derived from an Issues-XX branch.
    value: ${{ steps.identity.outputs.issue-number }}
  jira-key:
    description: Jira issue key derived from a JIRA-XX branch.
    value: ${{ steps.identity.outputs.jira-key }}

runs:
  using: composite
  steps:
    - name: Derive deployment identity
      id: identity
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch-name }}
        APP_NAME: ${{ inputs.app-name }}
        PR_NUMBER: ${{ inputs.pr-number }}
        VALUES_VARIANT: ${{ inputs.values-variant }}
      run: bash "$GITHUB_ACTION_PATH/identity.sh"
