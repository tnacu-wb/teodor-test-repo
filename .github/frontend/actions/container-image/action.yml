name: Prepare frontend container image
description: Download an application artifact, authenticate registries, and build or publish its image.

inputs:
  app-name:
    description: Frontend application name.
    required: true
  app-version:
    description: Application version prefix for the image tag.
    required: true
  semantic-version:
    description: Optional repo-wide X.Y.Z tag for a production main deployment build.
    required: false
    default: ""
  ref-name:
    description: Explicit ref value used in the image tag.
    required: true
  commit-sha:
    description: Commit SHA used in the image tag.
    required: true
  dockerhub-username:
    description: Docker Hub username.
    required: true
  dockerhub-token:
    description: Docker Hub access token.
    required: true
  aws-role-to-assume:
    description: AWS role used for ECR authentication.
    required: true
  aws-region:
    description: AWS region containing the ECR registry.
    required: true
  push-dockerhub:
    description: Whether to publish the built image to Docker Hub.
    required: false
    default: "false"
  push-ecr:
    description: Whether to publish the built image to ECR.
    required: false
    default: "false"

outputs:
  business-booker-image-tag:
    description: Image tag when the current matrix application is business-booker.
    value: ${{ steps.export-tag.outputs.business-booker-image-tag }}
  ccui-image-tag:
    description: Image tag when the current matrix application is ccui.
    value: ${{ steps.export-tag.outputs.ccui-image-tag }}
  premier-inn-image-tag:
    description: Image tag when the current matrix application is premier-inn.
    value: ${{ steps.export-tag.outputs.premier-inn-image-tag }}
  image-tag:
    description: Image tag for the current matrix application.
    value: ${{ steps.build.outputs.image-tag }}

runs:
  using: composite
  steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.app-name }}

    - name: Extract frontend artifacts
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        APP_NAME: ${{ inputs.app-name }}
      run: tar -xf "$APP_NAME.tar"

    - name: Exec permissions for Premier Inn
      if: ${{ inputs.app-name == 'premier-inn' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: chmod +x apps/next-apps/premier-inn/public/firebase-messaging-sw.js

    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        role-session-name: GitHub_to_AWS_via_FederatedOIDC
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    - name: Build and publish Docker image
      id: build
      uses: ./.github/frontend/actions/image-build-push
      with:
        app-name: ${{ inputs.app-name }}
        app-version: ${{ inputs.app-version }}
        semantic-version: ${{ inputs.semantic-version }}
        ref-name: ${{ inputs.ref-name }}
        commit-sha: ${{ inputs.commit-sha }}
        ecr-registry: ${{ steps.login-ecr.outputs.registry }}
        push-dockerhub: ${{ inputs.push-dockerhub }}
        push-ecr: ${{ inputs.push-ecr }}

    - name: Export application image tag
      id: export-tag
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        IMAGE_TAG: ${{ steps.build.outputs.image-tag }}
      run: printf '%s-image-tag=%s\n' "$APP_NAME" "$IMAGE_TAG" >> "$GITHUB_OUTPUT"
