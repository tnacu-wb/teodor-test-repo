name: Analyze frontend code
description: Run repository-level Checkov analysis for frontend applications.

inputs:
  branch-name:
    description: Explicit branch name reported to Checkov.
    required: true
  repository:
    description: Explicit repository identifier reported to Checkov.
    required: true
  prisma-code-analysis-access-key-id:
    description: Prisma Cloud code-analysis access key.
    required: true
  prisma-code-analysis-secret-key:
    description: Prisma Cloud code-analysis secret key.
    required: true

runs:
  using: composite
  steps:
    - name: Test deployment identity
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../deployment-identity/identity.test.sh"

    - name: Test deployment identity naming determinism
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../deployment-identity/identity-determinism.test.sh"

    - name: Test frontend image tags
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../image-build-push/image-tag.test.sh"

    - name: Test frontend release-check workflow
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/release-check.test.sh"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Install Checkov
      shell: bash
      working-directory: frontend/pi-front-end-applications
      run: pip install checkov

    - name: Run Checkov CLI
      shell: bash
      working-directory: frontend/pi-front-end-applications
      env:
        PRISMA_API_URL: https://api.eu.prismacloud.io
        BC_API_KEY: ${{ inputs.prisma-code-analysis-access-key-id }}::${{ inputs.prisma-code-analysis-secret-key }}
        CHECKOV_BRANCH: ${{ inputs.branch-name }}
        CHECKOV_REPOSITORY: ${{ inputs.repository }}
      run: |
        checkov -d . \
          --repo-id "$CHECKOV_REPOSITORY" \
          --branch "$CHECKOV_BRANCH" \
          --prisma-api-url "$PRISMA_API_URL" \
          --bc-api-key "$BC_API_KEY" \
          --use-enforcement-rules \
          --output cli
