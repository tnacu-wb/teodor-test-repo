# ── Networking ───────────────────────────────────────────────────────────────
service:
  create: true
  name: premier-inn
  type: ClusterIP
  ports:
    - name: port3002
      port: 3002
      protocol: TCP
      targetPort: 3002
autoscaling:
  create: true
  maxReplicas: 40
  minReplicas: 1
  scaleDownStabilizationSeconds: 300
  scaleUpStabilizationSeconds: 120
  targetCPUUtilizationPercentage: 80

# istio.host stays empty for a long-lived release: the VirtualService claims
# hosts ["*"] on its gateway and picks this app out by path. Only per-PR
# releases set a host (see ephemeral-values.yaml).
istio:
  create: true
  gateway: pi
  prefix: /
  host: ''
