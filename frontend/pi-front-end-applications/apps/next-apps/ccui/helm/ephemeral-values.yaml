# Ephemeral (per-PR) values for ccui.
#
# Consumed by the pr-deploy job in .github/workflows/ci-fe.yaml through
# .github/frontend/scripts/deploy/helm-deploy.sh, which installs the shared
# chart at infra/helm/opera-app-chart.
#
# That chart reads the whole pod spec from `deployment.*` and gates every
# optional resource on a `create` flag. Keys outside those names are silently
# ignored — an unset `deployment.containerEnvs` renders `env: null` and the app
# boots with no environment at all, falling back to its build-time defaults.
#
# Self-contained: this is the ONLY values file the preview deploy passes. It is
# not layered on top of dev-values.yaml, so a dev tuning change cannot silently
# alter PR environments, and vice versa.
#
# Replaced per-deploy by helm-deploy.sh:
#   applicationName, service.name   the PR release name
#   istio.host                      the PR release hostname
#   image.repository, image.tag

# ── Ephemeral switches ───────────────────────────────────────────────────────

# Gates the Flagger Canary out of the chart. Once a Canary exists Flagger owns
# the Service's .spec.selector and .spec.ports[].name and the VirtualService's
# .spec.http, and Helm's server-side apply then fails on the next upgrade of
# the same release with:
#   conflicts with "flagger" using v1: .spec.selector
# A canary analysis also cannot finish inside the lifetime of a PR release.
ephemeral: true
canary:
  create: false

# An HPA competing with a redeploy on every push is churn and cost with no
# benefit. The frontend-app chart carried `autoscaling.enabled: true` but had no
# HPA template at all, so previews have always run on a single replica; this
# keeps that and makes it explicit.
autoscaling:
  create: false

# Nothing should auto-bump the image; the pipeline sets the tag on every deploy.
imageAutomation:
  create: false

# A disruption budget over a single short-lived replica just blocks node drains.
pdb:
  create: false

# ── Identity ─────────────────────────────────────────────────────────────────
# applicationName names the Deployment, Service, VirtualService and HPA, and is
# the selector label. service.name is what the VirtualService routes at — the
# chart does not derive one from the other, so both are replaced with the
# release name at deploy time and both are kept here so `helm template` renders
# standalone for local inspection.
applicationName: ccui
namespace: opera-fe

# Repository and tag are both set by the workflow; the values here only
# document the shape.
image:
  repository: whitbreaddigital/ccui
  pullPolicy: Always
  tag: 1.0.0

# ── Workload ─────────────────────────────────────────────────────────────────
#
# `lifecycle: null` removes the chart's default 20s preStop sleep rather than
# merging with it (an empty map would leave the default in place). That sleep
# and the chart's 90s grace period are right for draining production traffic
# behind Istio, but together they add roughly two minutes to every push here.
# 30s is the Kubernetes default and what previews ran with before.
imagePullSecrets:
  - name: regcred
deployment:
  create: true
  checksumValues: r1
  replicaCount: 1
  lifecycle: null
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsNonRoot: true
    runAsUser: 9001
    runAsGroup: 9001
    fsGroup: 9001
    seccompProfile:
      type: RuntimeDefault
  containerPorts:
    - name: http
      containerPort: 3002
      protocol: TCP
  dns:
    ndots: 3
  containerEnvs:
    - name: AUTH0_SESSION_ROLLING
      value: 'true'
    - name: AUTH0_SESSION_ROLLING_DURATION
      value: '7200'
    - name: NEXT_PUBLIC_GRAPHQL_ENDPOINT
      value: https://api.dev.premierinn.digital/graphql
    - name: NEXT_PUBLIC_SERVER_APOLLO_GRAPHQL_ENDPOINT
      value: http://opera-apollo-router.apollo
    # Auth0 redirects back to whatever this says, so it has to be the preview's
    # own hostname rather than a fixed one. The chart renders containerEnvs
    # through `tpl`, so this resolves against istio.host, which helm-deploy.sh
    # sets to the release hostname. The frontend-app chart did the same job with
    # a `container.auth0BaseUrl` value and an `if APP_NAME == ccui` branch in
    # helm-deploy.sh; both are gone.
    - name: AUTH0_BASE_URL
      value: https://{{ .Values.istio.host }}
    - name: AUTH0_ISSUER_BASE_URL
      value: https://dev-whitbread-digital.eu.auth0.com
    - name: AUTH0_DOMAIN
      value: dev-whitbread-digital.eu.auth0.com
    - name: ECKOH_IFRAME_SRC
      value: https://premierinniframe.vt.uat.eckoh.uk/
    - name: ECKOH_ENV
      value: ccui_qa
    - name: ECKOH_PROD
      value: 'false'
    - name: ECKOH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          key: eckoh_client_id
          name: eckoh-client-id
    - name: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
      valueFrom:
        secretKeyRef:
          key: google-maps-api-key
          name: google-maps-api-key
    - name: AUTH0_SECRET
      valueFrom:
        secretKeyRef:
          key: auth0_ccui_secret
          name: auth0-k8s-connection-secrets
    - name: AUTH0_CLIENT_ID
      valueFrom:
        secretKeyRef:
          key: auth0_ccui_client_id
          name: auth0-k8s-connection-secrets
    - name: AUTH0_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          key: auth0_ccui_client_secret
          name: auth0-k8s-connection-secrets
    - name: NEXT_PUBLIC_ASSETS_URL
      value: www.dev.premierinn.digital
    - name: NEXT_PUBLIC_REST_API
      value: https://restapi.dev.premierinn.digital
    - name: NEXT_PUBLIC_REST_API_NEW_EKS
      value: https://restapi.dev.premierinn.digital
    - name: NEXT_PUBLIC_SNOWDROP_BASE_URL
      value: https://www.dev.premierinn.digital/api/
    - name: NEXT_BASIC_AUTH_ID
      value: betatester
    - name: NEXT_BASIC_AUTH_PASSWORD
      valueFrom:
        secretKeyRef:
          key: basic_auth_pwd
          name: wb-fe-credential
    - name: NEXT_FS_MEAL_RESTRICTIONS
      value: 'false'
    - name: NEXT_FS_DISPLAY_GUEST_ACCOUNT
      value: 'true'
    - name: NEXT_FS_ENABLE_SEARCH_ACCOUNT_SAVE_CHANGES
      value: 'true'
    - name: NEXT_FS_SILENT_SUBSTITUTION
      value: 'true'
    - name: NEXT_ENABLE_SERVER_APOLLO_GRAPHQL_ENDPOINT
      value: 'true'
    - name: NEXT_FS_CONFIRM_EMAIL_ADDRESS_CCUI
      value: 'false'
    - name: NEXT_ENV
      value: dev
    - name: NEXT_PUBLIC_UNLEASH_SERVER_API_URL
      value: https://whitbread.edge.getunleash.io/api
    - name: NEXT_PUBLIC_APP_NAME
      value: ccui
    - name: UNLEASH_SERVER_API_TOKEN
      valueFrom:
        secretKeyRef:
          key: api-token
          name: unleash-enterprise-secrets
    - name: NEXT_PUBLIC_UNLEASH_FRONTEND_API_TOKEN
      valueFrom:
        secretKeyRef:
          key: api-fe-token
          name: unleash-enterprise-secrets
    - name: NEXT_PUBLIC_LOG_ENDPOINT
      value: /api/log
    - name: NEXT_FS_SHOW_AMEND_PAYMENT_PAGE
      value: 'true'
    - name: NEXT_APP_STATIC_CONTENT_CACHE_TTL
      value: '3600'
    - name: NEXT_OPENSEARCH_LOGS
      value: 'false'
    - name: NEXT_APP_UNLEASH_DEFINITIONS_CACHE_TTL
      value: '60'
    - name: NEXT_APP_UNLEASH_DEFINITIONS_FETCH_TIMEOUT
      value: '2'
    - name: NEXT_FS_ENABLE_SCRIPTS_EMBED_APP_DYNAMICS
      value: 'true'
    - name: NEXT_PUBLIC_REDIS_HOST
      value: clustercfg.opera-dev.jynzd4.memorydb.eu-west-1.amazonaws.com
    - name: NEXT_PUBLIC_REDIS_PORT
      value: '6379'
  livenessProbe:
    failureThreshold: 6
    httpGet:
      path: /api/liveness
      port: 3002
    initialDelaySeconds: 90
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  readinessProbe:
    failureThreshold: 6
    httpGet:
      path: /api/readiness
      port: 3002
    initialDelaySeconds: 90
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  resources:
    requests:
      cpu: 100m
      memory: 1000Mi
    limits:
      cpu: 1000m
      memory: 4000Mi

# ── Networking ───────────────────────────────────────────────────────────────
#
# service.ports is the chart's list form of the old flat port/targetPort pair.
service:
  create: true
  name: ccui
  type: ClusterIP
  ports:
    - name: port3002
      port: 3002
      protocol: TCP
      targetPort: 3002

# istio.host is empty here and set to the PR hostname at deploy time. With it
# set the chart's VirtualService matches on :authority for that one hostname
# instead of claiming hosts ["*"] on the gateway, so the preview routes
# alongside the long-lived release rather than competing with it.
istio:
  create: true
  gateway: ccui
  host: ''
