# Dev (long-lived) values for business-booker.
#
# Shaped for the shared chart at infra/helm/opera-app-chart, and converted from
# the Flux HelmRelease that deploys dev today
# (microservices-gitops/opera-dev/apps/business-booker.yaml) so this file starts from
# what is actually running rather than from the preview config.
#
# The dev deploy of pi-front-end-applications is still disabled in
# ci-fe-deploy.yaml and dev continues to reconcile through Flux. This file is
# what a pipeline-driven dev deploy installs when that cuts over; keeping it
# separate from ephemeral-values.yaml means a preview tweak cannot reach dev.
#
# Replaced per-deploy: image.repository, image.tag

# ── Switches ─────────────────────────────────────────────────────────────────

# No progressive delivery for the frontend today — dev has never had a Canary,
# and turning one on is a routing change, not a chart migration.
canary:
  create: false

# The pipeline sets the image tag on every deploy, so nothing should auto-bump
# it. The Flux config this was converted from sets `create: true` with pattern
# "develop"; that belongs to the Flux ImagePolicy in flux-apps and goes away
# with it when dev cuts over to a pipeline deploy.
imageAutomation:
  create: false

pdb:
  create: false

# ── Identity ─────────────────────────────────────────────────────────────────
# applicationName names the Deployment, Service, VirtualService and HPA, and is
# the selector label. service.name is what the VirtualService routes at — the
# chart does not derive one from the other, so both are replaced with the
# release name at deploy time and both are kept here so `helm template` renders
# standalone for local inspection.
applicationName: business-booker
namespace: opera-fe

# Dev pulls from ECR. Repository and tag are both set by the workflow; the
# values here only document the shape.
image:
  repository: 327347623470.dkr.ecr.eu-west-1.amazonaws.com/whitbreaddigital/business-booker
  pullPolicy: IfNotPresent
  tag: ''

# ── Workload ─────────────────────────────────────────────────────────────────
#
# The chart's default preStop sleep and 90s grace period are kept here — a
# long-lived release behind Istio does need to drain.
imagePullSecrets:
  - name: regcred
deployment:
  create: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 9001
    runAsGroup: 9001
    fsGroup: 9001
    seccompProfile:
      type: RuntimeDefault
  containerPorts:
    - name: http
      containerPort: 3002
      protocol: TCP
  dns:
