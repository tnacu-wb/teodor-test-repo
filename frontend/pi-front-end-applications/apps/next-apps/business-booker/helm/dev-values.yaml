  livenessProbe:
    failureThreshold: 6
    httpGet:
      path: /api/liveness
      port: 3002
    initialDelaySeconds: 90
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  readinessProbe:
    failureThreshold: 6
    httpGet:
      path: /api/readiness
      port: 3002
    initialDelaySeconds: 90
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  resources:
    requests:
      cpu: 50m
      memory: 750Mi
    limits:
      cpu: 1000m
      memory: 4000Mi

# ── Networking ───────────────────────────────────────────────────────────────
service:
  create: true
  name: business-booker
  type: ClusterIP
  ports:
    - name: port3002
      port: 3002
      protocol: TCP
      targetPort: 3002
autoscaling:
  create: true
  maxReplicas: 20
  minReplicas: 1
  scaleDownStabilizationSeconds: 300
  scaleUpStabilizationSeconds: 180
  targetCPUUtilizationPercentage: 80

# istio.host stays empty for a long-lived release: the VirtualService claims
# hosts ["*"] on its gateway and picks this app out by path. Only per-PR
# releases set a host (see ephemeral-values.yaml).
istio:
  create: true
  gateway: pi
  regex:
    enabled: true
    pattern: (.*)/business-booker(.*)
  host: ''
