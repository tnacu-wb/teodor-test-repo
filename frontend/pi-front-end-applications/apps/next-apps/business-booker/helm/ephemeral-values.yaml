    - name: NEXT_PUBLIC_COOKIES_DOMAIN
      value: .premierinn.digital
    - name: NEXT_PUBLIC_SECURE2_URL
      value: https://secure2.dev.premierinn.digital
    - name: NEXT_BASIC_AUTH_ID
      value: betatester
    - name: NEXT_BASIC_AUTH_PASSWORD
