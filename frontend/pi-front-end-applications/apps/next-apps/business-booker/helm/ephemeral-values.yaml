  livenessProbe:
    failureThreshold: 6
    httpGet:
      path: /api/liveness
      port: 3002
    initialDelaySeconds: 90
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  readinessProbe:
    failureThreshold: 6
    httpGet:
      path: /api/readiness
      port: 3002
    initialDelaySeconds: 90
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  resources:
    requests:
      cpu: 100m
      memory: 1000Mi
    limits:
      cpu: 1000m
      memory: 4000Mi

# ── Networking ───────────────────────────────────────────────────────────────
#
# service.ports is the chart's list form of the old flat port/targetPort pair.
service:
  create: true
  name: business-booker
  type: ClusterIP
  ports:
    - name: port3002
      port: 3002
      protocol: TCP
      targetPort: 3002

# istio.host is empty here and set to the PR hostname at deploy time. With it
# set the chart's VirtualService matches on :authority for that one hostname
# instead of claiming hosts ["*"] on the gateway, so the preview routes
# alongside the long-lived release rather than competing with it.
istio:
  create: true
  gateway: innbusiness
  host: ''
