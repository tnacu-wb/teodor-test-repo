          name: pi-auth0-credentials
    - name: NEXT_PUBLIC_AUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          key: NEXT_PUBLIC_AUTH_CLIENT_SECRET
          name: pi-auth0-credentials
    - name: NEXT_PUBLIC_AUTH_DOMAIN
      valueFrom:
        secretKeyRef:
          key: NEXT_PUBLIC_AUTH_DOMAIN
