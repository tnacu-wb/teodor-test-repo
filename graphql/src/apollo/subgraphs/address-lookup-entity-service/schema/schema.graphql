schema {
    query: Query
}

type Query {
    partialAddress(partialAddressCriteria: PartialAddressCriteria!): [PartialAddress]
    formattedAddress(identifier: String!): FormattedAddress
}

input PartialAddressCriteria {
    searchTerm: String!
    countryCode: String
}

type PartialAddress {
    id: String!
    addressText: String!
}

type FormattedAddress {
    addressLine1: String!
    addressLine2: String
    addressLine3: String
    addressLine4: String
    addressLine5: String
    companyName: String
    label: String!
    postalCode: String!
    country: String!
}
