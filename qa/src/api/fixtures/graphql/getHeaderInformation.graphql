  query getHeaderInformation($language: String!, $country: String!) {
    headerInformation(country: $country, language: $language) {
      content {
        menu {
          agentMemo
          bookHotel
          business
          changeLogs
          discoverPI
          findBooking
          guestAccount
          language
          languageButton
          logIn
          mobileMenuButton
          tick
        }
      }
    }
  }
