query GetHotelInformation($country: String!, $hotelId: String!, $language: String!) {
    hotelInformation(country: $country, hotelId: $hotelId, language: $language) {
        hotelOpeningDate
        coordinates {
            latitude
            longitude
        }
        messagingFlag {
          color
          description
          text
        }
        address {
            addressLine1
            addressLine2
            addressLine3
            addressLine4
            postalCode
            country
        }
        contactDetails {
            email
            phone
            hotelNationalPhone
        }
        name
        directions
        brand
        bookingFlow {
            bookingFlowItems
            {
                bookingId
                rateCode
            }
        }
        ancillaryCloseout {
            items {
                endDate
                serviceCode
                startDate
                text
                upsellCodes
            }
        }
        announcement {
            title
            announcementSource
            showAnnouncement
            startDate
            endDate
            fullBannerLink
            fullBannerLinkNewTab
            icon
            text
            bbText
            type
        }
    }
}
