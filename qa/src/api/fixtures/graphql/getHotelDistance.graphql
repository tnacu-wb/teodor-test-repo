query hotelDistanceFromSearch($hotelId: String!, $location: String!, $locationFormat: String!, $radius: String!, $radiusUnit: String!) {
  hotelDistanceFromSearch(hotelDistanceFromSearchCriteria: {hotelId: $hotelId, location: $location, locationFormat: $locationFormat, radius: $radius, radiusUnit: $radiusUnit}) {
    distance
  }
}