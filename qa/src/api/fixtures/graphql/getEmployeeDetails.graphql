query getEmployeeDetails($companyId: String!, $employeeId: String!) {
    getEmployeeDetailsV2(companyId: $companyId, employeeId: $employeeId) {
        id
        ghNumber
        emailAddress
        position
        phoneNumber
        mobileNumber
        textConfirmation
        title
        firstName
        lastName
        centralCardId
        address{
            addressLine1
            addressLine2
            addressLine3
            addressLine4
            addressLine5
            postCode
            country
        }
        accessLevel
        employeeStatus
        dialingCode
        employeeAnswers{
            customerReferenceAnswer
            purchaseOrderAnswer
            userDefinedAnswers{
                miID
                miAnswer
            }
        } 
        guestHistoryNumber
        lockedForEditing
        password
    }
}