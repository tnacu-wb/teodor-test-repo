query getPaymentInfo($paymentInfoCriteria: PaymentInfoCriteria!) {
  getPaymentInfo(paymentInfoCriteria: $paymentInfoCriteria) {
    payments {
        paymentDate
        paymentDescription
        failureReason
        paymentFailed
        paymentValue{
            value
            currencyCode
            currencySymbol
        }
    }
  }
}