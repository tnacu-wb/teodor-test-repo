mutation createPaymentMutation(
  $basketReference: String!
  $createPaymentCriteria: CreatePaymentCriteria!
) {
  initiatePayment(
    basketReference: $basketReference
    createPaymentCriteria: $createPaymentCriteria
  ) {
    status
    paymentRequiredDetails {
      paymentRedirect
      sessionId
      template
    }
  }
}