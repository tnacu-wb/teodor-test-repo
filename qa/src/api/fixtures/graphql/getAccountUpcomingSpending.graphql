query getAccountUpcomingSpending($accountId: String!) {
    getAccountUpcomingSpending(accountId: $accountId) {
        expectedSpendTodayDate
        expectedSpendToday
        expectedNextBillingStartDate
        expectedNextBillingEndDate
        expectedNextBilling
        expectedNextPeriodStartDate
        expectedNextPeriodEndDate
        expectedNextPeriod
        currency
        accountStatus
    }
}