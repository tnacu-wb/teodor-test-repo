query hotelInformationBySlug(
  $slug: String!
  $language: String!
  $country: String!
) {
  hotelInformationBySlug(slug: $slug, language: $language, country: $country) {
    galleryImages {
      alt
      caption
      iconSrc
      imageSrc
      thumbnailSrc
    }
    hotelFacilities {
      code
      description
      icon
      isVisible
      name
      weight
    }
    name
    title
    brand
    headline
    address {
      addressLine1
      addressLine2
      addressLine3
      postalCode
    }
    satNavDirections
    directions
    transportInformation
    roomConfiguration {
      tabGroups {
        groupId
        groupName
      }
      tabItems {
        roomDescription
        roomName
        roomType
        images {
          alt
          caption
          iconSrc
          imageSrc
          thumbnailSrc
        }
        facilities {
          weight
          name
          isVisible
          icon
          description
          code
        }
      }
    }
    parkingDescription
    restaurant {
      name
      description
      logoSrc
      menus {
        name
        description
        imageSrc
        menuSrc
        menuLabel
        disclaimer
      }
    }
    coordinates {
      latitude
      longitude
    }
    hotelDescription
    contactDetails {
      phone
      hotelNationalPhone
      email
    }
    tripAdvisorReviews {
      rating
      name
      address
      numberOfReviews
      writeReview
      webUrl
      locationId
      hotelCode
      awards {
        awardType
        year
        image
      }
      reviews {
        publishedDate
        rating
        tripType
        title
        text
        user {
          username
          location
        }
      }
    }
  }
}
