query searchCompanies(
    $searchTerm: String!
    $negotiatedRateCompanies: Boolean!
    $limit: Int!
    $offset: Int!
    ) {
        searchCompanies(
            searchCompaniesCriteria: {
                companyName: $searchTerm
                negotiatedRateCompanies: $negotiatedRateCompanies
                limit: $limit
                offset: $offset
            }
        ) {
            companies {
                name
                address {
                    addressLine1
                    addressLine2
                    addressLine3
                    addressLine4
                    country
                    postalCode
                }
                telephoneNumber
                corpId
                companyId
                profileType
                language
                active
                negotiatedRateEnabled
            }
    }
}