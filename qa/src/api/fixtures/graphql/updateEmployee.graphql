mutation updateEmployee(
    $companyId: String!,
    $employeeId: String!,
    $languageCode: String,
    $updateEmployeeCriteria: EmployeeCriteria!) {
    updateEmployee(
        companyId: $companyId
        employeeId: $employeeId
        languageCode: $languageCode
        updateEmployeeCriteria: $updateEmployeeCriteria
    )
}
